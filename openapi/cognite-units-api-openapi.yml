openapi: 3.2.0
info:
  title: Cognite Units API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Units
  description: 'Units Catalog API provides a standardized list of units that can be used in Cognite Data Fusion.

    The content this API serves is based on the CDF Units Catalog'
paths:
  /units/byids:
    post:
      tags:
      - Units
      summary: Retrieve units by external IDs
      description: Retrieves one or more units by external ID. The response returns the units in the same order as in the request.
      operationId: byIdsUnits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictedItemList_ExternalIdRef_'
        required: true
      responses:
        '200':
          description: Response with a list of units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList_Unit_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: 'const units = await client.units.retrieve([{ externalId: ''temperature:deg_c'' }, { externalId: ''pressure:bar'' }]);'
      - lang: Python
        label: Python SDK
        source: 'res = client.units.retrieve(''temperature:deg_c'')


          res = client.units.retrieve([''temperature:deg_c'', ''pressure:bar''])

          '
  /units/{externalId}:
    get:
      tags:
      - Units
      summary: Retrieve unit by external ID
      description: Retrieve a single unit by its external ID.
      operationId: getUnit
      parameters:
      - name: externalId
        in: path
        required: true
        schema:
          type: string
          description: External ID of the unit
          title: Externalid
        description: External ID of the unit
      responses:
        '200':
          description: Response with a single unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList_Unit_'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
  /units:
    get:
      tags:
      - Units
      summary: List all units
      description: List all units.
      operationId: listUnits
      responses:
        '200':
          description: Response with a list of units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList_Unit_'
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: const units = await client.units.list();
      - lang: Python
        label: Python SDK
        source: 'res = client.units.list()

          '
components:
  schemas:
    UnitConversion:
      properties:
        multiplier:
          type: number
          title: Multiplier
          example: 1
        offset:
          type: number
          title: Offset
          example: -273.15
      type: object
      required:
      - multiplier
      - offset
      title: UnitConversion
    APIError:
      properties:
        message:
          type: string
          title: Message
        code:
          type: integer
          title: Code
      type: object
      required:
      - message
      - code
      title: APIError
    ViewList_Unit_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Unit'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ViewList[Unit]
    ExternalIdRef:
      properties:
        externalId:
          type: string
          title: ExternalId
          description: String-based ID
      additionalProperties: false
      type: object
      required:
      - externalId
      title: ExternalIdRef
    Unit:
      properties:
        externalId:
          type: string
          title: ExternalId
          description: Unique identifier of the unit. Usually in a form of unit_quantity_name:unit_name
          example: temperature:deg_c
        name:
          type: string
          title: Name
          description: A compact name of the unit.
          example: DEG_C
        longName:
          type: string
          title: LongName
          description: A more verbose name of the unit.
          example: degree Celsius
        symbol:
          type: string
          title: Symbol
          description: The symbol for the unit.
          example: Â°C
        aliasNames:
          items:
            type: string
          type: array
          title: AliasNames
          description: A list of alternative aliases (names) for the unit.
          example:
          - Â°C
          - C
          - deg C
          - degC
          - DegC
        quantity:
          type: string
          title: Quantity
          description: Specifies the physical quantity the unit measures.
          example: Temperature
        conversion:
          allOf:
          - $ref: '#/components/schemas/UnitConversion'
          description: An object containing multiplier and offset values for converting between units
          example:
            multiplier: 1
            offset: 273.15
        source:
          title: Source
          description: Source of the unit specification
          nullable: true
          type: string
          example: qudt.org
        sourceReference:
          title: SourceReference
          description: Reference to the source of the unit specification
          nullable: true
          type: string
          example: http://qudt.org/vocab/unit/DEG_C
      additionalProperties: false
      type: object
      required:
      - externalId
      - name
      - longName
      - symbol
      - aliasNames
      - quantity
      - conversion
      title: Unit
      description: 'Unit: This represents a standard measure of a given quantity.


        Examples:


        - Temperature: Degrees Celsius, Degrees Fahrenheit


        - Pressure: Bar, Psi'
    RestrictedItemList_ExternalIdRef_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ExternalIdRef'
          type: array
          title: Items
        ignoreUnknownIds:
          title: IgnoreUnknownIds
          description: Ignore external IDs that are not found. If set to true, no error will be thrown if an external ID is not found.
          default: false
          nullable: true
          type: boolean
          example: false
      additionalProperties: false
      type: object
      required:
      - items
      title: RestrictedItemList[ExternalIdRef]
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

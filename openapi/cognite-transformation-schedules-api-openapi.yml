      x-capability: transformationsAcl:READ
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'schedules_list = client.transformations.schedules.list()

          '
      - lang: Java
        label: Java SDK
        source: "Iterator<List<Transformation.Schedule>> it =   \n          client.transformations().schedules().list();\n\n"

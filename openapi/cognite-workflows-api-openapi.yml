openapi: 3.2.0
info:
  title: Cognite Workflows API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Workflows
  description: 'Define and orchestrate data workflows consisting of CDF Transformations, Cognite Functions, and other processes. This service enables you to build data pipelines and business solutions leveraging the capabilities of CDF and external tools.


    All API and service limitations are listed here.'
paths:
  /workflows:
    post:
      operationId: CreateOrUpdateWorkflow
      summary: Create or update a workflow
      description: '> **Required capabilities:** `workflowOrchestrationACL:WRITE`


        Create or update a workflow. Limited to a single workflow per request.'
      tags:
      - Workflows
      x-capability:
      - workflowOrchestrationACL:WRITE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 1
                  minItems: 1
                  items:
                    type: object
                    properties:
                      externalId:
                        $ref: '#/components/schemas/WorkflowExternalId'
                      description:
                        type: string
                        maxLength: 500
                      dataSetId:
                        $ref: '#/components/schemas/dataSetIdWorkflows'
                      maxConcurrentExecutions:
                        $ref: '#/components/schemas/MaxConcurrentExecutions'
                    required:
                    - externalId
      responses:
        '200':
          description: List of created workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowView'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'from cognite.client.data_classes import WorkflowUpsert

          wf = WorkflowUpsert(external_id="my_workflow", description="my workflow description")

          res = client.workflows.upsert(wf)


          wf2 = WorkflowUpsert(external_id="other", data_set_id=123)

          res = client.workflows.upsert([wf, wf2])

          '
    get:
      operationId: FetchAllWorkflows
      summary: List workflows
      description: '> **Required capabilities:** `workflowOrchestrationACL:READ`


        List workflows in the project.'
      tags:
      - Workflows
      x-capability:
      - workflowOrchestrationACL:READ
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/cursor'
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowView'
                  nextCursor:
                    $ref: '#/components/schemas/nextCursor'
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'res = client.workflows.list(limit=None)

          '
  /workflows/delete:
    post:
      operationId: DeleteWorkflows
      summary: Delete workflows
      description: '> **Required capabilities:** `workflowOrchestrationACL:WRITE`


        Delete workflows, including all associated workflow versions.'
      tags:
      - Workflows
      x-capability:
      - workflowOrchestrationACL:WRITE
      parameters:
      - name: ignoreUnknownIds
        in: query
        required: false
        description: If `true`, ignore unknown workflow ids. If `false`, a `404 Not Found` error is returned and none of the workflows are deleted if any of the workflow ids are unknown.
        schema:
          type: boolean
          default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      externalId:
                        $ref: '#/components/schemas/WorkflowExternalId'
                    required:
                    - externalId
                  required:
                  - items
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'client.workflows.delete("my_workflow")

          '
  /workflows/{workflowExternalId}:
    parameters:
    - name: workflowExternalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkflowExternalId'
    get:
      operationId: fetchWorkflowDetails
      summary: Retrieve a workflow
      description: '> **Required capabilities:** `workflowOrchestrationACL:READ`


        Retrieve a workflow by its external id.'
      tags:
      - Workflows
      x-capability:
      - workflowOrchestrationACL:READ
      responses:
        '200':
          description: Information about the workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowView'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'workflow = client.workflows.retrieve("my_workflow")


          workflow_list = client.workflows.retrieve(["foo", "bar"])

          '
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    MaxConcurrentExecutions:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 10000
      description: Maximum concurrent executions for this workflow. Defaults to the project limit if not specified, explicitly set to null, or omitted on update. Values exceeding the project limit are dynamically capped at runtime. The typical project limit ranges from 50 to 200 concurrent executions.
    limit:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
      description: The maximum number of results to return.
    dataSetIdWorkflows:
      description: 'The unique identifier (ID) of the dataset that this workflow is associated with. \

        A user must have access to this dataset to perform any actions on the workflow, such as viewing, updating, or deleting it. \

        Additionally, to manage any resources connected to the workflow (such as triggers, versions, or executions), the user must also have access to the dataset for viewing, updating, creating, and deleting these resources.

        '
      allOf:
      - $ref: '#/components/schemas/CogniteInternalId'
    CogniteInternalId:
      description: A server-generated ID for the object.
      type: integer
      minimum: 1
      maximum: 9007199254740991
      format: int64
    WorkflowExternalId:
      type: string
      description: Identifier for a workflow. Must be unique for the project. No trailing or leading whitespace and no null characters allowed.
      maxLength: 255
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    WorkflowView:
      title: Workflow
      type: object
      properties:
        externalId:
          $ref: '#/components/schemas/WorkflowExternalId'
        description:
          type: string
          maxLength: 500
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
        dataSetId:
          $ref: '#/components/schemas/dataSetIdWorkflows'
        maxConcurrentExecutions:
          $ref: '#/components/schemas/MaxConcurrentExecutions'
      required:
      - externalId
      - createdTime
      - lastUpdatedTime
    nextCursor:
      description: Cursor to get the next page of results. If not present, no more results are available.
      type: string
      example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
    cursor:
      type: string
      example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
      description: Cursor to use for paging through results. This cursor is returned in the response of a previous request as `nextCursor`. If not specified, start from the first page of results.
  responses:
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

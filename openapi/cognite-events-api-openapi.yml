        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `uniqueValues`: Get unique values (up to max 1000) in the specified property ordered by the frequency.

              Note: When aggregate on the `["metadata"]` property, a value may occur multiple times in one Event for different metadata keys.


openapi: 3.2.0
info:
  title: Cognite Document preview API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Document preview
  x-displayName: Preview
  description: The document preview service is a utility API that can render most document types as an image or PDF.
paths:
  /documents/{documentId}/preview/image/pages/{pageNumber}:
    get:
      tags:
      - Document preview
      summary: Retrieve a image preview of a page from a document
      operationId: documentsPreviewImagePage
      description: '> **Required capabilities:** `filesAcl:READ`


        This endpoint returns a rendered image preview for a specific page of the specified document.


        The `accept` request header MUST be set to `image/png`. Other values will

        give an HTTP 406 error.


        The rendered image will be downsampled to a maximum of 2400x2400 pixels.

        Only PNG format is supported and only the first 10 pages can be rendered.


        Previews will be rendered if neccessary during the request. Be prepared

        for the request to take a few seconds to complete.'
      parameters:
      - in: path
        name: documentId
        schema:
          type: integer
        required: true
        description: Internal ID for document to preview
      - in: path
        name: pageNumber
        schema:
          type: integer
          minimum: 1
          maximum: 10
        required: true
        description: Page number to preview. Starting at 1 for first page
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema:
                description: Rendered PNG image
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:READ
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'client.documents.previews.download_page_as_png("previews", id=123, page_number=5)

          content = client.documents.previews.download_page_as_png_bytes(id=123, page_number=5)


          from IPython.display import Image

          binary_png = client.documents.previews.download_page_as_png_bytes(id=123, page_number=5)

          Image(binary_png)

          '
  /documents/{documentId}/preview/pdf:
    get:
      tags:
      - Document preview
      summary: Retrieve a PDF preview of a document
      operationId: documentsPreviewPdf
      description: '> **Required capabilities:** `filesAcl:READ`


        This endpoint returns a rendered PDF preview for a specified document.


        The `accept` request header MUST be set to `application/pdf`. Other values will

        give an HTTP 406 error.


        This endpoint is optimized for in-browser previews. We reserve the right

        to adjust the quality and other attributes of the output with this in mind.

        Please reach out to us if you have a different use case and requirements.


        Previews will be rendered if neccessary during the request. Be prepared

        for the request to take a few seconds to complete.'
      parameters:
      - $ref: '#/components/parameters/cdfversionheader'
      - in: path
        name: documentId
        schema:
          type: integer
        required: true
        description: Internal ID for document to preview
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                description: Rendered PDF document
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:READ
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'client.documents.previews.download_document_as_pdf("previews", id=123)

          content = client.documents.previews.download_document_as_pdf_bytes(id=123)

          '
  /documents/{documentId}/preview/pdf/temporarylink:
    get:
      tags:
      - Document preview
      summary: Retrieve a temporary link to a PDF preview of a document
      operationId: documentsPreviewPdfTemporaryLink
      description: '> **Required capabilities:** `filesAcl:READ`


        This endpoint works similar as the normal preview endpoint except

        it returns a short-lived temporary link to download the rendered preview instead

        of returning the binary data.'
      parameters:
      - $ref: '#/components/parameters/cdfversionheader'
      - in: path
        name: documentId
        schema:
          type: integer
        required: true
        description: Internal ID for document to preview
      responses:
        '200':
          $ref: '#/components/responses/DocumentsPreviewTemporaryLinkResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:READ
      x-code-samples:
      - lang: Python
        label: Python SDK
        source: 'link = client.documents.previews.retrieve_pdf_link(id=123)

          '
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
  parameters:
    cdfversionheader:
      in: header
      name: cdf-version
      description: cdf version header. Use this to specify the requested CDF release.
      schema:
        type: string
        example: alpha
  responses:
    DocumentsPreviewTemporaryLinkResponse:
      description: OK
      content:
        application/json:
          schema:
            description: 'A temporary link to download a preview of the document. The link is reachable without additional authentication details for a limited time.

              '
            type: object
            required:
            - temporaryLink
            - expirationTime
            properties:
              temporaryLink:
                type: string
              expirationTime:
                example: 1519862400000
                allOf:
                - $ref: '#/components/schemas/EpochTimestamp'
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

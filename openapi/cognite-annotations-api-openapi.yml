      type: object
    Annotations.Boolean:
      additionalProperties: false
      description: The boolean value of something
      properties:
        description:
          default: null
          description: The description of a primitive
          maxLength: 500
          type: string
        type:
          const: boolean
          type: string
        value:
          description: The boolean value
          type: boolean
      required:
      - type
      - value
      title: primitives.attributes.Boolean
      type: object
    Annotations.View:
      additionalProperties: false
      description: Defines a DMS source (e.g. view)
      properties:
        type:
          const: view
          type: string
        space:
          description: Id of the space that the view belongs to
          maxLength: 43
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,41}[a-zA-Z0-9]?$
          type: string
        externalId:
          description: External id of the view
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z]([a-zA-Z0-9_]{0,253}[a-zA-Z0-9])?$
          type: string
        version:
          description: Version of the view
          maxLength: 43
          minLength: 1
          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9_-]{0,41}[a-zA-Z0-9])?$
          type: string
      required:
      - type
      - space
      - externalId
      - version
      title: primitives.references.View
      type: object
    Annotations.Box:
      additionalProperties: false
      description: 'A box in 3D space, defined by a 4x4 row-major homogeneous transformation matrix that rotates,

        translates and scales a box centered at the origin to its location and orientation in 3D space.

        The box that is transformed is the axis-aligned cube spanning the volume between

        the points (-1, -1, -1) and (1, 1, 1).'
      properties:
        label:
          default: null
          description: The label describing what type of object it is
          maxLength: 128
          minLength: 1
          type: string
        confidence:
          default: null
          description: The confidence score for the primitive. It should be between 0 and 1.
          maximum: 1
          minimum: 0
          type: number
        matrix:
          description: The homogeneous transformation matrix
          items:
            type: number
          maxItems: 16
          minItems: 16
          type: array
      required:
      - matrix
      title: primitives.geometry3d.Box
      type: object
    Annotations.Classification:
      additionalProperties: false
      description: 'Models an image classification represented by a label, and optionally a

        confidence value.'
      properties:
        label:
          description: The label describing what type of object it is
          maxLength: 128
          minLength: 1
          type: string
        confidence:
          default: null
          description: The confidence score for the primitive. It should be between 0 and 1.
          maximum: 1
          minimum: 0
          type: number
      required:
      - label
      title: images.Classification
      type: object
    AnnotationsV2UpdateDataSchema:
      type: object
      description: 'Each fields represent a "delta" that will be applied onto the corresponding field of the original

        annotation.



        ### Updating Annotation Type or Data

        Ensure that the new annotation data conforms to the new annotation type, otherwise the call will fail.'
      properties:
        annotationType:
          type: object
          required:
          - set
          properties:
            set:
              $ref: '#/components/schemas/AnnotationType'
        data:
          type: object
          required:
          - set
          properties:
            set:
              $ref: '#/components/schemas/AnnotationData'
        status:
          type: object
          required:
          - set
          properties:
            set:
              $ref: '#/components/schemas/Status'
      example:
        data:
          set:
            assetRef:
              externalId: abc
            symbolRegion:
              xMin: 0.1
              xMax: 0.2
              yMin: 0.1
              yMax: 0.2
            textRegion:
              xMin: 0.4
              xMax: 0.5
              yMin: 0.4
              yMax: 0.5
            pageNumber: 43
    SemanticVersion:
      type: string
      description: A version number in the SemVer sense. See [semver.org](https://semver.org/) for the specification.
      example: 1.2.1
      minLength: 1
      maxLength: 255
    Annotations.Numerical:
      additionalProperties: false
      description: The numerical value of something
      properties:
        description:
          default: null
          description: The description of a primitive
          maxLength: 500
          type: string
        type:
          const: numerical
          type: string
        value:
          anyOf:
          - type: integer
          - type: number
          description: The numerical value
      required:
      - type
      - value
      title: primitives.attributes.Numerical
      type: object
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    Annotations.InstanceRef:
      additionalProperties: false
      description: 'A reference to an DMS instance,

        defined by the instance itself and the sources (views)

        that define how the data should be interpreted'
      properties:
        sources:
          description: References to views
          items:
            discriminator:
              mapping:
                view: '#/components/schemas/Annotations.View'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Annotations.View'
          maxItems: 10
          type: array
        instanceType:
          description: The type of instance, an edge or a node.
          enum:
          - node
          - edge
          type: string
        externalId:
          description: External id of the instance
          maxLength: 255
          minLength: 1
          pattern: ^[^\x00]{1,255}$
          type: string
        space:
          description: Id of the space that the instance belongs to
          maxLength: 43
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,41}[a-zA-Z0-9]?$
          type: string
      required:
      - sources
      - instanceType
      - externalId
      - space
      title: primitives.references.InstanceRef
      type: object
    AnnotationsV2FilterSchema:
      type: object
      description: A filter to apply on annotations
      required:
      - annotatedResourceType
      - annotatedResourceIds
      properties:
        annotatedResourceType:
          $ref: '#/components/schemas/AnnotatedResourceType'
        annotatedResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
          minItems: 1
          maxItems: 1000
        annotationType:
          $ref: '#/components/schemas/AnnotationType'

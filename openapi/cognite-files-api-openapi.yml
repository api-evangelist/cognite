      - dataModelInstancesAcl:WRITE
components:
  schemas:
    SetStringField:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          type: string
    FileDeleteByIds:
      type: object
      allOf:
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/FileDeleteByIdEither'
            maxItems: 1000
            minItems: 1
      - $ref: '#/components/schemas/IgnoreUnknownIdsField'
    LineString:
      type: object
      required:
      - type

        source: 'client.files.delete(id=[1,2,3], external_id="3")

          '
      - lang: Java
        label: Java SDK
        source: "List<Item> deleteByExternalIds = List.of(Item.newBuilder() \n          .setExternalId(\"10\").build()); \nList<Item> deleteItemsResults = client.files().delete(deleteByExternalIds); \n\nList<Item> deleteByInternalIds = List.of(Item.newBuilder() \n          .setId(10).build()); \nList<Item> deleteItemsResults = client.files().delete(deleteByInternalIds); \n\n"
  /files/downloadlink:
    post:
      tags:
      - Files
      summary: Download files
      description: '> **Required capabilities:** `filesAcl:READ`

        >

        > Or `dataModelsAcl:READ` (scope spaceId: `cdf_cdm`) and `dataModelInstancesAcl:READ`


        Retrieves a list of download URLs for the specified list of file IDs.

        After getting the download links, the client has to issue a GET request to the returned URLs,

        which will respond with the contents of the file. The links will by default expire after 30 seconds.

        If providing the query parameter extendedExpiration the links will expire after 1 hour.


        ### Request throttling

        Please note that this endpoint is subject to the new throttling policy, which imposes limits on both request rate and concurrency.

        For more details, please refer to the Files resource documentation.'
      operationId: downloadLinks
      parameters:
      - in: query
        name: extendedExpiration
        schema:
          type: boolean
          default: false
          description: if set to true, will extend the expiration period of the link to 1 hour.
      requestBody:

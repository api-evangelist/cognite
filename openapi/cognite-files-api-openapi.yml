      - lang: Python
        label: Python SDK
        source: 'client.files.download(directory="my_directory", id=[1,2,3], external_id=["abc", "def"])


          client.files.download(directory=".", id=[1,2,3])

          '
      - lang: Java
        label: Java SDK
        source: "List<Item> downloadByExternalIds = List.of(Item.newBuilder() \n          .setExternalId(\"10\").build()); \nList<FileContainer> downloadFilesResults = \n          client.files().downloadToPath(downloadByExternalIds, Paths.get(\"\")); \n\nList<Item> downloadByInternallIds = List.of(Item.newBuilder() \n          .setId(10).build()); \nList<FileContainer> downloadFilesResults = \n          client.files().downloadToPath(downloadByInternallIds, Paths.get(\"\")); \n\n"
  /files/icon:
    get:
      tags:
      - Files
      summary: Get icon
      description: '> **Required capabilities:** `filesAcl:READ`

        >

        > Or `dataModelsAcl:READ` (scope spaceId: `cdf_cdm`) and `dataModelInstancesAcl:READ`


        The GET /files/icon operation can be used to get an image representation of a file.


        Either id or externalId must be provided as a query parameter (but not both).

        Supported file formats:

        - Normal jpeg and png files are currently fully supported.

        - Other image file formats might work, but continued support for these are not guaranteed.

        - Currently only supporting thumbnails for image files.

        Attempts to get icon for unsupported files will result in status 400.


        ### Request throttling

        Please note that this endpoint is subject to the new throttling policy, which imposes limits on both request rate and concurrency.

        For more details, please refer to the Files resource documentation.'

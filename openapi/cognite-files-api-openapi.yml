      - $ref: '#/components/schemas/ObjectPatchAddRemove'
    FileExternalIdEither:
      oneOf:
      - $ref: '#/components/schemas/FileExternalId'
      - $ref: '#/components/schemas/FileInstanceId'
    FileFilter:

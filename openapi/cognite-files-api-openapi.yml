        type:
          type: string
          enum:
          - LineString
        coordinates:
          $ref: '#/components/schemas/LineStringCoordinates'
    CogniteInternalId:
      description: A server-generated ID for the object.
      type: integer
      minimum: 1
      maximum: 9007199254740991
      format: int64
    LabelsAddRemove:
      type: object
      properties:
        add:
          type: array
          description: A list of the labels to add to a resource.
          minItems: 0
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Label'
        remove:
          type: array
          description: A list of the labels to remove from a resource.
          minItems: 0
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Label'
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true

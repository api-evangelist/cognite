      - in: query
        name: space
        schema:
          $ref: '#/components/schemas/InstanceSpace'
      - in: query
        name: instanceExternalId
        schema:
          $ref: '#/components/schemas/InstanceExternalId'
      responses:
        '200':
          description: Thumbnail image (JPEG)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':

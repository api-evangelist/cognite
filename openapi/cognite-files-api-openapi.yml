      x-cdm-capability:
      - dataModelInstancesAcl:READ
  /files/update:
    post:
      tags:
      - Files
      summary: Update files
      description: '> **Required capabilities:** `filesAcl:WRITE`


        Updates the information for the files specified in the request body.


        If you want to update the file content, uploaded using the uploadUrl, please

        use the initFileUpload request with the query parameter ''overwrite=true''.

        Alternatively, delete and recreate the file.


        For primitive fields (String, Long, Int), use ''set'': ''value'' to update

        value; use ''setNull'': true to set that field to null.


        For the Json Array field (e.g. assetIds and securityCategories): Use either only ''set'', or a combination of ''add'' and/or ''remove''.


        __AssetIds update examples__:


        Example request body to overwrite assetIds with a new set, asset ID 1 and 2.


        ```

        {

        "items": [

        {

        "id": 1,

        "update": {

        "assetIds" : {

        "set" : [ 1, 2 ]

        }

        }

        }

        ]

        }

        ```


        Example request body to add one asset Id, and remove another asset ID.


        ```

        {

        "items": [

        {

        "id": 1,

        "update": {

        "assetIds" : {

        "add" : [ 3 ],

        "remove": [ 2 ]

        }

        }

        }

        ]

        }

        ```


        __Metadata update examples__:


        Example request body to overwrite metadata with a new set.

        ```

        {

        "items": [

        {

        "id": 1,

        "update": {

        "metadata": {

        "set": {

        "key1": "value1",

        "key2": "value2"

        }

        }

        }

        }

        ]

        }

        ```


        Example request body to add two key-value pairs and remove two other key-value pairs by key for

        the metadata field.

        ```

        {

        "items": [

        {

        "id": 1,

        "update": {

        "metadata": {

        "add": {

        "key3": "value3",

        "key4": "value4"

        },

        "remove": [

        "key1",

        "key2"

        ]

        }

        }

        }

        ]

        }

        ```


        ### Request throttling

        Please note that this endpoint is subject to the new throttling policy, which imposes limits on both request rate and concurrency.

        For more details, please refer to the Files resource documentation.'
      operationId: updateFiles
      requestBody:
        description: The JSON request body which specifies which files and fields to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataFileChange'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/FileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:WRITE
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: "const files = await client.files.update([{\n  id: 123,\n  update: {\n    source: { set: 'new source' }\n  }\n}]);"
      - lang: Python
        label: Python SDK
        source: 'file_metadata = client.files.retrieve(id=1)

          file_metadata.description = "New description"

          res = client.files.update(file_metadata)


          from cognite.client.data_classes import FileMetadataUpdate

          my_update = FileMetadataUpdate(id=1).source.set("new source").metadata.add({"key": "value"})

          res = client.files.update(my_update)


          from cognite.client.data_classes import FileMetadataUpdate

          my_update = FileMetadataUpdate(id=1).labels.add(["PUMP", "VERIFIED"])

          res = client.files.update(my_update)


          from cognite.client.data_classes import FileMetadataUpdate

          my_update = FileMetadataUpdate(id=1).labels.remove("PUMP")

          res = client.files.update(my_update)

          '
      - lang: Java
        label: Java SDK
        source: "List<FileMetadata> editFilesInput = listFilesResults.stream() \n .map(fileMetadata -> fileMetadata.toBuilder() \n .putMetadata(\"addedField\", \"new field value\") \n .build()) \n .collect(Collectors.toList()); \n\n List<FileMetadata> editFilesResult = \n          client.files().upsert(editFilesInput); \n\n"
  /files/aggregate:
    post:
      tags:
      - Files
      summary: Aggregate files
      description: '> **Required capabilities:** `filesAcl:READ`


        Calculate aggregates for files, based on optional filter specification.

        Returns the following aggregates: `count`


        ### Request throttling

        This endpoint is intended for data analytics and exploration purposes. It is not designed to support high-throughput data retrieval.

        Please note that this endpoint is subject to the new throttling policy, which imposes limits on both request rate and concurrency.

        For more details, please refer to the Files resource documentation.'
      operationId: aggregateFiles
      requestBody:
        description: Files aggregate request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileFilter'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/FilesAggregateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:READ
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: 'const aggregates = await client.files.aggregate({ filter: { uploaded: true } });

          console.log(''Number of uploaded files: '', aggregates[0].count)'
      - lang: Python
        label: Python SDK
        source: 'aggregate_uploaded = client.files.aggregate(filter={"uploaded": True})

          '
      - lang: Java
        label: Java SDK
        source: "Aggregate fileAggregate = \n          client.files().aggregate(Request.create() \n          .withFilterParameter(\"source\", \"source\")); \n\n"
  /files/completemultipartupload:
    post:
      tags:
      - Files
      summary: Complete multipart upload
      description: '> **Required capabilities:** `filesAcl:WRITE`

        >

        > Or `dataModelsAcl:READ` (scope spaceId: `cdf_cdm`) and `dataModelInstancesAcl:WRITE`


        Completes a multipart file upload.

        This endpoint must be called by the client when an ''initMultiPartUpload'' operation (POST /files/initmultipartupload) was called,

        and all file content parts have been successfully uploaded using PUT for all upload URLs.

        Either `id` or `externalId` must be specified in the request body, but not both. The `uploadId` is also required.

        The values for these properties can be retrieved from the response of the initMultiPartUpload operation.


        ### Request throttling

        Please note that this endpoint is subject to the new throttling policy, which imposes limits on both request rate and concurrency.

        For more details, please refer to the Files resource documentation.'
      operationId: completeMultiPartUpload
      requestBody:
        required: true
        description: The JSON request body which specifies which file id/externalId and uploadId to complete the multipart upload for.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultiPartUpload'
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - filesAcl:WRITE
      x-cdm-capability:
      - dataModelInstancesAcl:WRITE
components:
  schemas:

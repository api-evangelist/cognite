      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FilesAggregate'
    PartitionObjectLimited10:
      type: object
      properties:
        partition:
          $ref: '#/components/schemas/PartitionLimited10'

        - $ref: '#/components/schemas/SequencesCardinalityPropertiesAggregate'
        - $ref: '#/components/schemas/SequencesUniqueValuesAggregate'
        - $ref: '#/components/schemas/SequencesUniquePropertiesAggregate'
    DataGetSequence:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GetSequenceDTO'
    SequencesInAggregateValues:
      description: 'The property keys or property values (depending on the `aggregate` operation) on which you want to

        filter the intermediate aggregate results.

        '
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/SequencesInAggregateValue'
    Cursor:
      type: object
      properties:
        cursor:
          type: string
          example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
    SequenceChangeDTO:
      required:
      - update

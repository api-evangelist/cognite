            description:
              $ref: '#/components/schemas/SinglePatchString'
            assetId:
              $ref: '#/components/schemas/SinglePatchLong'
            externalId:
              $ref: '#/components/schemas/SinglePatchString'
            metadata:
              $ref: '#/components/schemas/ObjectPatch'
            dataSetId:
              $ref: '#/components/schemas/SinglePatchLong'
            columns:
              $ref: '#/components/schemas/SequenceColumnChangeDTO'
    SequencesCountAggregateResponse:
      type: object
      title: Count
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - count
            properties:
              count:
                type: integer
                format: int64
                description: The number of sequences that match the given filters.
    SequencesSortItem:
      type: object
      required:
      - property
      properties:
        property:
          type: array
          description: "Property to sort on.\nSorting can be done on the following properties:\n  | Property                          |\n  |-----------------------------------|\n  | `['assetId']`                     |\n  | `['createdTime']`                 |\n  | `['dataSetId']`                   |\n  | `['description']`                 |\n  | `['externalId']`                  |\n  | `['lastUpdatedTime']`             |\n  | `['metadata', '<someCustomKey>']` |\n  | `['name']`                        |\n  | `['_score_']`                     |"
          minItems: 1
          maxItems: 2
          items:
            type: string
            maxLength: 128
        order:
          type: string
          description: 'The `order` attribute is optional and defaults to `desc` for `_score_` and `asc` for all

            other properties.'
          enum:
          - asc
          - desc
        nulls:
          type: string
          description: 'The `nulls` attribute is optional and defaults to `auto`. `auto` is translated to `last`

            for the `asc` order and to `first` for the `desc` order.'
          enum:
          - first
          - last
          - auto
          default: auto
    SinglePatchString:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetStringField'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the string, or remove the value.
    EpochTimestampRange:
      description: Range between two timestamps (inclusive).
      type: object
      properties:
        max:
          description: Maximum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
        min:
          description: Minimum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
    SequencesBoolFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It is built by nesting one or more Boolean clauses, each of which is one of `and`, `or`, and `not`.

        Each such clause contains one or more child clauses (though `not` can only have one).

        Each child clause can be either another Boolean clause or a leaf filter.

        '
      title: Boolean filter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            description: All of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            maxItems: 99
            items:
              $ref: '#/components/schemas/SequencesFilterLanguage'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            description: At least one of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            maxItems: 99
            items:
              $ref: '#/components/schemas/SequencesFilterLanguage'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Filter DSL
            description: Sub-clauses in the query must not appear in matching items.
            type: object
            allOf:
            - $ref: '#/components/schemas/SequencesFilterLanguage'
    SequencesCountAggregate:
      type: object
      title: Count
      properties:
        aggregate:
          description: 'The `count` aggregation gets the number of sequences that match the filter(s). This is the

            default aggregation, which will also be applied if `aggregate` is not specified.

            '
          type: string
          enum:
          - count
    DataSequenceDataDeleteRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SequenceDeleteDataRequest'
          minItems: 1
          maxItems: 1000
    SequencesValues:
      description: 'One or more values that you wish to find in the provided properties.

        '
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/SequencesValue'
    SequenceDataInsertion:
      type: object
      required:
      - columns
      - rows
      description: Data from a sequence.
      properties:
        columns:
          type: array
          description: Column external IDs in the same order as the values for each row.
          items:
            type: string
          minItems: 1
          maxItems: 200
        rows:
          type: array
          description: List of rows. The number of rows per request is limited to 10000. The total number of values, including nulls, in a single request is limited to 100000.
          items:
            $ref: '#/components/schemas/SequenceRowDTO'
          minItems: 1
          maxItems: 10000
    SequencesStringValue:
      title: String
      description: 'A value that you wish to find in the provided property.

        '
      type: string
      maxLength: 256
    SequencesUniqueValuesAggregate:
      title: UniqueValues
      allOf:
      - type: object
        required:
        - aggregate
        properties:
          aggregate:
            description: 'The `uniqueValues` aggregation gets, from the sequences that match the filter(s),

              the set of unique values (up to max 1000) that are taken on by the given property. For each such

              value, the aggregation result will also specify the frequency - that is, the number of sequences

              that match the filter(s) and have that property value. The results are ordered by frequency in

              descending order.

              '
            type: string
            enum:
            - uniqueValues
      - $ref: '#/components/schemas/SequencesAggregateProperties'
    DataResourceIdsWithIgnoreUnknownIds:
      type: object
      allOf:
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              oneOf:
              - type: object
                title: Select by Id
                properties:
                  id:
                    $ref: '#/components/schemas/CogniteInternalId'
              - type: object
                title: Select by ExternalId
                properties:
                  externalId:
                    $ref: '#/components/schemas/CogniteExternalId'
            minItems: 1
            maxItems: 1000
      - $ref: '#/components/schemas/IgnoreUnknownIdsField'
    SequencesInFilter:
      type: object
      title: in
      required:
      - in
      properties:
        in:
          required:
          - property
          - values
          description: 'Matches items where the given property is **exactly** equal to one of the given values.

            This filter can only be applied to single-valued properties.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            values:
              $ref: '#/components/schemas/SequencesValues'
    SequencesAggregatePath:
      type: object
      required:
      - path
      properties:
        path:
          description: The scope within which properties should be aggregated. The only value that is currently allowed is `['metadata']`, which will aggregate metadata keys.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
            - metadata
    SequencesRangeAggregateFilter:
      type: object
      title: range
      required:
      - range
      properties:
        range:
          description: "Matches intermediate aggregation results where the property key or the property value is within the\nprovided range. When the `aggregate` operation is `uniqueProperties` or `cardinalityProperties`,\nproperty _keys_ will be targeted; when it is `uniqueValues` or `cardinalityValues`, property \n_values_ will be targeted.\n\nAt least one of the following bounds must be specified:\n- `gte`: Greater than or equal to.\n- `gt`: Greater than.\n- `lte`: Less than or equal to.\n- `lt`: Less than.\n\nIt is not valid to specify both inclusive and exclusive bounds \"on the same side\" together:\nat most one of `lte` and `lt` may be specified, and at most one of `gte` and `gt`.\n\nIn the case of `aggregate` being `uniqueProperties` or `cardinalityProperties`,\n`gte`/`gt`/`lte`/`lt` must be set to a string. In the case of `aggregate` being `uniqueValues` or\n`cardinalityValues`, this filter may only be applied to string properties or number properties,\nwith `gte`/`gt`/`lte`/`lt` containing values of the corresponding type.\n"
          type: object
          properties:
            gte:
              $ref: '#/components/schemas/SequencesRangeAggregateValue'
            gt:
              $ref: '#/components/schemas/SequencesRangeAggregateValue'
            lte:
              $ref: '#/components/schemas/SequencesRangeAggregateValue'
            lt:
              $ref: '#/components/schemas/SequencesRangeAggregateValue'
    SequenceGetDataWithCursor:
      allOf:
      - $ref: '#/components/schemas/SequenceGetData'
      - properties:
          nextCursor:
            type: string
            description: Cursor to get the next page of results (if available).
    SinglePatchRequiredString:
      title: set
      type: object
      properties:
        set:
          type: string
      description: Set a new value for the string.
      required:
      - set
    SequencesBoolAggregateFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It''s built by nesting one or more Boolean clauses, each of which is one of `and`, `or`, and `not`.

        Each such clause contains one or more child clauses (though `not` can only have one).

        Each child clause can be either another Boolean clause or a leaf filter.

        '
      title: Boolean filter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _all_ of the given

              sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/SequencesAggregateFilter'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _at least one_

              (but potentially many or even all) of the given sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/SequencesAggregateFilter'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that do _not_ match the given

              sub-clause.

              '
            type: object
            allOf:
            - $ref: '#/components/schemas/SequencesAggregateFilter'

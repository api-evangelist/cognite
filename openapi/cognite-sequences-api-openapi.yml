    SequencesPrefixAggregateValue:
      title: String
      description: 'A string value that represents either a property key or a property value, depending on the

        `aggregate` operation.

        '
      type: string
      maxLength: 256
    SequenceValueTypeEnum:
      type: string
      description: What type the datapoints in a column will have. DOUBLE is restricted to the range [-1E100, 1E100]
      default: DOUBLE
      enum:
      - STRING
      - DOUBLE
      - LONG
    RemoveField:
      title: remove
      type: object
      required:
      - setNull
      properties:
        setNull:
          type: boolean
          example: true
    SequencesAggregateProperties:
      type: object
      required:
      - properties
      properties:
        properties:
          type: array
          description: 'The properties to which the aggregation should be applied. While this parameter is a list, it

            currently only accepts one element. Each element is an object with a single field called `property`,

            whose value is another list (in order to accommodate nested properties). Thus, a top-level property

            `name` must be specified as `[{"property": ["name"]}]`, and a metadata property `tag` must be

            specified as `[{"property": ["metadata", "tag"]}]`.


            The supported top-level properties are:

            - `assetId`

            - `assetRootId`

            - `createdTime`

            - `dataSetId`

            - `description`

            - `externalId`

            - `id`

            - `lastUpdatedTime`

            - `name`

            '
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - property
            properties:
              property:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  type: string
                  minLength: 1
                  maxLength: 128
    SequencesPrefixFilter:
      type: object
      title: prefix
      required:
      - prefix
      properties:
        prefix:
          required:
          - property
          - value
          description: 'Matches items where the provided property begins with the given text.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            value:
              $ref: '#/components/schemas/SequencesStringValue'
    SequenceDeleteDataRequest:

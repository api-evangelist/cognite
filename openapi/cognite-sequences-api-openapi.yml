          $ref: '#/components/schemas/CogniteExternalId'
        metadata:
          type: object
          example:
            extracted-by: cognite
          description: 'Custom, application specific metadata. String key -> String value. Maximum length of key is 128 bytes, up to 256 key-value pairs, up to a total size of 10000 bytes across all keys and values.

            '
          additionalProperties:
            type: string
        columns:
          type: array
          description: List of column definitions. Maximum number of numeric columns is 400. Maximum number of string columns is 200. Maximum total number of columns is 400.
          items:
            $ref: '#/components/schemas/PostSequenceColumnDTO'
          minItems: 1
          maxItems: 400
        dataSetId:
          $ref: '#/components/schemas/DataSetId'
    SequencesValue:
      description: 'A value that you wish to find in the provided property.

        '
      oneOf:
      - type: string
        maxLength: 256
      - type: number
      - type: integer
      - type: boolean
    DataResourceIdsWithIgnoreUnknownIds:
      type: object
      allOf:
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              oneOf:
              - type: object
                title: Select by Id
                properties:
                  id:
                    $ref: '#/components/schemas/CogniteInternalId'
              - type: object
                title: Select by ExternalId
                properties:
                  externalId:
                    $ref: '#/components/schemas/CogniteExternalId'
            minItems: 1
            maxItems: 1000
      - $ref: '#/components/schemas/IgnoreUnknownIdsField'
    DataSetInternalId:
      type: object
      title: DataSetInternalId
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
    SequencesFilterProperty:
      description: "The property on which you want to filter. May be either:\n- A single-element list that contains the name of one of the predefined top-level\n  properties, in which case the filter will be applied to that top-level property.\n- A single-element list that contains `'metadata'`, in which case the filter will be applied\n  to _all_ metadata properties.\n- A two-element list where the first element is `'metadata'` and the second one is any\n  string, in which case the filter will be applied to metadata properties with that name.\n"
      type: array
      minItems: 1
      maxItems: 2
      items:
        type: string
        minLength: 1
        maxLength: 256
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    SequenceDataRequest:
      type: object
      description: Parameters describing a query for datapoints.
      oneOf:
      - required:
        - id
        title: Select by Id
        allOf:
        - $ref: '#/components/schemas/SequenceDataRequestDTO'
        - properties:
            id:
              $ref: '#/components/schemas/CogniteInternalId'
      - required:
        - externalId
        title: Select by ExternalId
        allOf:
        - $ref: '#/components/schemas/SequenceDataRequestDTO'
        - properties:
            externalId:
              $ref: '#/components/schemas/CogniteExternalId'
    SequenceItemDTO:
      oneOf:
      - type: number
        description: JSON element of type corresponding to the column type. May include NULL.
        example: 10000.123
      - type: string
        description: JSON element of type corresponding to the column type. May include NULL.
        example: 'ON'
    SequencesPrefixAggregateValue:
      title: String
      description: 'A string value that represents either a property key or a property value, depending on the

        `aggregate` operation.

        '
      type: string
      maxLength: 256
    SequencesAggregateProperties:
      type: object
      required:
      - properties
      properties:
        properties:
          type: array
          description: "The properties to which the aggregation should be applied. While this parameter is a list, it\r\ncurrently only accepts one element. Each element is an object with a single field called `property`,\r\nwhose value is another list (in order to accommodate nested properties). Thus, a top-level property\r\n`name` must be specified as `[{\"property\": [\"name\"]}]`, and a metadata property `tag` must be\r\nspecified as `[{\"property\": [\"metadata\", \"tag\"]}]`.\r\n\r\nThe supported top-level properties are:\r\n- `assetId`\r\n- `assetRootId`\r\n- `createdTime`\r\n- `dataSetId`\r\n- `description`\r\n- `externalId`\r\n- `id`\r\n- `lastUpdatedTime`\r\n- `name`\r\n"
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - property
            properties:
              property:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  type: string
                  minLength: 1
                  maxLength: 128
    AssetInternalId:
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
    SequencesLeafFilter:
      description: 'Leaf filter.

        '
      title: Leaf filter
      type: object
      oneOf:
      - $ref: '#/components/schemas/SequencesEqualsFilter'
      - $ref: '#/components/schemas/SequencesInFilter'
      - $ref: '#/components/schemas/SequencesRangeFilter'
      - $ref: '#/components/schemas/SequencesPrefixFilter'
      - $ref: '#/components/schemas/SequencesExistsFilter'
      - $ref: '#/components/schemas/SequencesContainsAnyFilter'
      - $ref: '#/components/schemas/SequencesContainsAllFilter'
      - $ref: '#/components/schemas/SequencesSearchFilter'
    SequenceDeleteDataRequest:
      type: object
      description: Parameters describing datapoints to be deleted.
      oneOf:
      - required:
        - id
        title: Select by Id
        allOf:
        - $ref: '#/components/schemas/SequenceDataDeleteRequestDTO'
        - properties:
            id:
              $ref: '#/components/schemas/CogniteInternalId'
      - required:
        - externalId
        title: Select by ExternalId
        allOf:
        - $ref: '#/components/schemas/SequenceDataDeleteRequestDTO'
        - properties:
            externalId:
              $ref: '#/components/schemas/CogniteExternalId'
    AssetExternalId:
      type: object
      required:
      - externalId
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
    DataSetIdEither:
      oneOf:
      - $ref: '#/components/schemas/DataSetInternalId'
      - $ref: '#/components/schemas/DataSetExternalId'
    SequenceDataRequestDTO:
      type: object
      description: A request for datapoints stored.
      properties:
        start:
          type: integer
          description: Lowest row number included.
          default: 0
          format: int64
        end:
          type: integer
          description: Get rows up to, but excluding, this row number. Default - No limit.
          example: 1
          format: int64
        limit:
          type: integer
          description: Maximum number of rows returned in one request. API might return less even if there's more data, but it will provide a cursor for continuation. If there's more data beyond this limit, a cursor will be returned to simplify further fetching of data.
          minimum: 1
          maximum: 10000
          default: 100
          example: 1
          format: int32
        cursor:
          type: string
          description: Cursor for pagination returned from a previous request. Apart from this cursor, the rest of the request object is the same as for the original request.
        columns:
          type: array
          description: 'Columns to include. Specified as a list of the `externalId` of each column to include.

            If this filter isn''t set, all available columns will be returned.

            '
          items:
            type: string
          minItems: 1
          maxItems: 400
    SequencesUpdate:
      oneOf:
      - $ref: '#/components/schemas/SequencesUpdateById'
      - $ref: '#/components/schemas/SequencesUpdateByExternalId'
    SequencesRangeAggregateValue:
      description: 'An upper or lower bound for a property key or property value (depending on which `aggregate` was

        specified at the top level of the aggregation request).

        '
      oneOf:
      - type: string
        maxLength: 256
      - type: number
      - type: integer
    SequencesAdvancedListDTO:
      allOf:
      - type: object
        properties:
          filter:
            $ref: '#/components/schemas/SequenceFilter'
          advancedFilter:
            $ref: '#/components/schemas/SequencesFilterLanguage'
          limit:
            description: Returns up to this many results per page.
            maximum: 1000
            minimum: 1
            type: integer
            format: int32
            default: 100
      - $ref: '#/components/schemas/Cursor'
      - $ref: '#/components/schemas/PartitionObject'
      - $ref: '#/components/schemas/SequencesSort'
    EpochTimestampRange:
      description: Range between two timestamps (inclusive).
      type: object
      properties:
        max:
          description: Maximum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
        min:
          description: Minimum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
    DataGetSequence:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GetSequenceDTO'
    SequenceLatestDataRequest:
      type: object
      description: Parameters describing a query for the last row in a sequence.
      oneOf:
      - required:
        - id
        title: Select by Id
        allOf:
        - $ref: '#/components/schemas/SequenceLatestDataRequestDTO'
        - properties:
            id:
              $ref: '#/components/schemas/CogniteInternalId'
      - required:
        - externalId
        title: Select by ExternalId
        allOf:
        - $ref: '#/components/schemas/SequenceLatestDataRequestDTO'
        - properties:
            externalId:
              $ref: '#/components/schemas/CogniteExternalId'
    SequencesContainsAnyFilter:
      type: object
      title: containsAny
      required:
      - containsAny
      properties:
        containsAny:
          required:
          - property
          - values
          description: 'Matches items where the property contains one or more of the given values.

            This filter can only be applied to multivalued properties.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            values:
              $ref: '#/components/schemas/SequencesValues'
    SequencesSearchFilter:
      type: object
      title: search
      required:
      - search
      properties:
        search:
          required:
          - property
          - value
          description: 'Matches items where the provided string property contains the given value according to a fuzzy search.

            The value may exist anywhere in the string, even as a part of a word or with some grammatical

            variations (e.g., searching for "run" will also find "ran").


            The supported properties are `name` and `description`. It''s also possible to set `property`

            to `["query"]`, in which case both `name` and `description` will be searched.


            When the `search` filter is being used, and it''s not nested inside a `not` filter (directly or indirectly),

            and no `sort` is specified, the results will be ranked according to how good the match is.

            When the `query` ''property'' is specified, matches in `name` will rank higher than matches in `description`.

            The `search` filter may be used at most twice within the same `advancedFilter` expression.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            value:
              $ref: '#/components/schemas/SequencesStringValue'
    SequencesValues:
      description: 'One or more values that you wish to find in the provided properties.

        '
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/components/schemas/SequencesValue'
    SequencesSearchDTO:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/SequenceFilter'
        search:
          $ref: '#/components/schemas/SequenceSearch'
        limit:
          description: Returns up to this many results.
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
    SequencesContainsAllFilter:
      type: object
      title: containsAll
      required:
      - containsAll
      properties:
        containsAll:
          required:
          - property
          - values
          description: 'Matches items where the property contains all the given values.

            This filter can only be applied to multivalued properties.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            values:
              $ref: '#/components/schemas/SequencesValues'
    SinglePatchString:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetStringField'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the string, or remove the value.
    SequencesAggregatePath:
      type: object
      required:
      - path
      properties:
        path:
          description: The scope within which properties should be aggregated. The only value that is currently allowed is `['metadata']`, which will aggregate metadata keys.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
            - metadata
    SequencePostData:
      type: object
      oneOf:
      - required:
        - id
        title: Select by Id
        allOf:
        - $ref: '#/components/schemas/SequenceDataInsertion'
        - properties:
            id:
              $ref: '#/components/schemas/CogniteInternalId'
      - required:
        - externalId
        title: Select by ExternalId
        allOf:
        - $ref: '#/components/schemas/SequenceDataInsertion'
        - properties:
            externalId:
              $ref: '#/components/schemas/CogniteExternalId'
      example:
        externalId: DL/DRILL412/20190103/T3
        columns:
        - Depth
        - DepthSource
        - PowerSetting
        rows:
        - rowNumber: 1
          values:
          - 23331.3
          - s2
          - 61
    SequenceSearch:
      type: object
      properties:
        name:
          description: Prefix and fuzzy search on name.
          type: string
        description:
          description: Prefix and fuzzy search on description.
          type: string
        query:
          description: Searches on name and description using wildcard search on each of the words (separated by spaces). Retrieves results where at least one word must match. For example, '*some other*'.
          type: string
    SequenceDataDeleteRequestDTO:
      type: object
      required:
      - rows
      description: Rows to delete from a sequence.
      properties:
        rows:
          type: array
          items:
            type: integer
            example: 1
            format: int64
          minItems: 1
          maxItems: 10000
    IgnoreUnknownIdsField:
      type: object
      properties:
        ignoreUnknownIds:
          description: Ignore IDs and external IDs that are not found
          type: boolean
          default: false
    SequenceGetDataWithCursor:
      allOf:
      - $ref: '#/components/schemas/SequenceGetData'
      - properties:
          nextCursor:
            type: string
            description: Cursor to get the next page of results (if available).
    SequencesStringValue:
      title: String
      description: 'A value that you wish to find in the provided property.

        '
      type: string
      maxLength: 256
    SequencesUpdateByExternalId:
      title: Select by ExternalId
      allOf:
      - $ref: '#/components/schemas/SequenceChangeDTO'
      - type: object
        required:
        - externalId
        properties:
          externalId:
            $ref: '#/components/schemas/CogniteExternalId'
    DataSetExternalId:
      type: object
      title: DataSetExternalId
      required:
      - externalId
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
    SequenceRowDTO:
      type: object
      description: A single row of datapoints.
      required:
      - rowNumber
      - values
      properties:
        rowNumber:
          type: integer
          description: The row number for this row.
          example: 1
          minimum: 0
          format: int64
        values:
          type: array
          description: List of values in the order defined in the columns field. Number of items must match. Null is accepted for missing values. String values must be no longer than 256 characters.
          items:
            $ref: '#/components/schemas/SequenceItemDTO'
          minItems: 1
          maxItems: 400
    SequencesExistsFilter:
      type: object
      title: exists
      required:
      - exists
      properties:
        exists:
          required:
          - property
          description: 'Matches items that have a value for the specified property.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
    SequenceWithCursorResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GetSequenceDTO'
        nextCursor:
          type: string
          description: The cursor to get the next page of results (if available). Learn more about [pagination](https://docs.cognite.com/dev/concepts/pagination).
    SequencesPrefixAggregateFilter:
      type: object
      title: prefix
      required:
      - prefix
      properties:
        prefix:
          required:
          - value
          description: 'Matches intermediate aggregation results where the property key or the property value begins with

            the given text. When the `aggregate` operation is `uniqueProperties` or `cardinalityProperties`,

            property _keys_ will be targeted; when it is `uniqueValues` or `cardinalityValues`, property

            _values_ will be targeted.

            '
          type: object
          properties:
            value:
              $ref: '#/components/schemas/SequencesPrefixAggregateValue'
    SequencesCardinalityPropertiesAggregate:
      title: CardinalityProperties
      allOf:
      - type: object
        required:
        - aggregate
        properties:
          aggregate:
            description: "The `cardinalityProperties` aggregation gets, from the sequences that match the filter(s),\r\nthe approximate number of unique properties whose property path begins with the given `path`.\r\nCurrently, the only supported value for `path` is `[\"metadata\"]`, which means that this aggregation\r\nwill get the approximate size of the set of unique metadata keys.\r\n"
            type: string
            enum:
            - cardinalityProperties
      - $ref: '#/components/schemas/SequencesAggregatePath'
    SequencesBoolFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It is built by nesting one or more Boolean clauses, each of which is one of `and`, `or`, and `not`.

        Each such clause contains one or more child clauses (though `not` can only have one).

        Each child clause can be either another Boolean clause or a leaf filter.

        '
      title: Boolean filter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            description: All of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            maxItems: 99
            items:
              $ref: '#/components/schemas/SequencesFilterLanguage'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            description: At least one of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            maxItems: 99
            items:
              $ref: '#/components/schemas/SequencesFilterLanguage'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Filter DSL
            description: Sub-clauses in the query must not appear in matching items.
            type: object
            allOf:
            - $ref: '#/components/schemas/SequencesFilterLanguage'
    SequencesPrefixFilter:
      type: object
      title: prefix
      required:
      - prefix
      properties:
        prefix:
          required:
          - property
          - value
          description: 'Matches items where the provided property begins with the given text.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/SequencesFilterProperty'
            value:
              $ref: '#/components/schemas/SequencesStringValue'
    RemoveField:
      title: remove
      type: object
      required:
      - setNull
      properties:
        setNull:
          type: boolean
          example: true
    SequenceGetData:
      type: object
      required:
      - id
      - columns
      - rows
      description: Data from a sequence.
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        columns:
          type: array
          description: Column information in the order given by data.
          items:
            $ref: '#/components/schemas/BasicGetSequenceColumnInfo'
        rows:
          type: array
          description: List of row information.
          items:
            $ref: '#/components/schemas/SequenceRowDTO'
      example:
        id: 1112
        externalId: DL/DRILL412/20190103/T3
        columns:
        - externalId: Depth
        - externalId: DepthSource
        - externalId: PowerSetting
        rows:
        - rowNumber: 1
          values:
          - 23331.3
          - s2
          - 61
    Cursor:
      type: object
      properties:
        cursor:
          type: string
          example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
    ObjectPatchAddRemove:
      title: add/remove
      type: object
      properties:
        add:
          uniqueItems: true
          type: object
          description: Add the key-value pairs. Values for existing keys will be overwritten.
          additionalProperties:
            type: string
          example:
            key1: value1
            key2: value2
        remove:
          uniqueItems: true
          type: array
          description: Remove the key-value pairs with the specified keys.
          example:
          - value1
          - value2
          items:
            type: string
    SequencesSort:
      type: object
      properties:
        sort:
          description: 'Sort by array of selected properties.

            '
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/SequencesSortItem'
    SequenceFilter:
      type: object
      properties:
        name:
          type: string
          description: Returns only sequences with this name.
        externalIdPrefix:
          $ref: '#/components/schemas/CogniteExternalIdPrefix'
        metadata:
          description: Filters the sequences by metadata fields and values. Format is {'key1':'value1','key2':'value2'}.
          example:
            key1: value1
            key2: value2
          type: object
        assetIds:
          type: array
          description: Returns only sequences linked to one of the specified assets.
          example:
          - 363848954441724
          - 793045462540095
          - 1261042166839739
          items:
            $ref: '#/components/schemas/CogniteInternalId'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        rootAssetIds:
          type: array
          description: Only includes sequences that have a related asset in a tree rooted at any of these root `assetIds`.
          example:
          - 363848954441724
          - 793045462540095
          - 1261042166839739
          items:
            $ref: '#/components/schemas/CogniteInternalId'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        assetSubtreeIds:
          type: array
          description: Only includes sequences that have a related asset in a subtree rooted at any of these `assetIds` (including the roots given). If the total size of the given subtrees exceeds 100,000 assets, an error will be returned.
          example:
          - id: 1234567890
          - externalId: externalId123
          items:
            $ref: '#/components/schemas/AssetIdEither'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdTime:
          $ref: '#/components/schemas/EpochTimestampRange'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestampRange'
        dataSetIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Only includes sequences that belong to these datasets.
          items:
            $ref: '#/components/schemas/DataSetIdEither'
    SinglePatchRequiredString:
      title: set
      type: object
      properties:
        set:
          type: string
      description: Set a new value for the string.
      required:
      - set
    SequencesSortItem:
      type: object
      required:
      - property
      properties:
        property:
          type: array
          description: "Property to sort on.\nSorting can be done on the following properties:\n  | Property                          |\n  |-----------------------------------|\n  | `['assetId']`                     |\n  | `['createdTime']`                 |\n  | `['dataSetId']`                   |\n  | `['description']`                 |\n  | `['externalId']`                  |\n  | `['lastUpdatedTime']`             |\n  | `['metadata', '<someCustomKey>']` |\n  | `['name']`                        |\n  | `['_score_']`                     |"
          minItems: 1
          maxItems: 2
          items:
            type: string
            maxLength: 128
        order:
          type: string
          description: 'The `order` attribute is optional and defaults to `desc` for `_score_` and `asc` for all

            other properties.'
          enum:
          - asc
          - desc
        nulls:
          type: string
          description: 'The `nulls` attribute is optional and defaults to `auto`. `auto` is translated to `last`

            for the `asc` order and to `first` for the `desc` order.'
          enum:
          - first
          - last
          - auto
          default: auto
    SequencesUniqueValuesAggregate:
      title: UniqueValues
      allOf:
      - type: object
        required:
        - aggregate
        properties:
          aggregate:
            description: "The `uniqueValues` aggregation gets, from the sequences that match the filter(s),\r\nthe set of unique values (up to max 1000) that are taken on by the given property. For each such\r\nvalue, the aggregation result will also specify the frequency - that is, the number of sequences\r\nthat match the filter(s) and have that property value. The results are ordered by frequency in\r\ndescending order.\r\n"
            type: string
            enum:
            - uniqueValues
      - $ref: '#/components/schemas/SequencesAggregateProperties'
  responses:
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
  parameters:
    partition:
      in: query
      name: partition
      required: false
      description: 'Splits the data set into `N` partitions.

        The attribute is specified as a "M/N" string, where `M` is a natural number in the interval of `[1, N]`.

        You need to follow the cursors within each partition in order to receive all the data.


        To prevent unexpected problems and maximize read throughput, you should at most use 10 (N <= 10) partitions.


        When using more than 10 partitions, CDF may reduce the number of partitions silently.

        For example, CDF may reduce the number of partitions to `K = 10` so if you specify an `X/N` `partition` value where `X = 8` and `N = 20` - i.e. `"partition": "8/20"`- then

        CDF will change `N` to `N = K = 10` and process the request.

        But if you  specify the `X/N` `partition` value where `X = 11` (`X > K`) and `N = 20` - i.e. `"partition": "11/20"`- then

        CDF will reply with an empty result list and no cursor in the response.


        In future releases of the resource APIs, Cognite may reject requests if you specify more than 10 partitions.

        When Cognite enforces this behavior, the requests will result in a 400 Bad Request status.

        '
      schema:
        type: string
        example: 1/10
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

    SequencesBoolAggregateFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It''s built by nesting one or more Boolean clauses, each of which is one of `and`, `or`, and `not`.

        Each such clause contains one or more child clauses (though `not` can only have one).

        Each child clause can be either another Boolean clause or a leaf filter.

        '
      title: Boolean filter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _all_ of the given

              sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/SequencesAggregateFilter'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _at least one_

              (but potentially many or even all) of the given sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/SequencesAggregateFilter'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that do _not_ match the given

              sub-clause.

              '
            type: object
            allOf:
            - $ref: '#/components/schemas/SequencesAggregateFilter'
    CogniteInternalId:
      description: A server-generated ID for the object.
      type: integer
      minimum: 1
      maximum: 9007199254740991
      format: int64
    SequencesInAggregateValue:

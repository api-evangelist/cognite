    SequenceColumnChangeDTO:
      description: "Add, remove, or modify sequence columns. After the update, the number of numeric columns and\ndeleted columns should be â\x89¤ 400; the number of string columns and deleted columns should\nbe â\x89¤ 200; and the number of numeric columns, string columns, and deleted columns should\nbe â\x89¤ 400.\n"
      properties:
        modify:
          type: array
          description: List of single column updates.
          items:
            description: Modify a single sequence column by column externalId
            required:
            - externalId
            - update
            properties:
              externalId:
                $ref: '#/components/schemas/CogniteExternalId'
              update:
                type: object
                description: Modifications to apply to a single column.
                properties:
                  description:
                    $ref: '#/components/schemas/SinglePatchString'
                  externalId:
                    $ref: '#/components/schemas/SinglePatchRequiredString'
                  name:
                    $ref: '#/components/schemas/SinglePatchString'
                  metadata:
                    $ref: '#/components/schemas/ObjectPatch'
        add:
          type: array
          description: List of column definitions to add.
          items:
            $ref: '#/components/schemas/PostSequenceColumnDTO'
        remove:
          type: array
          description: List of columns to remove.
          items:
            type: object
            required:
            - externalId
            properties:
              externalId:
                $ref: '#/components/schemas/CogniteExternalId'
    SequencesSort:
      type: object
      properties:
        sort:
          description: 'Sort by array of selected properties.

            '
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/SequencesSortItem'
    PostSequenceColumnDTO:
      type: object
      description: Describes a new column.
      required:
      - externalId

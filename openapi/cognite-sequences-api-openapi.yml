    SequencesAdvancedAggregateDTO:
      type: object
      allOf:
      - properties:
          advancedFilter:
            $ref: '#/components/schemas/SequencesFilterLanguage'
          aggregateFilter:
            $ref: '#/components/schemas/SequencesAggregateFilter'

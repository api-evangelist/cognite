                allOf:
                - $ref: '#/components/schemas/InstanceType'
              externalId:
                description: External ids for the requested items
                allOf:
                - $ref: '#/components/schemas/NodeOrEdgeExternalId'
              space:
                $ref: '#/components/schemas/SpaceSpecification'
    EdgeOrNodeData:
      type: object

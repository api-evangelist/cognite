          $ref: '#/components/schemas/SourceReference'
        properties:
          $ref: '#/components/schemas/PropertyValueGroupV3'
      required:
      - source
    ContainersWithoutIndexesInvolvedNotice:
      type: object
      required:
      - code
      - category
      - hint
      - level
      - grade
      - resultExpression
      - containers
      properties:

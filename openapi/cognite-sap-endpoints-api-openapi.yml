openapi: 3.2.0
info:
  title: Cognite SAP Endpoints API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: SAP Endpoints
  description: 'An SAP **endpoint** represents a configuration to an SAP S/4HANA OData endpoint (and its related OData entity) the API will send the writeback requests.

    It defines which SAP Instance destination and which schema mapping should be used when processing a writeback request.


    Supported SAP entities:

    * Maintenance Notifications

    * Attachments'
paths:
  /writeback/sap/endpoints:
    get:
      tags:
      - SAP Endpoints
      operationId: list_endpoints
      x-capability:
      - sapWritebackAcl:READ
      parameters:
      - $ref: '#/components/parameters/Writeback100Limit'
      - $ref: '#/components/parameters/Cursor'
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        List all SAP endpoints in a given CDF project. If more instances exist than what the limit specifies, a pagination cursor is returned in the response body.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsWithCursor_Endpoint_'
          description: List of endpoints and an optional cursor.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
          description: Validation Error
      summary: List SAP Endpoints
    post:
      tags:
      - SAP Endpoints
      operationId: create_endpoints
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Create up to 100 SAP endpoints.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Items_CreateEndpoint_'
        required: true
        description: Endpoint to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_Endpoint_'
          description: List of created endpoints
        '400':
          $ref: '#/components/responses/400ErrorResponse'
          description: Response for a failed request
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Create SAP Endpoints
  /writeback/sap/endpoints/byids:
    post:
      tags:
      - SAP Endpoints
      operationId: retrieve_endpoints
      x-capability:
      - sapWritebackAcl:READ
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        Retrieve a list of up to 100 SAP endpoints by their external ID, optionally ignoring unknown IDs.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIds_ExternalId_'
        required: true
        description: List of external IDs of SAP endpoint configurations to retrieve.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_Endpoint_'
          description: List of retrieved SAP endpoint configurations.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Retrieve SAP Endpoints
  /writeback/sap/endpoints/delete:
    post:
      tags:
      - SAP Endpoints
      operationId: delete_endpoints
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Delete a list of SAP endpoint configurations by their external ID. This operation will fail if any endpoint in the request is associated to a SAP instance configuration.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIds_ExternalId_'
        required: true
        description: A list of External IDs for SAP endpoint configurations to delete.
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
          description: Empty response
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Delete SAP Endpoints
  /writeback/sap/endpoints/verify:
    post:
      tags:
      - SAP Endpoints
      operationId: verify_endpoints
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Verify the connectivity between the writeback API, and the SAP endpoint destination.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackExternalIdWrapper'
        required: true
        description: SAP Endpoint external ID which the connection test should be verified.
      responses:
        '200':
          $ref: '#/components/responses/ConnectionCheck'
          description: Connection Check Result
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Verify SAP Endpoint
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    Items_Endpoint_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Endpoint'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
      required:
      - items
      title: InstanceList
      type: object
    Items_CreateEndpoint_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/CreateEndpoint'
          title: Items
          type: array
          minLength: 1
          maxLength: 100
      required:
      - items
      title: CreateEndpoint list
      type: object
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    Endpoint:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        endpointType:
          title: endpointType
          type: string
          description: SAP OData endpoint type
          enum:
          - notification
          - attachment
        instanceId:
          title: Instance ID
          description: ID of the SAP instance the endpoint should connect to.
          type: string
          maxLength: 255
        mappingId:
          title: SchemaMapping ID
          description: ID of the schema mapping used by this endpoint to transform the writeback request.
          type: string
          maxLength: 255
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
      required:
      - externalId
      - endpointType
      - instanceId
      - lastUpdatedTime
      - createdTime
      title: Endpoint
      type: object
    WritebackItemsWithIgnoreUnknownIds_ExternalId_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WritebackExternalIdWrapper'
          title: Items
          type: array
          maxItems: 100
          minItems: 1
        ignoreUnknownIds:
          type: boolean
          title: IgnoreUnknownIds
          description: Ignore IDs and external IDs that are not found
      required:
      - items
      title: ItemsWithIgnoreUnknownIds_ExternalId
      type: object
    ConnectionCheckContent:
      type: object
      required:
      - status
      - error_message
      description: Cognite API error.
      properties:
        status:
          type: string
          title: status
          description: Connectivity status between the writeback API and the SAP destination endpoint. `success` means that the CDF writeback API has successfully connected to the SAP endpoint destination.
          default: success
        detail:
          type: string
          description: Description of the connection check
    ItemsWithCursor_Endpoint_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Endpoint'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
        nextCursor:
          type: string
          title: Next cursor
          description: Cursor for pagination
      required:
      - items
      title: EndpointListWithCursor
      type: object
    WritebackValidationErrorContent:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 422
        message:
          type: string
          description: Error message.
          example: 'Extra inputs are not permitted: type'
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    CreateEndpoint:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        endpointType:
          title: endpointType
          type: string
          description: SAP OData endpoint
          enum:
          - notification
          - attachment
        instanceId:
          title: Instance ID
          description: External ID of the SAP instance the endpoint should connect to.
          type: string
          maxLength: 255
        mappingId:
          title: SchemaMapping ID
          description: External ID of the schema mapping this endpoint should use to transform the writeback request.
          type: string
          maxLength: 255
      required:
      - externalId
      - endpointType
      - instanceId
      title: Instance
      type: object
    WritebackExternalIdWrapper:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
      required:
      - externalId
      title: WritebackExternalIdWrapper
      type: object
  parameters:
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
    Writeback100Limit:
      name: limit
      description: Limits the number of results to be returned. The maximum results returned by the server is 100 even if you specify a higher limit.
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 100
  responses:
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    400ErrorResponse:
      description: The response for a bad request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
          example:
            error:
              code: 400
              message: '`null` values aren''t allowed.'
    WritebackValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/WritebackValidationErrorContent'
    ConnectionCheck:
      description: Connection Check Result
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                $ref: '#/components/schemas/ConnectionCheckContent'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

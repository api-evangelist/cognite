      description: 'List of one or more linear rings representing a shape.


        A linear ring is the boundary of a surface or the boundary of a hole in a surface. It is defined as a list consisting of 4 or more Points, where the first and last Point is equivalent.


        Each Point is defined as an array of 2 numbers, representing coordinates of a point in 2D space.


        Example: `[[[35, 10], [45, 45], [15, 40], [10, 20], [35, 10]], [[20, 30], [35, 35], [30, 20], [20, 30]]]`

        '
      type: array
      minItems: 2
      items:
        $ref: '#/components/schemas/LineStringCoordinates'
    LabelContainsAnyFilter:
      type: object
      required:
      - containsAny
      properties:
        containsAny:
          description: The resource item contains at least one of the listed labels.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Label'
    PointCoordinates:
      description: 'Coordinates of a point in 2D space, described as an array of 2 numbers.


        Example: `[4.306640625, 60.205710352530346]`

        '
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
    CountAggregateResult:
      description: Common aggregate structure to represent aggregate result which have one count for filter resultset (Documents Count, Property Cardinality, etc).
      title: CountResult
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - count
            properties:
              count:
                type: integer
                description: Number of items in this aggregation group.
                format: int64
      example:
        items:
        - count: 10
    AssetSearch:
      type: object
      properties:
        search:
          type: object
          title: Search
          description: Fulltext search for assets. Primarily meant for for human-centric use-cases, not for programs. The query parameter uses a different search algorithm than the deprecated name and description parameters, and will generally give much better results.
          properties:
            name:
              $ref: '#/components/schemas/AssetName'
            description:
              $ref: '#/components/schemas/AssetDescription'
            query:
              $ref: '#/components/schemas/AssetQuery'
    429Error:
      type: object
      required:
      - code
      - message
      description: Cognite API throttling.
      properties:
        code:
          type: integer
          description: 429 HTTP status code.
          format: int32
          example: 429
        message:
          type: string
          description: "The error message specifies which kind of throttling happened:\n  - Too many concurrent requests for a single project or an identity.\n  - Too high rate of requests for a single project or an identity.\n\nSee more [here](https://docs.cognite.com/dev/concepts/request_throttling/ \"requests throttling\")."
          example: Project exceeded maximum number='50' of concurrent requests. Please try again later.
    SinglePatchRequiredParentExternalId:
      type: object
      properties:
        set:
          $ref: '#/components/schemas/AssetParentExternalId'
      description: Change the external ID of the object.
      required:
      - set
    AggregateProperty:
      description: "Property you want to aggregate.\nUse a list of strings to specify nested properties.\nThe same way the properties are represented in aggregate responses.\n\n<u>Example:</u>\n\nYou have the object\n```\n{\n  \"metadata\": {\n    \"id\": \"b53\"\n  },\n  \"source\": \"a23\"\n}\n```\n\nTo address \"id\" metadata key use `[\"metadata\", \"id\"]` property.\\\nYou can also aggregate the value(s) for the standalone property `source` with `[\"source\"]`.\n"
      type: array
      minItems: 1
      maxItems: 2
      items:
        type: string
      example:
      - metadata
      - key1
    Asset:
      allOf:
      - type: object
        required:
        - rootId
        - createdTime
        - lastUpdatedTime
        properties:
          createdTime:
            $ref: '#/components/schemas/EpochTimestamp'
          lastUpdatedTime:
            $ref: '#/components/schemas/EpochTimestamp'
          rootId:
            description: The ID of the root asset. The root asset is the asset spanning the entire asset hierarchy that this asset belongs to.
            allOf:
            - $ref: '#/components/schemas/CogniteInternalId'
          aggregates:
            $ref: '#/components/schemas/AggregateResultItem'
          parentId:
            description: The ID of the parent of this node, null if it is the root node.
            allOf:
            - $ref: '#/components/schemas/CogniteInternalId'
          parentExternalId:
            description: The external ID of the parent. The property is omitted if the asset doesn't have a parent or if the parent doesn't have externalId.
            allOf:
            - $ref: '#/components/schemas/CogniteExternalId'
      - $ref: '#/components/schemas/ExternalAsset'
      - $ref: '#/components/schemas/AssetInternalId'
    DataExternalAsset:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataExternalAssetItem'
          minItems: 1
          maxItems: 1000
    SetDescription:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          $ref: '#/components/schemas/ResourceDescription'
    AssetIdentifier:
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
    AssetFilter:
      type: object
      properties:
        filter:
          type: object
          description: Filter on assets with strict matching.
          title: Filter
          properties:
            name:
              $ref: '#/components/schemas/AssetName'
            parentIds:
              description: Return only the direct descendants of the specified assets.
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/CogniteInternalId'
            parentExternalIds:
              description: Return only the direct descendants of the specified assets.
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/CogniteExternalId'
            rootIds:
              description: This parameter is deprecated. Use `assetSubtreeIds` instead. Only include these root assets and their descendants.
              deprecated: true
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/AssetIdEither'
            assetSubtreeIds:
              type: array
              minItems: 1
              maxItems: 100
              description: Only include assets in subtrees rooted at the specified assets (including the roots given). If the total size of the given subtrees exceeds 100,000 assets, an error will be returned.
              items:
                $ref: '#/components/schemas/AssetIdEither'
            dataSetIds:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/DataSetIdEither'
            metadata:
              $ref: '#/components/schemas/AssetMetadata'
            source:
              $ref: '#/components/schemas/AssetSource'
            createdTime:
              $ref: '#/components/schemas/EpochTimestampRange'
            lastUpdatedTime:
              $ref: '#/components/schemas/EpochTimestampRange'
            root:
              type: boolean
              description: Whether the filtered assets are root assets, or not. Set to True to only list root assets.
            externalIdPrefix:
              $ref: '#/components/schemas/CogniteExternalIdPrefix'
            labels:
              $ref: '#/components/schemas/LabelFilter'
            geoLocation:
              $ref: '#/components/schemas/GeoLocationFilter'
    GeoLocationFilter:
      description: Only include files matching the specified geographic relation.
      type: object
      required:
      - relation
      - shape
      properties:
        relation:
          type: string
          enum:
          - INTERSECTS
          - DISJOINT
          - WITHIN
          description: One of the supported queries.
        shape:
          type: object
          description: Represents the points, curves and surfaces in the coordinate space.
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/MultiPolygon'
          discriminator:
            propertyName: type
    SinglePatchLong:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetLongField'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the long, or remove the value.
    LineStringCoordinates:
      description: 'Coordinates of a line described by a list of two or more points.

        Each point is defined as a pair of two numbers in an array, representing coordinates of a point in 2D space.


        Example: `[[30, 10], [10, 30], [40, 40]]`

        '
      type: array
      minItems: 2
      items:
        $ref: '#/components/schemas/PointCoordinates'
    SinglePatchResourceDescription:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetDescription'
      - $ref: '#/components/schemas/RemoveField'
    Values:
      description: One or more values you wish to find in the provided property.
      type: array
      minItems: 1
      maxItems: 5000
      items:
        $ref: '#/components/schemas/Value'
    AssetMetadataValuesAggregate:
      deprecated: true
      allOf:
      - type: object
        title: MetadataValues
        description: Get unique values (up to max 1000) of values for a particular metadata key, ordered by frequency.
        required:
        - aggregate
        - keys
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `metadataValues`: Get unique values of values for a particular metadata key, ordered by frequency.

              '
            type: string
            enum:
            - metadataValues
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
      - $ref: '#/components/schemas/AssetAggregateKeys'
    DataSetInternalId:
      type: object
      title: DataSetInternalId
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
    LabelsSet:
      type: object
      properties:
        set:
          type: array
          description: A list of the labels to replace (set) to a resource.
          minItems: 0
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Label'
    ValuesAggregateResult:
      description: Common aggregate structure to represent aggregate result which have count buckets for filter resultset (Unique Property Values, Not Null Document Properties, etc).
      title: BucketsResult
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            oneOf:
            - $ref: '#/components/schemas/AggregateStringValues'
            - $ref: '#/components/schemas/AggregateIntegerValues'
            - $ref: '#/components/schemas/AggregatePropertyValues'
      example:
        items:
        - count: 5
          values:
          - value_1
        - count: 10
          values:
          - value_2
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    MultiPolygonCoordinates:
      description: 'List of multiple polygons.


        Each polygon is defined as a list of one or more linear rings representing a shape.


        A linear ring is the boundary of a surface or the boundary of a hole in a surface. It is defined as a list consisting of 4 or more Points, where the first and last Point is equivalent.


        Each Point is defined as an array of 2 numbers, representing coordinates of a point in 2D space.


        Example: `[[[[30, 20], [45, 40], [10, 40], [30, 20]]], [[[15, 5], [40, 10], [10, 20], [5, 10], [15, 5]]]]`

        '
      type: array
      items:
        $ref: '#/components/schemas/PolygonCoordinates'
    AssetAggregateLeafFilter:
      description: Aggregate leaf filter.
      title: AggregateLeafFilter
      type: object
      oneOf:
      - $ref: '#/components/schemas/AggregateInFilter'
      - $ref: '#/components/schemas/AggregatePrefixFilter'
      - $ref: '#/components/schemas/AggregateRangeFilter'
    AssetQuery:
      type: string
      description: Whitespace-separated terms to search for in assets. Does a best-effort fuzzy search in relevant fields (currently name and description) for variations of any of the search terms, and orders results by relevance. Uses a different search algorithm than the name and description parameters, and will generally give much better results. Matching and ordering is not guaranteed to be stable over time, and the fields being searched may be extended.
      minLength: 1
      maxLength: 140
    AggregateIntegerValues:
      title: Integers
      type: object
      required:
      - count
      - values
      properties:
        count:
          description: Number of items in this aggregation bucket.
          type: integer
          format: int64
        values:
          description: An array of unique integer values in the property.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: integer
            format: int64
        value:
          deprecated: true
          description: A unique integer value in the field.
          type: integer
          format: int64
    Polygon:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Polygon
        coordinates:
          $ref: '#/components/schemas/PolygonCoordinates'
    AssetAggregateProperties:
      type: object
      required:
      - properties
      properties:
        properties:
          type: array
          description: The property name(s) to apply the aggregation on. Currently limited to one property per request.
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - property
            properties:
              property:
                type: array
                description: "It's an array of strings to allow specifying nested properties.\n  Supported properties:\\\n  | Property                        | Type                         |\n  |---------------------------------|------------------------------|\n  | `[\"dataSetId\"]`                 | number                       |\n  | `[\"description\"]`               | string                       |\n  | `[\"labels\"]`                    | array of [string]            |\n  | `[\"name\"]`                      | string                       |\n  | `[\"parentId\"]`                  | number                       |\n  | `[\"rootId\"]`                    | number                       |\n  | `[\"source\"]`                    | string                       |\n  | `[\"metadata\"]`                  | string                       |\n  | `[\"metadata\", <key>]`           | string                       |"
                minItems: 1
                maxItems: 2
                items:
                  type: string
                  minLength: 1
                  maxLength: 128
                example:
                - parentId
              filter:
                $ref: '#/components/schemas/AssetAggregateFilter'
    AssetDataIds:
      type: object
      allOf:
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AssetIdEither'
            maxItems: 1000
            minItems: 1
      - $ref: '#/components/schemas/IgnoreUnknownIdsField'
      - $ref: '#/components/schemas/AggregatedProperties'
    SetGeoLocation:
      title: set
      type: object
      required:
      - set
      properties:
        set:
          $ref: '#/components/schemas/GeoLocation'
    SetExternalId:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          $ref: '#/components/schemas/CogniteExternalId'
    MultiPointCoordinates:
      description: 'List of Points. Each Point is defined as an array of 2 numbers, representing coordinates of a point in 2D space.


        Example: `[[35, 10], [45, 45]]`

        '
      type: array
      items:
        $ref: '#/components/schemas/PointCoordinates'
    AssetInternalId:
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/CogniteInternalId'
    AssetAggregateRequest:
      description: Aggregation request of assets. Filters behave the same way as for the `filter` endpoint. Default aggregation is `count`.
      oneOf:
      - $ref: '#/components/schemas/AssetCountAggregate'
      - $ref: '#/components/schemas/AssetWithPropertyCountAggregate'
      - $ref: '#/components/schemas/AssetCardinalityValuesAggregate'
      - $ref: '#/components/schemas/AssetCardinalityPropertiesAggregate'
      - $ref: '#/components/schemas/AssetUniqueValuesAggregate'
      - $ref: '#/components/schemas/AssetUniquePropertiesAggregate'
      - $ref: '#/components/schemas/AssetMetadataKeysAggregate'
      - $ref: '#/components/schemas/AssetMetadataValuesAggregate'
    SinglePatchAssetSource:
      title: Source
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetAssetSource'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the source, or remove the value.
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    AssetExternalId:
      type: object
      required:
      - externalId
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
    DataSetIdEither:
      oneOf:
      - $ref: '#/components/schemas/DataSetInternalId'
      - $ref: '#/components/schemas/DataSetExternalId'
    AggregateResult:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CountAggregateResult'
      - $ref: '#/components/schemas/ValuesAggregateResult'
    AssetAggregateFilter:
      type: object
      description: 'A filter DSL (Domain Specific Language) to define aggregate filter queries.


        See more information about filtering DSL [here](https://docs.cognite.com/dev/concepts/resource_filtering_dsl/ "filtering DSL").

        '
      oneOf:
      - $ref: '#/components/schemas/AssetAggregateBoolFilter'
      - $ref: '#/components/schemas/AssetAggregateLeafFilter'
      example:
        or:
        - not:
            and:
            - equals:
                value: 10
            - in:
                values:
                - 11
                - 12
            - range:
                gte: 13
                lt: 15
        - and:
          - equals:
              value: 42
    EpochTimestampRange:
      description: Range between two timestamps (inclusive).
      type: object
      properties:
        max:
          description: Maximum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
        min:
          description: Minimum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
    AssetBoolFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It is built using one or more boolean clauses of the following types: `and`, `or`, or `not`.'
      title: BoolFilter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            description: All of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AssetAdvancedFilter'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            description: At least one of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AssetAdvancedFilter'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Filter DSL
            description: Sub-clauses in the query must not appear in matching items.
            type: object
            allOf:
            - $ref: '#/components/schemas/AssetAdvancedFilter'
    Point:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Point
        coordinates:
          $ref: '#/components/schemas/PointCoordinates'
    LabelFilter:
      description: Return only the resource matching the specified label constraints.
      oneOf:
      - $ref: '#/components/schemas/LabelContainsAnyFilter'
      - $ref: '#/components/schemas/LabelContainsAllFilter'
    AssetAggregateKeys:
      type: object
      properties:
        keys:
          description: 'For `metadataValues`, `aggregateType` sets the metadata key(s) to apply the aggregation on. Currently supports exactly one key per request.

            '
          type: array
          maxItems: 1
          items:
            type: string
    Label:
      type: object
      title: Label
      required:
      - externalId
      description: A label assigned to a resource.
      properties:
        externalId:
          description: An external ID to a predefined label definition.
          allOf:
          - $ref: '#/components/schemas/CogniteExternalId'
    SinglePatchExternalId:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetExternalId'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the externalId, or remove the value. Must be unique for the resource type.
    EqualsFilter:
      type: object
      title: equals
      required:
      - equals
      properties:
        equals:
          required:
          - property
          - value
          description: 'Matches items where the given property is **exactly** equal to the given value.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/FilterProperty'
            value:
              $ref: '#/components/schemas/Value'
    DataExternalAssetItem:
      allOf:
      - $ref: '#/components/schemas/ExternalAsset'
      - type: object
        properties:
          parentExternalId:
            $ref: '#/components/schemas/AssetParentExternalId'
    AggregateResultItem:
      description: Aggregated metrics of the asset.
      type: object
      properties:
        childCount:
          type: integer
          description: Number of direct descendants for the asset.
          format: int32
          minimum: 0
        depth:
          type: integer
          description: Asset path depth (number of levels below root node).
          format: int32
          minimum: 0
        path:
          description: IDs of assets on the path to the asset.
          type: array
          items:
            $ref: '#/components/schemas/AssetIdentifier'
    MultiLineStringCoordinates:
      description: 'List of lines where each line (LineString) is defined as a list of two or more points.

        Each point is defined as a pair of two numbers in an array, representing coordinates of a point in 2D space.


        Example: `[[[30, 10], [10, 30]], [[35, 10], [10, 30], [40, 40]]]`

        '
      type: array
      items:
        $ref: '#/components/schemas/LineStringCoordinates'
    FilterProperty:
      description: "Property you want to filter. Use a list of strings to specify nested properties.\n\n<u>Example:</u>\n\nYou have the object\n```\n{\n  \"room\": {\n    \"id\": \"b53\"\n  },\n  \"roomId\": \"a23\"\n}\n```\n\nUse `[\"room\", \"id\"]` to return the value in the nested `id` property, which is a part of the `room` object.\n\nYou can also read the value(s) in the standalone property `roomId` with `[\"roomId\"]`.\n"
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
    DataWithCursorAsset:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          type: string
          description: The cursor to get the next page of results (if available).
      description: A list of objects along with possible cursors to get the next or previous page of results.
    SinglePatchRequiredName:
      title: AssetName
      type: object
      properties:
        set:
          $ref: '#/components/schemas/AssetName'
      description: Set a new value for the asset name.
      required:
      - set
    AggregatePrefixFilter:
      type: object
      title: prefix
      required:
      - prefix
      properties:
        prefix:
          required:
          - value
          description: 'Matches aggregate values that contain a specific prefix.

            '
          type: object
          properties:
            value:
              $ref: '#/components/schemas/StringValue'
    AssetUniquePropertiesAggregate:
      allOf:
      - type: object
        title: UniqueProperties
        description: Request unique non-null property buckets aggregate.
        required:
        - aggregate
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `uniqueProperties`: Get unique properties (up to max 1000) in the specified document path (default path is ["metadata"] - metadata keys only).

              Ordered by frequency.

              '
            type: string
            enum:
            - uniqueProperties
          aggregateFilter:
            $ref: '#/components/schemas/AssetAggregateFilter'
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
      - properties:
          path:
            description: 'The scope in every document to aggregate properties.

              The only value allowed now is ["metadata"].

              It means to aggregate only metadata properties (aka keys).

              '
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: string
              enum:
              - metadata
            default:
            - metadata
    LabelsPatch:
      description: 'Updates the resource''s assigned labels.


        Labels can be added, removed or replaced (set). Adding an already attached label is an idempotent operation. Removing a label with no matching externalId is silently ignored.'
      oneOf:
      - $ref: '#/components/schemas/LabelsAddRemove'
      - $ref: '#/components/schemas/LabelsSet'
    AggregateRangeFilter:
      type: object
      title: range
      required:
      - range
      properties:
        range:
          description: 'Matches items that contain terms within the provided range.

            It''s not allowed to specify both inclusive and exclusive bounds (such as `gte`, `gt`) together.

            `gte`: Greater than or equal to.

            `gt`: Greater than.

            `lte`: Less than or equal to.

            `lt`: Less than.

            '
          type: object
          properties:
            gte:
              $ref: '#/components/schemas/RangeValue'
            gt:
              $ref: '#/components/schemas/RangeValue'
            lte:
              $ref: '#/components/schemas/RangeValue'
            lt:
              $ref: '#/components/schemas/RangeValue'
    IgnoreUnknownIdsField:
      type: object
      properties:
        ignoreUnknownIds:
          description: Ignore IDs and external IDs that are not found
          type: boolean
          default: false
    ObjectPatchSetAsset:
      title: set
      type: object
      required:
      - set
      properties:
        set:
          uniqueItems: true
          type: object
          description: Set the key-value pairs. All existing key-value pairs will be removed.
          additionalProperties:
            type: string
            maxLength: 10240
          x-maxKeyLength: 128
          x-maxTotalSize: 10240
          maxProperties: 256
          example:
            key1: value1
            key2: value2
    AssetCountAggregate:
      allOf:
      - type: object
        title: AssetCount
        description: Request aggregate to count number of Assets matching the filters. Default aggregate for the endpoint.
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `count`: Get approximate number of Assets matching the filters.

              '
            type: string
            enum:
            - count
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
    MultiPoint:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - MultiPoint
        coordinates:
          $ref: '#/components/schemas/MultiPointCoordinates'
    AssetLimit:
      type: object
      properties:
        limit:
          description: Limits the number of results to return.
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 100
    AssetMetadataKeysAggregate:
      deprecated: true
      allOf:
      - type: object
        title: MetadataKeys
        description: Get unique values (up to max 1000) of metadata keys ordered by frequency.
        required:
        - aggregate
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `metadataKeys`: Get unique values of metadata keys ordered by frequency.

              '
            type: string
            enum:
            - metadataKeys
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
    AssetChangeById:
      allOf:
      - $ref: '#/components/schemas/AssetPatch'
      - type: object
        required:
        - id
        properties:
          id:
            $ref: '#/components/schemas/CogniteInternalId'
    DataSetExternalId:
      type: object
      title: DataSetExternalId
      required:
      - externalId
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
    AssetCardinalityValuesAggregate:
      allOf:
      - type: object
        title: ApproximateCardinalityForValues
        description: Request values approximate cardinality aggregate on a specific property.
        required:
        - aggregate
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `cardinalityValues`: Get approximate number of unique values for the specified property.

              '
            type: string
            enum:
            - cardinalityValues
          aggregateFilter:
            $ref: '#/components/schemas/AssetAggregateFilter'
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
      - $ref: '#/components/schemas/AssetAggregateProperties'
    SinglePatchRequiredInternalId:
      type: object
      properties:
        set:
          $ref: '#/components/schemas/CogniteInternalId'
      description: Change the ID of the object.
      required:
      - set
    RangeValue:
      title: rangeBound
      description: Value you wish to find in the provided property using a range clause.
      oneOf:
      - type: string
        title: string
      - type: number
        title: number
      - type: integer
        title: integer
    AssetAggregateBoolFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It''s built using one or more boolean clauses of the following types: `and`, `or`, or `not`.

        '
      title: AggregateBoolFilter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            description: All of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AssetAggregateFilter'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            description: At least one of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AssetAggregateFilter'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Filter DSL
            description: Sub-clauses in the query must not appear in matching items.
            type: object
            allOf:
            - $ref: '#/components/schemas/AssetAggregateFilter'
    PrefixFilter:
      type: object
      title: prefix
      required:
      - prefix
      properties:
        prefix:
          required:
          - property
          - value
          description: 'Matches items that contain a specific prefix in the provided property.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/FilterProperty'
            value:
              $ref: '#/components/schemas/StringValue'
    JsonArrayInt64:
      type: string
      format: jsonArray(int64)
      example: '[1238712837, 238712361376, 23786237623]'
    GenericRangeFilter:
      type: object
      title: range
      required:
      - range
      properties:
        range:
          required:
          - property
          description: 'Matches items that contain terms within the provided range.

            It is not allowed to specify both inclusive and exclusive bounds (such as `gte`, `gt`) together.

            `gte`: Greater than or equal to.

            `gt`: Greater than.

            `lte`: Less than or equal to.

            `lt`: Less than.

            '
          type: object
          properties:
            property:
              $ref: '#/components/schemas/FilterProperty'
            gte:
              $ref: '#/components/schemas/RangeValue'
            gt:
              $ref: '#/components/schemas/RangeValue'
            lte:
              $ref: '#/components/schemas/RangeValue'
            lt:
              $ref: '#/components/schemas/RangeValue'
    MultiLineString:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - MultiLineString
        coordinates:
          $ref: '#/components/schemas/MultiLineStringCoordinates'
    StringValue:
      title: String
      description: A unique string value in the field.
      type: object
      required:
      - value
      properties:
        value:
          type: string
    AssetLeafFilter:
      description: Leaf filter.
      title: LeafFilter
      type: object
      oneOf:
      - $ref: '#/components/schemas/EqualsFilter'
      - $ref: '#/components/schemas/InFilter'
      - $ref: '#/components/schemas/GenericRangeFilter'
      - $ref: '#/components/schemas/PrefixFilter'
      - $ref: '#/components/schemas/ExistsFilter'
      - $ref: '#/components/schemas/ContainsAnyFilter'
      - $ref: '#/components/schemas/ContainsAllFilter'
      - $ref: '#/components/schemas/SearchFilter'
    AssetCardinalityPropertiesAggregate:
      allOf:
      - type: object
        title: ApproximateCardinalityForProperties
        description: Request resource properties approximate cardinality aggregate.
        required:
        - aggregate
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `cardinalityProperties`: Get approximate number of unique properties.

              '
            type: string
            enum:
            - cardinalityProperties
          aggregateFilter:
            $ref: '#/components/schemas/AssetAggregateFilter'
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
      - properties:
          path:
            description: 'The scope in every document to aggregate properties.

              The only value allowed now is ["metadata"].

              It means to aggregate only metadata properties (aka keys).

              '
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: string
              enum:
              - metadata
            default:
            - metadata
    PartitionLimited10:
      description: 'Splits the data set into `N` partitions.

        The attribute is specified as a "M/N" string, where `M` is a natural number in the interval of `[1, N]`.

        You need to follow the cursors within each partition in order to receive all the data.


        The maximum number of allowed partitions (`N`) is 10.


        Cognite rejects requests if you specify more than 10 partitions.

        When Cognite enforces this behavior, the requests result in a 400 Bad Request status.

        '
      type: string
      example: 1/3
    AssetWithPropertyCountAggregate:
      allOf:
      - type: object
        title: AssetWithPropertyCount
        description: 'Request aggregate to count the number of Assets with the specific property (property is not null)

          and matching the filters.'
        properties:
          aggregate:
            description: 'Type of aggregation to apply.

              `count`: Get an approximate number of Assets with the specific property (property is not null) and matching the filters.

              '
            type: string
            enum:
            - count
      - $ref: '#/components/schemas/AssetAdvancedFilter'
      - $ref: '#/components/schemas/AssetFilter'
      - $ref: '#/components/schemas/AssetAggregateProperties'
    RemoveField:
      title: remove
      type: object
      required:
      - setNull
      properties:
        setNull:
          type: boolean
          example: true
    ExternalAsset:
      type: object
      required:
      - name
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        name:
          $ref: '#/components/schemas/AssetName'
        parentId:
          description: 'The parent node''s ID used to specify parent-child relationship.


            You should not use this field in combination with the parentExternalId field.

            '
          allOf:
          - $ref: '#/components/schemas/CogniteInternalId'
        parentExternalId:
          description: 'The parent node''s external ID used to specify the parent-child relationship.

            When specifying this field, the API will resolve the external ID into an internal ID and use the internal ID to store the parent-child relation.

            As a result, a later change to update the parent''s external ID will not affect this parent-child relationship as it is based on internal ID.


            You should not use this field in combination with the parentId field.

            '
          allOf:
          - $ref: '#/components/schemas/CogniteExternalId'
        description:
          $ref: '#/components/schemas/AssetDescription'
        dataSetId:
          description: The id of the dataset this asset belongs to.
          allOf:
          - $ref: '#/components/schemas/CogniteInternalId'
        metadata:
          $ref: '#/components/schemas/AssetMetadata'
        source:
          $ref: '#/components/schemas/AssetSource'
        labels:
          $ref: '#/components/schemas/LabelList'
        geoLocation:
          $ref: '#/components/schemas/GeoLocation'
      description: A representation of a physical asset, for example a factory or a piece of equipment.
    AggregateInFilter:
      type: object
      title: in
      required:
      - in
      properties:
        in:
          required:
          - values
          description: 'Matches items where the given property is **exactly** equal to one of the given values. This filter can only be applied to single-valued properties.

            '
          type: object
          properties:
            values:
              $ref: '#/components/schemas/Values'
    AssetAdvancedFilter:
      type: object
      properties:
        advancedFilter:
          type: object
          description: "A filter DSL (Domain Specific Language) to define advanced filter queries.\n\nSee more information about filtering DSL [here](https://docs.cognite.com/dev/concepts/resource_filtering_dsl/ \"filtering DSL\").\n\nSupported properties:\n\n  | Property                        | Type                                    |\n  |---------------------------------|-----------------------------------------|\n  | `[\"labels\"]`                    | array of [string]                       |\n  | `[\"createdTime\"]`               | number                                  |\n  | `[\"dataSetId\"]`                 | number                                  |\n  | `[\"id\"]`                        | number                                  |\n  | `[\"lastUpdatedTime\"]`           | number                                  |\n  | `[\"parentId\"]`                  | number                                  |\n  | `[\"rootId\"]`                    | number                                  |\n  | `[\"description\"]`               | string                                  |\n  | `[\"externalId\"]`                | string                                  |\n  | `[\"metadata\"]`                  | string                                  |\n  | `[\"metadata\", \"someCustomKey\"]` | string                                  |\n  | `[\"name\"]`                      | string                                  |\n  | `[\"source\"]`                    | string                                  |\n\n  Note: Filtering on the `[\"metadata\"]` property has the following logic:\n  If a value of any metadata keys in an asset matches the filter, the asset matches the filter."
          oneOf:
          - $ref: '#/components/schemas/AssetBoolFilter'
          - $ref: '#/components/schemas/AssetLeafFilter'
          example:
            or:
            - not:
                and:
                - equals:
                    property:
                    - metadata
                    - asset_type
                    value: gas pump
                - in:
                    property:
                    - source
                    values:
                    - blueprint
                    - inventory
                - range:
                    property:
                    - dataSetId
                    gte: 1
                    lt: 10
            - and:
              - containsAny:
                  property:
                  - labels
                  values:
                  - pump
                  - cooler
              - equals:
                  property:
                  - parentId
                  value: 95867294876
            - search:
                property:
                - description
                value: My favorite pump
    Cursor:
      type: object
      properties:
        cursor:
          type: string
          example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
    AssetChange:
      oneOf:
      - $ref: '#/components/schemas/AssetChangeById'
      - $ref: '#/components/schemas/AssetChangeByExternalId'
    AggregatedProperties:
      type: object
      properties:
        aggregatedProperties:
          description: Set of aggregated properties to include
          type: array
          items:
            $ref: '#/components/schemas/AggregatedProperty'
    MultiPolygon:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - MultiPolygon
        coordinates:
          $ref: '#/components/schemas/MultiPolygonCoordinates'
    AssetMetadata:
      type: object
      description: 'Custom, application specific metadata. String key -> String value. Limits: Maximum length of key is 128 bytes, value 10240 bytes, up to 256 key-value pairs, of total size at most 10240.'
      additionalProperties:
        type: string
        maxLength: 10240
      x-maxKeyLength: 128
      x-maxTotalSize: 10240
      maxProperties: 256
  responses:
    AggregateResponse:
      description: Response with a list of aggregation results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AggregateResult'
    AssetDataResponse:
      description: Response with list of assets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataAsset'
    AssetResponse:
      description: Response with a single asset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Asset'
    AssetDataWithCursorResponse:
      description: Paged response with list of assets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataWithCursorAsset'
    400ErrorResponse:
      description: The response for a bad request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
          example:
            error:
              code: 400
              message: '`null` values aren''t allowed.'
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
    429ErrorResponse:
      description: The response for too many requests (concurrency or rate throttling).
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/429Error'
          example:
            error:
              code: 429
              message: Project exceeded maximum number='50' of concurrent requests. Please try again later.
  parameters:
    IncludeMetadata:
      name: includeMetadata
      in: query
      description: Whether the metadata field should be returned or not.
      schema:
        type: boolean
        default: true
    partitionLimited10:
      in: query
      name: partition
      required: false
      description: 'Splits the data set into `N` partitions.

        The attribute is specified as a "M/N" string, where `M` is a natural number in the interval of `[1, N]`.

        You need to follow the cursors within each partition in order to receive all the data.


        The maximum number of allowed partitions (`N`) is 10.


        Cognite rejects requests if you specify more than 10 partitions.

        When Cognite enforces this behavior, the requests result in a 400 Bad Request status.

        '
      schema:
        type: string
        example: 1/3
    Limit:
      name: limit
      description: Limits the number of results to be returned. The maximum results returned by the server is 1000 even if you specify a higher limit.
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
    CogniteInternalId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/CogniteInternalId'
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

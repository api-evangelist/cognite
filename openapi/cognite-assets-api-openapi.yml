      - assetsAcl:READ
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: "const assets = await client.assets.search({\n  filter: {\n    parentIds: [1, 2]\n  },\n  search: {\n    query: '21PT1019'\n  }\n});"
      - lang: Python
        label: Python SDK
        source: 'res = client.assets.search(name="some name")


          res = client.assets.search(filter={"name": "some name"})


          res = client.assets.search(query="TAG 30 XV")


          res = client.assets.search(name="xyz",filter={"parent_ids": [123,456],"source": "some source"})


          my_label_filter = LabelFilter(contains_all=["PUMP"])

          res = client.assets.search(name="xyz",filter=AssetFilter(labels=my_label_filter))

          '
  /assets/delete:
    post:
      tags:
      - Assets
      summary: Delete assets
      description: '


        > **Required capabilities:** `assetsAcl:WRITE`


        Delete assets. By default, `recursive=false` and the request would fail if attempting to delete assets that are referenced as parent by other assets.

        To delete such assets and all its descendants, set recursive to true.

        The limit of the request does not include the number of descendants that are deleted.


        ### Request throttling

        This endpoint is a subject of the new throttling schema (limited request rate and concurrency).

        Please check [Assets resource description](../../) for more information.'
      operationId: deleteAssets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '429':
          $ref: '#/components/responses/429ErrorResponse'
      x-capability:
      - assetsAcl:WRITE
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: 'await client.assets.delete([{id: 123}, {externalId: ''abc''}]);'
      - lang: Python
        label: Python SDK
        source: 'client.assets.delete(id=[1,2,3], external_id="3")

          '
      - lang: Java
        label: Java SDK
        source: "List<Item> byInternalIds = List.of(Item.newBuilder().setId(10).build()); \nList<Item> deletedAssets = client.assets().delete(byInternalIds); \n\nList<Item> byExternalIds = List.of(Item.newBuilder().setExternalId(\"10\").build()); \nList<Item> deletedAssets = client.assets().delete(byExternalIds); \n\n"

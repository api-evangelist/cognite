openapi: 3.2.0
info:
  title: Cognite Simulator Logs API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Simulator Logs
  description: Simulator logs track what happens during simulation runs, model parsing, and generic connector logic.
paths:
  /simulators/logs/byids:
    post:
      tags:
      - Simulator Logs
      summary: Retrieve Simulator Logs
      description: Retrieve one or more simulator logs by IDs.
      operationId: retrieve_simulator_logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputItemsIdRef'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorLog'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
components:
  schemas:
    IdRef:
      properties:
        id:
          type: integer
          title: Id
          description: ID
          examples:
          - 5559452808603919
      additionalProperties: false
      type: object
      required:
      - id
      title: IdRef
    ListSimulatorLog:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorLog'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ListSimulatorLog
    APIError:
      properties:
        message:
          type: string
          title: Message
        code:
          type: integer
          title: Code
      type: object
      required:
      - message
      - code
      title: APIError
    SimulatorLogSeverityLevel:
      type: string
      enum:
      - Debug
      - Information
      - Warning
      - Error
      title: SimulatorLogSeverityLevel
    SimulatorLogData:
      properties:
        timestamp:
          type: integer
          title: Timestamp
          description: Timestamp of the log message
        message:
          type: string
          maxLength: 4096
          minLength: 1
          title: Message
          description: Log message
        severity:
          $ref: '#/components/schemas/SimulatorLogSeverityLevel'
          description: Log severity level
      additionalProperties: false
      type: object
      required:
      - timestamp
      - message
      - severity
      title: SimulatorLogData
    ErrorBase:
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      type: object
      required:
      - error
      title: ErrorBase
    SimulatorLog:
      properties:
        dataSetId:
          type: integer
          title: DataSetId
          description: Dataset id of the resource
          examples:
          - 5559452808603919
        id:
          type: integer
          title: Id
          description: A unique id of a simulator resource log
        data:
          items:
            $ref: '#/components/schemas/SimulatorLogData'
          type: array
          title: Data
          description: Log data of the simulator resource
        severity:
          description: Minimum severity level of the log data. This overrides connector configuration minimum severity level and can be used for more granular control, e.g. to debug a specific simulation run.
          $ref: '#/components/schemas/SimulatorLogSeverityLevel'
        createdTime:
          type: integer
          title: CreatedTime
          description: The number of milliseconds since epoch
        lastUpdatedTime:
          type: integer
          title: LastUpdatedTime
          description: The number of milliseconds since epoch
      additionalProperties: false
      type: object
      required:
      - dataSetId
      - id
      - data
      - createdTime
      - lastUpdatedTime
      title: SimulatorLog
    InputItemsIdRef:
      properties:
        items:
          items:
            $ref: '#/components/schemas/IdRef'
          type: array
          maxItems: 100
          minItems: 1
          title: Items
          description: A list of items
      additionalProperties: false
      type: object
      required:
      - items
      title: InputItemsIdRef
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

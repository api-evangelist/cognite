    TimeSeriesStringValue:
      title: String
      description: 'A value that you wish to find in the provided property.

        '
      type: string
      maxLength: 256
    DatapointsQueryProperties:
      properties:
        start:
          $ref: '#/components/schemas/TimestampOrStringStart'
        end:
          $ref: '#/components/schemas/TimestampOrStringEnd'
        limit:
          type: integer
          description: Returns up to this number of data points. The maximum is 100000 non-aggregated data points and 10000 aggregated data points in total across all queries in a single request.
          format: int32
        aggregates:
          type: array
          description: Specify the aggregates to return. Omit to use top-level value.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Aggregate'
        granularity:
          type: string
          description: The granularity size and granularity of the aggregates. Omit to use top-level value.
          example: 1h
        targetUnit:
          type: string
          description: The [unit](<https://docs.cognite.com/dev/concepts/resource_types/units/>) externalId of the data points returned. If the time series does not have a unitExternalId that can be converted to the targetUnit, an error will be returned. Cannot be used with targetUnitSystem.
          example: temperature:deg_f
        targetUnitSystem:
          type: string
          description: The [unit system](<https://docs.cognite.com/dev/concepts/resource_types/units/>) of the data points returned. Cannot be used with targetUnit.
          example: imperial
        includeOutsidePoints:
          type: boolean
          description: 'Defines whether to include the last data point before the requested time period and the first one after. This option can be useful for interpolating data. It''s not available for aggregates or cursors.

            Note: If there are more than `limit` data points in the time period, we will omit the excess data points and then append the first data point after the time period, thus causing a gap with omitted data points. When this is the case, we return up to `limit+2` data points.

            When doing manual paging (sequentially requesting smaller intervals instead of requesting a larger interval and using cursors to get all the data points) with this field set to true, the `start` of the each subsequent request should be one millisecond more than the `timestamp` of the _second-to-last_ data point from the previous response. This is because the last data point in most cases will be the extra point from outside the interval.

            '
          default: false
        includeStatus:
          type: boolean
          description: 'Show the [status code](<https://docs.cognite.com/dev/concepts/reference/status_codes>) for each data point in the response.

            _Good_ (code = 0) status codes are always omitted.

            Only relevant for raw data points queries and ''minDatapoint''/''maxDatapoint'' aggregates.'
          default: false
        ignoreBadDataPoints:
          type: boolean
          description: 'Treat data points with a _Bad_ status code as if they do not exist.


            If set to false, raw queries will include bad data points in the response, and

            aggregates will in general omit the time period between a bad data point and the next good data point.

            Also, the period between a bad data point and the previous good data point will be considered constant.


            Note that bad data points may contain the string values ''NaN'', ''Infinity'', or ''-Infinity'', or be null (omitted).'
          default: true
        treatUncertainAsBad:
          type: boolean
          description: 'Treat data points with _Uncertain_ status codes as _Bad_. If false, treat data points with _Uncertain_ status codes as _Good_.

            Used for both raw queries and aggregates.'
          default: true
        cursor:
          type: string
          description: 'To retrieve next page, insert the `nextCursor` from a previous response. Be sure to match with the corresponding time series. Not compatible with `includeOutsidePoints`.

            '
        timeZone:
          type: string
          description: 'Which time zone to align aggregates to. Omit to use top-level value.

            '
          default: UTC
          example: Europe/Oslo or UTC+05:30
    TimeSeriesInAggregateFilter:
      type: object
      title: in
      required:
      - in
      properties:
        in:
          required:
          - values
          description: 'Matches intermediate aggregation results where the property key or the property value is _exactly_

            equal to one of the given values. When the `aggregate` operation is `uniqueProperties` or

            `cardinalityProperties`, property _keys_ will be targeted; when it is `uniqueValues` or

            `cardinalityValues`, property _values_ will be targeted.

            '
          type: object
          properties:
            values:
              $ref: '#/components/schemas/TimeSeriesInAggregateValues'
    Search:
      type: object
      properties:
        name:
          description: Prefix and fuzzy search on name.
          type: string
        description:
          description: Prefix and fuzzy search on description.
          type: string
        query:
          description: 'Whitespace-separated terms to search for in time series. Does a

            best-effort fuzzy search in relevant fields (currently name and

            description) for variations of any search terms and

            orders results by relevance. Uses a different search algorithm

            than the name and description parameters and will generally give

            much better results. Matching and ordering aren''t guaranteed to

            be stable over time, and the fields being searched may be

            extended.'
          type: string
          example: some other
    ArrayPatchLongSet:
      title: set
      type: object
      required:
      - set
      properties:
        set:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
    SinglePatchBoolean:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          type: boolean
    DatapointsGetDoubleDatapoint:
      allOf:
      - $ref: '#/components/schemas/DatapointsMetadata'
      - type: object
        required:
        - datapoints
        - isString
        - type
        properties:
          isString:
            description: True if the time series contains string values; false if it contains numeric values.
            type: boolean
          type:
            $ref: '#/components/schemas/TimeSeriesType'
          isStep:
            description: Defines whether the time series is a step series or not.
            type: boolean
          unit:
            maxLength: 32
            type: string
            description: The physical unit of the time series (free-text field). Omitted if data points were converted to a different unit.
          unitExternalId:
            maxLength: 64
            type: string
            description: The physical unit of the time series as [represented in the unit catalog](<https://docs.cognite.com/dev/concepts/resource_types/units/>). Replaced with target unit if data points were converted.
          nextCursor:
            type: string
            description: 'The cursor to get the next page of results (if available).

              `nextCursor` will be omitted when the next data point is after the end of the

              interval. Increase start/end to fetch more data.

              '
          datapoints:
            type: array
            description: The list of data points.
            items:
              $ref: '#/components/schemas/GetDoubleDatapoint'
    LatestDataPropertyFilter:
      properties:
        before:
          type: string
          description: 'Get data points before this time. The format is N[timeunit]-ago where timeunit is w,d,h,m,s.

            Example: ''2d-ago'' gets data that is up to two days old. You can also specify time in milliseconds since epoch.'
          default: now
        targetUnit:
          type: string
          description: The [unit](<https://docs.cognite.com/dev/concepts/resource_types/units/>) externalId of the data points returned. If the time series does not have a unitExternalId that can be converted to the targetUnit, an error will be returned. Cannot be used with targetUnitSystem.
          example: temperature:deg_f
        targetUnitSystem:
          type: string
          description: The [unit system](<https://docs.cognite.com/dev/concepts/resource_types/units/>) of the data points returned. Cannot be used with targetUnit.
          example: imperial
        includeStatus:
          type: boolean
          description: 'Show the [status code](<https://docs.cognite.com/dev/concepts/reference/status_codes>) for each data point in the response.

            _Good_ (code = 0) status codes are always omitted.'
          default: false
        ignoreBadDataPoints:
          type: boolean
          description: 'Treat data points with a _Bad_ status code as if they do not exist.

            Set to false to include all data points.


            Note that bad data points may contain the string values ''NaN'', ''Infinity'', or ''-Infinity'', or be null (omitted).'
          default: true
        treatUncertainAsBad:
          type: boolean
          description: 'Treat data points with _Uncertain_ status codes as _Bad_.

            Set to false to to include uncertain data points.'
          default: true
    TimeSeriesBoolAggregateFilter:
      description: 'A query that matches items matching boolean combinations of other queries.

        It''s built by nesting one or more Boolean clauses, each of which is one of `and`, `or`, and `not`.

        Each such clause contains one or more child clauses (though `not` can only have one).

        Each child clause can be either another Boolean clause or a leaf filter.

        '
      title: Boolean filter
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _all_ of the given

              sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/TimeSeriesAggregateFilter'
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that match _at least one_

              (but potentially many or even all) of the given sub-clauses.

              '
            type: array
            minItems: 1
            maxItems: 19
            items:
              $ref: '#/components/schemas/TimeSeriesAggregateFilter'
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Aggregate filter DSL
            description: 'The aggregation result will only contain items that do _not_ match the given

              sub-clause.

              '
            type: object
            allOf:
            - $ref: '#/components/schemas/TimeSeriesAggregateFilter'
    TimeSeriesLeafFilter:
      description: 'Leaf filter.

        '
      title: Leaf filter
      type: object
      oneOf:
      - $ref: '#/components/schemas/TimeSeriesEqualsFilter'
      - $ref: '#/components/schemas/TimeSeriesInFilter'
      - $ref: '#/components/schemas/TimeSeriesRangeFilter'
      - $ref: '#/components/schemas/TimeSeriesPrefixFilter'
      - $ref: '#/components/schemas/TimeSeriesExistsFilter'
      - $ref: '#/components/schemas/TimeSeriesContainsAnyFilter'
      - $ref: '#/components/schemas/TimeSeriesContainsAllFilter'
      - $ref: '#/components/schemas/TimeSeriesSearchFilter'
    DatapointsQuery:
      type: object
      description: Parameters describing a query for data points.
      oneOf:
      - required:
        - id
        title: QueryWithInternalId
        allOf:
        - properties:
            id:
              $ref: '#/components/schemas/CogniteInternalId'
        - $ref: '#/components/schemas/DatapointsQueryProperties'
      - required:
        - externalId
        title: QueryWithExternalId
        allOf:
        - properties:
            externalId:
              $ref: '#/components/schemas/CogniteExternalId'
        - $ref: '#/components/schemas/DatapointsQueryProperties'
      - required:
        - instanceId
        title: QueryWithInstanceId
        allOf:
        - properties:
            instanceId:
              $ref: '#/components/schemas/CogniteInstanceId'
        - $ref: '#/components/schemas/DatapointsQueryProperties'
    TimestampOrStringEnd:
      oneOf:
      - type: integer
      - type: string
        default: now
      description: Get datapoints up to, but excluding, this point in time. Same format as for start. Note that when using aggregates, the end will be rounded up such that the last aggregate represents a full aggregation interval containing the original end, where the interval is the granularity unit times the granularity multiplier. For granularity 2d, the aggregation interval is 2 days, if end was originally 3 days after the start, it will be rounded to 4 days after the start.
    TimeSeriesAggregateProperties:
      type: object
      required:
      - properties
      properties:
        properties:
          type: array
          description: "The properties to which the aggregation should be applied. While this parameter is a list, it\r\ncurrently only accepts one element. Each element is an object with a single field called `property`,\r\nwhose value is another list (in order to accommodate nested properties). Thus, a top-level property\r\n`name` must be specified as `[{\"property\": [\"name\"]}]`, and a metadata property `tag` must be\r\nspecified as `[{\"property\": [\"metadata\", \"tag\"]}]`.\r\n\r\nThe supported top-level properties are:\r\n- `assetId`\r\n- `assetRootId`\r\n- `createdTime`\r\n- `dataSetId`\r\n- `description`\r\n- `externalId`\r\n- `id`\r\n- `isStep`\r\n- `isString`\r\n- `lastUpdatedTime`\r\n- `name`\r\n- `securityCategories`\r\n- `unit`\r\n"
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - property
            properties:
              property:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
    TimeSeriesPatchDM:
      type: object
      description: Changes will be applied to time series. Note that these changes will not be visible in data modeling.
      required:
      - update
      properties:
        update:
          type: object
          properties:
            externalId:
              $ref: '#/components/schemas/NullableSinglePatchString'
            metadata:
              $ref: '#/components/schemas/ObjectPatch'
            assetId:
              $ref: '#/components/schemas/NullableSinglePatchLong'
            dataSetId:
              $ref: '#/components/schemas/NullableSinglePatchLong'
    IgnoreUnknownIdsField:
      type: object

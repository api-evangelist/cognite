    DocumentAggregateFilterBool:
      title: bool filters
      description: 'A query that matches items matching boolean combinations of other queries.

        It is built using one or more boolean clauses, which can be of types: `and`, `or` or `not`

        '
      type: object
      oneOf:
      - type: object
        title: and
        required:
        - and
        properties:
          and:
            description: All of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/DocumentAggregateFilter'
            example:
            - prefix:
                property:
                - name
                value: Report
            - equals:
                property:
                - type
                value: PDF
      - type: object
        title: or
        required:
        - or
        properties:
          or:
            description: At least one of the sub-clauses in the query must appear in matching items.
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/DocumentAggregateFilter'
            example:
            - prefix:
                property:
                - name
                value: Report
            - prefix:
                property:
                - name
                value: Summary
      - type: object
        title: not
        required:
        - not
        properties:
          not:
            title: Filter
            description: Sub-clauses in the query must not appear in matching items.
            type: object
            allOf:
            - $ref: '#/components/schemas/DocumentAggregateFilter'
            example:
            - equals:
                property:
                - type
                value: PDF
    DocumentAggregateFilter:
      description: 'A JSON based filtering language. See detailed documentation above.

        '
      type: object
      oneOf:
      - $ref: '#/components/schemas/DocumentAggregateFilterBool'
      - $ref: '#/components/schemas/DocumentAggregateFilterLeaf'

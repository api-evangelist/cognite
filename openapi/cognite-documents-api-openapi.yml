    DocumentGeoJsonGeometry:
      description: GeoJSON Geometry.
      type: object
      required:
      - type
      properties:
        type:
          description: Type of the GeoJSON Geometry. When filtering there is a limit of specifying up to 100 positions in the data.
          type: string
          example: Point
        coordinates:
          description: Coordinates of the geometry.
          anyOf:
          - type: array
            example:
            - 10.74609
            - 59.91273
            items:
              type: number
              format: float
          - type: array
            items:
              type: array
              items:
                type: number
                format: float
          - type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: float
        geometries:
          type: array
          description: List of geometries for a GeometryCollection. Nested GeometryCollection is not supported
          items:
            $ref: '#/components/schemas/DocumentGeoJsonGeometry'
      example:
        type: Point
        coordinates:
        - 10.74609
        - 59.91273

openapi: 3.2.0
info:
  title: Cognite Data products API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Data Products
  description: Data products are governed, ready-for-consumption data assets derived from data domains, following data mesh principles.
paths:
  /dataproducts:
    post:
      tags:
      - Data Products
      operationId: createDataProduct
      summary: Create a data product
      description: '> **Required capabilities:** `dataProductsAcl:CREATE`


        Creates a new data product. Maximum 100 data products allowed per project. Request body must contain an ''items'' array with up to 1 data product definition per request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductCreateRequest'
      responses:
        '201':
          description: The created data product (as a single-item list).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProduct'
        '400':
          $ref: '#/components/responses/400ErrorResponse'
      x-capability:
      - dataProductsAcl:CREATE
    get:
      tags:
      - Data Products
      operationId: listDataProducts
      summary: List data products
      description: '> **Required capabilities:** `dataProductsAcl:READ`


        List all data products, with pagination.'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 100
        description: Maximum number of data products to be returned. The maximum results returned by the server is 100 even if you specify a higher limit. The API may return fewer results than the specified limit. Only if a `nextCursor` is returned in the response are there more results to fetch.
      responses:
        '200':
          description: A list of data products.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProduct'
                  nextCursor:
                    type: string
                    description: Cursor for the next page of results. If not present, there are no more results.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
      x-capability:
      - dataProductsAcl:READ
  /dataproducts/{externalId}:
    get:
      tags:
      - Data Products
      operationId: getDataProduct
      summary: Get a data product
      description: '> **Required capabilities:** `dataProductsAcl:READ`


        Retrieves a specific data product by its external identifier.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      responses:
        '200':
          description: The data product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProduct'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:READ
  /dataproducts/delete:
    post:
      tags:
      - Data Products
      operationId: deleteDataProduct
      summary: Delete a data product
      description: '> **Required capabilities:** `dataProductsAcl:DELETE`


        Permanently removes a data product. A data product can not be deleted if it contains versions. This operation cannot be undone.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductDeleteRequest'
      responses:
        '200':
          description: The data product was successfully deleted.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:DELETE
  /dataproducts/update:
    post:
      tags:
      - Data Products
      operationId: updateDataProduct
      summary: Update a data product
      description: '> **Required capabilities:** `dataProductsAcl:UPDATE`


        Update the attributes of a data product. Fields that aren''t included in the request aren''t changed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductUpdateRequest'
      responses:
        '200':
          description: The updated data product (as a single-item list).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProduct'
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:UPDATE
  /dataproducts/{externalId}/versions:
    post:
      tags:
      - Data Products
      operationId: createDataProductVersion
      summary: Create a data product version
      description: '> **Required capabilities:** `dataProductsAcl:UPDATE`


        Creates a new data product version that references a collection of data modeling views. Once created, view references cannot be removed or modified, but view references can be added, and other properties can be updated.

        A data product can have up to 10 versions.

        The request body must contain an `items` array with exactly one data product version definition.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductVersionCreateRequest'
      responses:
        '201':
          description: The created data product version (as a single-item list).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProductVersion'
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:UPDATE
    get:
      tags:
      - Data Products
      operationId: listDataProductVersions
      summary: List data product versions
      description: '> **Required capabilities:** `dataProductsAcl:READ`


        List all versions of a data product, with pagination.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 10
        description: Maximum number of data product versions to be returned. The maximum results returned by the server is 10 even if you specify a higher limit. The API may return fewer results than the specified limit. Only if a `nextCursor` is returned in the response are there more results to fetch.
      responses:
        '200':
          description: All versions of a data product.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProductVersion'
                  nextCursor:
                    type: string
                    description: Cursor for the next page of results. If not present, there are no more results.
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:READ
  /dataproducts/{externalId}/versions/{version}:
    get:
      tags:
      - Data Products
      operationId: getDataProductVersion
      summary: Get a data product version
      description: '> **Required capabilities:** `dataProductsAcl:READ`


        Retrieves a specific version of a data product by its semantic version.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      - in: path
        name: version
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/DataProductSemanticVersion'
          - $ref: '#/components/schemas/DataProductSemanticVersionCompactDescription'
        description: The semantic version of the data product version to retrieve.
      responses:
        '200':
          description: The requested data product version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductVersion'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:READ
  /dataproducts/{externalId}/versions/delete:
    post:
      tags:
      - Data Products
      operationId: deleteDataProductVersions
      summary: Delete data product versions
      description: '> **Required capabilities:** `dataProductsAcl:UPDATE`


        Deletes one or more versions of a data product. Accepts a list of semantic versions. This operation cannot be undone.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductVersionDeleteRequest'
      responses:
        '200':
          description: The data product versions were successfully deleted.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:UPDATE
  /dataproducts/{externalId}/versions/update:
    post:
      tags:
      - Data Products
      operationId: updateDataProductVersion
      summary: Update data product version
      description: '> **Required capabilities:** `dataProductsAcl:UPDATE`


        Update the attributes of a data product version. Fields that aren''t included in the request aren''t changed.'
      parameters:
      - $ref: '#/components/parameters/dataProductExternalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductVersionUpdateRequest'
      responses:
        '200':
          description: The updated data product version (as a single-item list).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProductVersion'
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
      x-capability:
      - dataProductsAcl:UPDATE
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    DataProductCreate:
      type: object
      required:
      - externalId
      - name
      properties:
        externalId:
          $ref: '#/components/schemas/DataProductExternalId'
        name:
          type: string
          description: Human-readable name of the data product.
          minLength: 1
          maxLength: 50
        schemaSpace:
          allOf:
          - $ref: '#/components/schemas/Space'
          - description: 'The schema space where the data product''s data modeling views will be located.

              This space will be exclusively owned by this data product.

              If this field is specified, and the space does not exist or is already owned by another data product, the creation of the data product will fail.

              If this field is not specified, this data product will claim ownership of the space whose name is equal to the `externalId` of the data product. If such a space does not exist or is already owned by another data product, the creation of the data product will fail.

              '
        description:
          type: string
          description: A description of the data product.
          maxLength: 200
        isGoverned:
          type: boolean
          default: false
          description: Indicates whether the data product follows governance policies and standards. Note that this property is currently only informational.
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          description: A list of distinct tags for categorization and filtering. If the list contains duplicates, only one occurrence will be kept. The order of tags is not guaranteed to be preserved.
          minItems: 0
          maxItems: 10
          uniqueItems: true
    DataProductVersionCreate:
      type: object
      description: 'A new version of a data product, with a collection of data modeling view references. Each item of the collection is immutable (it may not be modified or removed later), but items may be added later.

        A data product can have up to 10 versions.

        '
      required:
      - version
      - views
      properties:
        version:
          allOf:
          - $ref: '#/components/schemas/DataProductSemanticVersion'
          - $ref: '#/components/schemas/DataProductSemanticVersionExtendedDescription'
        views:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          description: A collection of references to views (with versions) that will be associated with this data product version. The views must either reside in the schema space of the associated data product, or in a system space (one that begins with `cdf_`). The referenced views must already exist at the time of creation of this data product version. Each item of the collection is immutable (it may not be modified or removed later), but items may be added later.
          items:
            type: object
            required:
            - space
            - externalId
            - version
            properties:
              space:
                allOf:
                - $ref: '#/components/schemas/Space'
                - description: 'The space where the view is located. This must be the same space as the schema space of the data product, or a system space (starting with `cdf_`).

                    '
              externalId:
                $ref: '#/components/schemas/ViewExternalId'
              version:
                type: string
                description: The version of the view.
        status:
          allOf:
          - $ref: '#/components/schemas/DataProductVersionStatus'
          - default: draft
        description:
          type: string
          description: A detailed description of this specific version of the data product. The text will be interpreted as markdown.
          format: markdown
          maxLength: 2000
        terms:
          type: object
          description: Terms and conditions for using this data product version.
          properties:
            usage:
              type: string
              format: markdown
              description: Permitted usage terms and conditions. The text will be interpreted as markdown.
              maxLength: 2000
            limitations:
              type: string
              format: markdown
              description: Usage limitations and restrictions. The text will be interpreted as markdown.
              maxLength: 500
    DataProductVersionPatch:
      type: object
      description: Changes to apply to a data product version
      properties:
        status:
          $ref: '#/components/schemas/SinglePatchDataProductVersionStatus'
        description:
          $ref: '#/components/schemas/SinglePatchString'
        terms:
          $ref: '#/components/schemas/DataProductVersionTermsPatch'
        views:
          $ref: '#/components/schemas/DataProductVersionViewsAdd'
    DataProductVersionCreateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/DataProductVersionCreate'
          description: Array of data product versions to create.
    ArrayPatchString:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ArrayPatchStringSet'
      - $ref: '#/components/schemas/ArrayPatchStringAddOrRemove'
      description: Change that will be applied to the array.
    DataProductVersionUpdateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/DataProductVersionChange'
          description: List of data product versions (of this data product) to update.
    DataProductVersionViewsAdd:
      title: add
      type: object
      required:
      - add
      properties:
        add:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: A collection of references to views (with versions) that will be added to this data product version. The views must either reside in the schema space of the associated data product, or in a system space (one that begins with `cdf_`). The referenced views must already exist at the time of updating this data product version. After being added, the new items are immutable (they may not be modified or removed later).
          items:
            type: object
            required:
            - space
            - externalId
            - version
            properties:
              space:
                allOf:
                - $ref: '#/components/schemas/Space'
                - description: 'The space where the view is located. This must be the same space as the schema space of the data product, or a system space (starting with `cdf_`).

                    '
              externalId:
                $ref: '#/components/schemas/ViewExternalId'
              version:
                type: string
                description: The version of the view.
    DataProductCreateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/DataProductCreate'
          description: Array of data products to create.
    ArrayPatchStringSet:
      title: set
      type: object
      required:
      - set
      properties:
        set:
          uniqueItems: true
          type: array
          items:
            type: string
    Space:
      type: string
      pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,41}[a-zA-Z0-9]?$
      minLength: 1
      maxLength: 43
    DataProductSemanticVersionExtendedDescription:
      description: 'The semantic version of this data product version. Together, the data product external id (in the request path)

        and the semantic version uniquely identifies this data product version. Note that even if a data product version

        is deleted, its semantic version may never be reused within its owning data product.

        We currently use a simplified version of what is described at [semver.org](https://semver.org/),

        only allowing `major.minor.patch` with up to four digits in each.

        '
    SetStringField:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          type: string
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    SinglePatchDataProductVersionStatus:
      title: set
      type: object
      required:
      - set
      properties:
        set:
          $ref: '#/components/schemas/DataProductVersionStatus'
      description: Set a new value for the data product version status. Note that this property is currently only informational.
    DataProductVersionChange:
      type: object
      required:
      - version
      - update
      properties:
        version:
          allOf:
          - $ref: '#/components/schemas/DataProductSemanticVersion'
          - description: The semantic version of the data product version to update.
        update:
          $ref: '#/components/schemas/DataProductVersionPatch'
    SinglePatchString:
      title: set
      type: object
      oneOf:
      - $ref: '#/components/schemas/SetStringField'
      - $ref: '#/components/schemas/RemoveField'
      description: Set a new value for the string, or remove the value.
    ViewExternalId:
      type: string
      pattern: ^[a-zA-Z]([a-zA-Z0-9_]{0,253}[a-zA-Z0-9])?$
      minLength: 1
      maxLength: 255
      description: The external ID of the view.
    DataProductVersionTermsPatch:
      title: modify
      type: object
      properties:
        modify:
          type: object
          description: Modify terms fields
          properties:
            usage:
              $ref: '#/components/schemas/SinglePatchString'
            limitations:
              $ref: '#/components/schemas/SinglePatchString'
      description: Modify nested terms object fields.
    ArrayPatchStringAddOrRemove:
      title: add/remove
      type: object
      properties:
        add:
          uniqueItems: true
          type: array
          items:
            type: string
        remove:
          uniqueItems: true
          type: array
          items:
            type: string
    DataProductExternalId:
      type: string
      description: Data product external identifier
      pattern: ^[a-z]([a-z0-9_-]{0,98}[a-z0-9])?$
      minLength: 1
      maxLength: 100
    DataProductUpdateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/DataProductChange'
          description: List of data products to update.
    DataProductVersionStatus:
      type: string
      enum:
      - draft
      - published
      - deprecated
      description: The status of this data product version.
    DataProductPatch:
      type: object
      description: Changes to apply to a data product
      properties:
        name:
          $ref: '#/components/schemas/SetStringField'
        description:
          $ref: '#/components/schemas/SinglePatchString'
        isGoverned:
          $ref: '#/components/schemas/SinglePatchBoolean'
        tags:
          $ref: '#/components/schemas/ArrayPatchString'
    DataProductSemanticVersion:
      type: string
      example: 1.2.34
      pattern: ^(0|[1-9]\d{0,3})\.(0|[1-9]\d{0,3})\.(0|[1-9]\d{0,3})$
      minLength: 5
      maxLength: 14
    DataProductSemanticVersionCompactDescription:
      description: 'A semantic version number. We currently use a simplified version of what is described at [semver.org](https://semver.org/).

        '
    SinglePatchBoolean:
      type: object
      title: set
      required:
      - set
      properties:
        set:
          type: boolean
    DataProduct:
      type: object
      required:
      - externalId
      - name
      - schemaSpace
      - isGoverned
      - domains
      - tags
      - createdTime
      - lastUpdatedTime
      properties:
        externalId:
          $ref: '#/components/schemas/DataProductExternalId'
        name:
          type: string
          description: Human-readable name of the data product.
          minLength: 1
          maxLength: 50
        schemaSpace:
          allOf:
          - $ref: '#/components/schemas/Space'
          - readOnly: true
            description: 'The schema space where the data product''s data modeling views are located. This space is exclusively owned by this data product.

              '
        description:
          type: string
          description: A description of the data product.
          maxLength: 200
        isGoverned:
          type: boolean
          description: Indicates whether the data product follows governance policies and standards. Note that this property is currently only informational.
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          description: A list of distinct tags for categorization and filtering.
          minItems: 0
          maxItems: 10
          uniqueItems: true
        domains:
          type: array
          readOnly: true
          uniqueItems: true
          items:
            type: string
            description: External ID of a data domain.
          description: List of data domain external IDs that this data product is derived from. This field will be empty while the data domains feature is in development.
        createdTime:
          allOf:
          - $ref: '#/components/schemas/EpochTimestamp'
          readOnly: true
        lastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/EpochTimestamp'
          readOnly: true
    RemoveField:
      title: remove
      type: object
      required:
      - setNull
      properties:
        setNull:
          type: boolean
          example: true
    DataProductChange:
      type: object
      required:
      - externalId
      - update
      properties:
        externalId:
          $ref: '#/components/schemas/DataProductExternalId'
        update:
          $ref: '#/components/schemas/DataProductPatch'
    DataProductDeleteRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          uniqueItems: true
          maxItems: 1
          minItems: 1
          description: List of ID objects
          items:
            type: object
            required:
            - externalId
            properties:
              externalId:
                $ref: '#/components/schemas/DataProductExternalId'
    DataProductVersion:
      type: object
      description: 'A version of a data product, with a collection of data modeling view references. Each item of the collection is immutable (it may not be modified or removed later), but items may be added later.

        A data product can have up to 10 versions.

        '
      required:
      - version
      - views
      - status
      - terms
      - createdTime
      - lastUpdatedTime
      properties:
        version:
          allOf:
          - $ref: '#/components/schemas/DataProductSemanticVersion'
          - $ref: '#/components/schemas/DataProductSemanticVersionExtendedDescription'
          - readOnly: true
        views:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          description: 'A collection of references to views (with versions) that are associated with this data product version. Each item of the collection is immutable (it may not be modified or removed later), but items may be added later.

            '
          items:
            type: object
            required:
            - space
            - externalId
            - version
            properties:
              space:
                allOf:
                - $ref: '#/components/schemas/Space'
                - description: The space where the view is located.
              externalId:
                $ref: '#/components/schemas/ViewExternalId'
              version:
                type: string
                description: The version of the view.
        status:
          $ref: '#/components/schemas/DataProductVersionStatus'
        description:
          type: string
          description: A detailed description of this specific version of the data product. The text will be interpreted as markdown.
          format: markdown
          maxLength: 2000
        terms:
          type: object
          description: Terms and conditions for using this data product version.
          properties:
            usage:
              type: string
              format: markdown
              description: Permitted usage terms and conditions. The text will be interpreted as markdown.
              maxLength: 2000
            limitations:
              type: string
              format: markdown
              description: Usage limitations and restrictions. The text will be interpreted as markdown.
              maxLength: 500
        createdTime:
          allOf:
          - $ref: '#/components/schemas/EpochTimestamp'
          readOnly: true
        lastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/EpochTimestamp'
          readOnly: true
    DataProductVersionDeleteRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 10
          description: Array of semantic versions (of this data product) to delete.
          items:
            type: object
            required:
            - version
            properties:
              version:
                allOf:
                - $ref: '#/components/schemas/DataProductSemanticVersion'
                - $ref: '#/components/schemas/DataProductSemanticVersionCompactDescription'
  parameters:
    dataProductExternalId:
      name: externalId
      in: path
      description: 'Data product external identifier

        '
      required: true
      schema:
        $ref: '#/components/schemas/DataProductExternalId'
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
  responses:
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    400ErrorResponse:
      description: The response for a bad request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
          example:
            error:
              code: 400
              message: '`null` values aren''t allowed.'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

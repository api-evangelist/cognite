      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModelRevision'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':

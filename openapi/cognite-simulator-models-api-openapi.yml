openapi: 3.2.0
info:
  title: Cognite Simulator Models API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Simulator Models
  description: The simulator model resource represents an asset modeled in a simulator.
paths:
  /simulators/models:
    post:
      tags:
      - Simulator Models
      summary: Create Simulator Model
      description: Create a simulator model.
      operationId: create_simulator_model_simulators_models_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleItemSimulatorModelCreateCommand'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModel'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/list:
    post:
      tags:
      - Simulator Models
      summary: Filter Simulator Models
      description: Retrieves a list of simulator models that match the given criteria.
      operationId: filter_simulator_models_simulators_models_list_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSimulatorModelsQuery'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithCursorSimulatorModel'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/aggregate:
    post:
      tags:
      - Simulator Models
      summary: Aggregate Simulator Models
      description: Calculate aggregates for simulator models, considering the optional filter specification.
      operationId: aggregate_simulator_models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateSimulatorModelsQuery'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAggregateCount'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/delete:
    post:
      tags:
      - Simulator Models
      summary: Delete Simulator Model
      description: Delete a simulator model. This will also delete all associated simulator resources (e.g. revisions, routines, runs).
      operationId: delete_simulator_model_simulators_models_delete_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleItemIdRefOrExternalIdRef'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/update:
    post:
      tags:
      - Simulator Models
      summary: Update Simulator Model
      description: Update a simulator model.
      operationId: update_simulator_model_simulators_models_update_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleItemSimulatorModelUpdateCommand'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModel'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/byids:
    post:
      tags:
      - Simulator Models
      summary: Retrieve Simulator Model
      description: Retrieve a simulator model by ID or external ID.
      operationId: retrieve_simulator_model_simulators_models_byids_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleItemIdRefOrExternalIdRef'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModel'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/revisions:
    post:
      tags:
      - Simulator Models
      summary: Create Simulator Model Revision
      description: Create a simulator model revision.
      operationId: create_simulator_model_revision_simulators_models_revisions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleItemSimulatorModelRevisionCreateCommand'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModelRevision'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/revisions/list:
    post:
      tags:
      - Simulator Models
      summary: Filter Simulator Model Revisions
      description: Retrieves a list of simulator model revisions that match the given criteria.
      operationId: filter_simulator_model_revisions_simulators_models_revisions_list_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSimulatorModelRevisionsQuery'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithCursorSimulatorModelRevisionView'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
  /simulators/models/revisions/byids:
    post:
      tags:
      - Simulator Models
      summary: Retrieve Simulator Model Revisions
      description: Retrieve one or more simulator model revisions by IDs or external IDs.
      operationId: retrieve_simulator_model_revisions_simulators_models_revisions_byids_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputItemsIdRefOrExternalIdRef'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulatorModelRevision'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
components:
  schemas:
    ListWithCursorSimulatorModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModel'
          type: array
          title: Items
        nextCursor:
          title: NextCursor
          type: string
      additionalProperties: false
      type: object
      required:
      - items
      title: ListWithCursorSimulatorModel
    SimulatorModel:
      properties:
        dataSetId:
          type: integer
          title: DataSetId
          description: Dataset id of the resource
          examples:
          - 5559452808603919
        id:
          type: integer
          title: Id
          description: A unique id of a simulation model
        externalId:
          type: string
          title: ExternalId
          description: External id of the simulation model
        simulatorExternalId:
          type: string
          title: SimulatorExternalId
          description: External id of the simulator
        name:
          type: string
          title: Name
          description: Name of the simulation model
        description:
          title: Description
          description: Description of the simulation model
          type: string
        type:
          title: Type
          description: Model type of the simulation model. List of available types is available in the simulator resource.
          type: string
        createdTime:
          type: integer
          title: CreatedTime
        lastUpdatedTime:
          type: integer
          title: LastUpdatedTime
      additionalProperties: false
      type: object
      required:
      - dataSetId
      - id
      - externalId
      - simulatorExternalId
      - name
      - createdTime
      - lastUpdatedTime
      title: SimulatorModel
    UpdateSetShortStr:
      properties:
        set:
          type: string
          maxLength: 50
          minLength: 1
          title: Set
          description: Value to set
      additionalProperties: false
      type: object
      required:
      - set
      title: UpdateSetShortStr
    ListSimulatorModelsFilters:
      properties:
        simulatorExternalIds:
          title: SimulatorExternalIds
          description: Filter by simulator external ids
          examples:
          - - PROSPER
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
        externalIdPrefix:
          title: ExternalIdPrefix
          description: Filter by prefix on simulator model external ids
          type: string
          maxLength: 255
          minLength: 1
        dataSetIds:
          title: DataSetIds
          description: Filter by data set IDs
          items:
            type: integer
          type: array
          maxItems: 100
          minItems: 1
      additionalProperties: false
      type: object
      title: ListSimulatorModelsFilters
    ExternalIdRef:
      properties:
        externalId:
          type: string
          title: ExternalId
          description: String-based ID
      additionalProperties: false
      type: object
      required:
      - externalId
      title: ExternalIdRef
    SingleItemSimulatorModelCreateCommand:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModelCreateCommand'
          type: array
          title: Items
          description: A list with a single item
      additionalProperties: false
      type: object
      required:
      - items
      title: SingleItemSimulatorModelCreateCommand
    SimulatorModelUpdate:
      properties:
        name:
          description: Name of the model
          examples:
          - set: Model for PROSPER
          $ref: '#/components/schemas/UpdateSetShortStr'
        description:
          description: Description of the simulation model
          $ref: '#/components/schemas/UpdateSetString'
      additionalProperties: false
      type: object
      title: SimulatorModelUpdate
    SingleItemIdRefOrExternalIdRef:
      properties:
        items:
          items:
            anyOf:
            - $ref: '#/components/schemas/IdRef'
            - $ref: '#/components/schemas/ExternalIdRef'
          type: array
          title: Items
          description: A list with a single item
      additionalProperties: false
      type: object
      required:
      - items
      title: SingleItemIdRefOrExternalIdRef
    SingleItemSimulatorModelUpdateCommand:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModelUpdateCommand'
          type: array
          title: Items
          description: A list with a single item
      additionalProperties: false
      type: object
      required:
      - items
      title: SingleItemSimulatorModelUpdateCommand
    SortByCreatedTime:
      properties:
        order:
          anyOf:
          - type: string
            const: asc
            enum:
            - asc
          - type: string
            const: desc
            enum:
            - desc
          title: Order
          description: Sort order
        property:
          type: string
          const: createdTime
          title: Property
          description: Name of the property to sort by
          enum:
          - createdTime
      additionalProperties: false
      type: object
      required:
      - order
      - property
      title: SortByCreatedTime
    UpdateSetString:
      properties:
        set:
          type: string
          maxLength: 255
          minLength: 1
          title: Set
          description: Value to set
      additionalProperties: false
      type: object
      required:
      - set
      title: UpdateSetString
    ListSimulatorModelRevisionsQuery:
      properties:
        filter:
          $ref: '#/components/schemas/ListSimulatorModelRevisionsFilters'
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          default: 1000
        cursor:
          title: Cursor
          description: Cursor for pagination
          type: string
        sort:
          title: Sort
          description: Only supports sorting by one property at a time
          items:
            $ref: '#/components/schemas/SortByCreatedTime'
          type: array
      additionalProperties: false
      type: object
      title: ListSimulatorModelRevisionsQuery
    SimulatorModelUpdateCommand:
      properties:
        id:
          type: integer
          title: Id
          description: Id of the simulator model
        update:
          $ref: '#/components/schemas/SimulatorModelUpdate'
      additionalProperties: false
      type: object
      required:
      - id
      - update
      title: SimulatorModelUpdateCommand
    ListSimulatorModelRevision:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModelRevision'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ListSimulatorModelRevision
    IdRef:
      properties:
        id:
          type: integer
          title: Id
          description: ID
          examples:
          - 5559452808603919
      additionalProperties: false
      type: object
      required:
      - id
      title: IdRef
    ListAggregateCount:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AggregateCount'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ListAggregateCount
    AggregateCount:
      properties:
        count:
          type: integer
          title: Count
          description: Number of items
      additionalProperties: false
      type: object
      required:
      - count
      title: AggregateCount
    InputItemsIdRefOrExternalIdRef:
      properties:
        items:
          items:
            anyOf:
            - $ref: '#/components/schemas/IdRef'
            - $ref: '#/components/schemas/ExternalIdRef'
          type: array
          maxItems: 100
          minItems: 1
          title: Items
          description: A list of items
      additionalProperties: false
      type: object
      required:
      - items
      title: InputItemsIdRefOrExternalIdRef
    AggregateSimulatorModelsQuery:
      properties:
        filter:
          $ref: '#/components/schemas/ListSimulatorModelsFilters'
        aggregate:
          type: string
          const: count
          title: Aggregate
          description: Aggregate type
          enum:
          - count
      additionalProperties: false
      type: object
      required:
      - aggregate
      title: AggregateSimulatorModelsQuery
    ListSimulatorModelRevisionsFilters:
      properties:
        modelExternalIds:
          title: ModelExternalIds
          description: Filter by model external ids
          examples:
          - - model_1
            - model_2
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
        simulatorExternalIds:
          title: SimulatorExternalIds
          description: Filter by simulator external ids
          examples:
          - - PROSPER
            - PetroSIM
          items:
            type: string
            maxLength: 50
            minLength: 1
          type: array
          maxItems: 100
          minItems: 1
        allVersions:
          title: AllVersions
          description: If all versions of the entity should be returned. Defaults to false which returns only the latest revision for each model.
          default: false
          type: boolean
        createdTime:
          description: Filter by created time range
          $ref: '#/components/schemas/EpochTimestampRange'
        lastUpdatedTime:
          description: Filter by last updated time range
          $ref: '#/components/schemas/EpochTimestampRange'
      additionalProperties: false
      type: object
      title: ListSimulatorModelRevisionsFilters
    EmptyResponse:
      properties: {}
      type: object
      title: EmptyResponse
    APIError:
      properties:
        message:
          type: string
          title: Message
        code:
          type: integer
          title: Code
      type: object
      required:
      - message
      - code
      title: APIError
    ListSimulatorModelsQuery:
      properties:
        filter:
          $ref: '#/components/schemas/ListSimulatorModelsFilters'
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          default: 1000
        cursor:
          title: Cursor
          description: Cursor for pagination
          type: string
        sort:
          title: Sort
          description: Only supports sorting by one property at a time
          items:
            $ref: '#/components/schemas/SortByCreatedTime'
          type: array
      additionalProperties: false
      type: object
      title: ListSimulatorModelsQuery
    SimulatorModelRevisionView:
      properties:
        dataSetId:
          type: integer
          title: DataSetId
          description: Dataset id of the resource
          examples:
          - 5559452808603919
        id:
          type: integer
          title: Id
          description: A unique id of a simulation model revision
        externalId:
          type: string
          title: ExternalId
          description: External id of the simulation model revision
        simulatorExternalId:
          type: string
          title: SimulatorExternalId
          description: External id of the simulator
        modelExternalId:
          type: string
          title: ModelExternalId
          description: External id of the simulation model
        description:
          title: Description
          description: Description of the simulation model revision
          type: string
        fileId:
          type: integer
          title: FileId
          description: Source file id of the simulation model revision
        createdByUserId:
          type: string
          title: CreatedByUserId
          description: Author of the simulation model revision
        status:
          $ref: '#/components/schemas/SimulatorModelRevisionStatus'
          description: Status of the simulation model revision
          default: unknown
        statusMessage:
          title: StatusMessage
          description: Status message of the simulation model revision
          type: string
        versionNumber:
          type: integer
          title: VersionNumber
          description: Version number of the simulation model revision. Unique per simulation model.
        logId:
          type: integer
          title: LogId
          description: Log ID
        createdTime:
          type: integer
          title: CreatedTime
        lastUpdatedTime:
          type: integer
          title: LastUpdatedTime
      additionalProperties: false
      type: object
      required:
      - dataSetId
      - id
      - externalId
      - simulatorExternalId
      - modelExternalId
      - fileId
      - createdByUserId
      - versionNumber
      - logId
      - createdTime
      - lastUpdatedTime
      title: SimulatorModelRevisionView
    EpochTimestampRange:
      description: Range between two timestamps (inclusive).
      type: object
      properties:
        max:
          description: Maximum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
        min:
          description: Minimum timestamp (inclusive). The timestamp is represented as number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
          type: integer
          minimum: 0
          format: int64
    SimulatorModelRevisionCreateCommand:
      properties:
        externalId:
          type: string
          maxLength: 255
          minLength: 1
          title: ExternalId
          description: External id of the simulation model revision
        modelExternalId:
          type: string
          title: ModelExternalId
          description: External id of the simulation model
        description:
          title: Description
          description: Description of the simulation model revision
          type: string
          maxLength: 255
          minLength: 1
        fileId:
          type: integer
          title: FileId
          description: Source file id of the simulation model revision
      additionalProperties: false
      type: object
      required:
      - externalId
      - modelExternalId
      - fileId
      title: SimulatorModelRevisionCreateCommand
    SimulatorModelCreateCommand:
      properties:
        externalId:
          type: string
          maxLength: 255
          minLength: 1
          title: ExternalId
          description: External id of the simulation model
        simulatorExternalId:
          type: string
          maxLength: 50
          minLength: 1
          title: SimulatorExternalId
          description: External id of the simulator
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
          description: Name of the simulation model
        description:
          title: Description
          description: Description of the simulation model
          type: string
          maxLength: 255
          minLength: 1
        dataSetId:
          type: integer
          title: DataSetId
          description: Data set id of the simulation model
        type:
          type: string
          maxLength: 50
          minLength: 1
          title: Type
          description: Model type of the simulation model. List of available types is available in the simulator resource.
      additionalProperties: false
      type: object
      required:
      - externalId
      - simulatorExternalId
      - name
      - dataSetId
      - type
      title: SimulatorModelCreateCommand
    ListSimulatorModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModel'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ListSimulatorModel
    SimulatorModelRevisionStatus:
      type: string
      enum:
      - unknown
      - success
      - failure
      title: SimulatorModelRevisionStatus
    SingleItemSimulatorModelRevisionCreateCommand:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModelRevisionCreateCommand'
          type: array
          title: Items
          description: A list with a single item
      additionalProperties: false
      type: object
      required:
      - items
      title: SingleItemSimulatorModelRevisionCreateCommand
    ErrorBase:
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      type: object
      required:
      - error
      title: ErrorBase
    ListWithCursorSimulatorModelRevisionView:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SimulatorModelRevisionView'
          type: array
          title: Items
        nextCursor:
          title: NextCursor
          type: string
      additionalProperties: false
      type: object
      required:
      - items
      title: ListWithCursorSimulatorModelRevisionView
    SimulatorModelRevision:
      properties:
        dataSetId:
          type: integer
          title: DataSetId
          description: Dataset id of the resource
          examples:
          - 5559452808603919
        id:
          type: integer
          title: Id
          description: A unique id of a simulation model revision
        externalId:
          type: string
          title: ExternalId
          description: External id of the simulation model revision
        simulatorExternalId:
          type: string
          title: SimulatorExternalId
          description: External id of the simulator
        modelExternalId:
          type: string
          title: ModelExternalId
          description: External id of the simulation model
        description:
          title: Description
          description: Description of the simulation model revision
          type: string
        fileId:
          type: integer
          title: FileId
          description: Source file id of the simulation model revision
        createdByUserId:
          type: string

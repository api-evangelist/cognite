    MissingField:
      description: Missing required fields.
      content:
        application/json:
          schema:
            type: object
            description: Some required fields are missing.
            required:
            - code
            - message
            - missingFields
            properties:
              code:
                type: integer
                description: HTTP status code.
                format: int32
                example: 400
              message:
                type: string
                description: Error message.
              missingFields:
                uniqueItems: true
                type: array
                description: Fields that are missing.
                items:
                  type: object
                  description: Fields that are missing.

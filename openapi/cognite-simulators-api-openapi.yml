openapi: 3.2.0
info:
  title: Cognite Simulators API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Simulators
  description: The simulator resource contains the definitions necessary for Cognite Data Fusion (CDF) to interact with a given simulator.
paths:
  /simulators/list:
    post:
      tags:
      - Simulators
      summary: Filter Simulators
      description: List simulators.
      operationId: filter_simulators_simulators_list_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSimulatorsQuery'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulator'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBase'
          description: Internal Server Error
components:
  schemas:
    APIError:
      properties:
        message:
          type: string
          title: Message
        code:
          type: integer
          title: Code
      type: object
      required:
      - message
      - code
      title: APIError
    SimulatorQuantity:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
          description: Name of the quantity
          examples:
          - Mass
          - Length
          - Pressure
        label:
          type: string
          maxLength: 50
          minLength: 1
          title: Label
          description: Label of the quantity. For display purposes
          examples:
          - Mass
          - Length
          - Pressure
        units:
          items:
            $ref: '#/components/schemas/SimulatorUnitEntry'
          type: array
          maxItems: 100
          minItems: 1
          title: Units
          description: Units of measure supported by the simulator for the given quantity
      additionalProperties: false
      type: object
      required:
      - name
      - label
      - units
      title: SimulatorQuantity
    ListSimulator:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Simulator'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ListSimulator
    Simulator:
      properties:
        id:
          type: integer
          title: Id
          description: A unique id of a simulator
        externalId:
          type: string
          title: ExternalId
          description: External id of the simulator
        name:
          type: string
          title: Name
          description: Name of the simulator
        fileExtensionTypes:
          items:
            type: string
          type: array
          title: FileExtensionTypes
          description: File extension types allowed as a model dependency.
        modelTypes:
          title: ModelTypes
          description: Model types supported by the simulator
          items:
            $ref: '#/components/schemas/SimulatorModelType'
          type: array
        stepFields:
          title: StepFields
          description: Step types supported by the simulator when creating routines
          items:
            $ref: '#/components/schemas/SimulatorStep'
          type: array
        unitQuantities:
          title: UnitQuantities
          description: Quantities and their units supported by the simulator
          items:
            $ref: '#/components/schemas/SimulatorQuantity'
          type: array
        createdTime:
          type: integer
          title: CreatedTime
        lastUpdatedTime:
          type: integer
          title: LastUpdatedTime
      additionalProperties: false
      type: object
      required:
      - id
      - externalId
      - name
      - fileExtensionTypes
      - createdTime
      - lastUpdatedTime
      title: Simulator
    SimulatorModelType:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
          description: Name of the model type
        key:
          type: string
          maxLength: 50
          minLength: 1
          title: Key
          description: Key of the model type
      additionalProperties: false
      type: object
      required:
      - name
      - key
      title: SimulatorModelType
    SimulatorUnitEntry:
      properties:
        label:
          type: string
          maxLength: 50
          minLength: 0
          title: Label
          description: Label of the unit. For display purposes
          examples:
          - kg
          - m
          - Pa
        name:
          type: string
          maxLength: 50
          minLength: 0
          title: Name
          description: Name of the unit
          examples:
          - kg
          - m
          - Pa
      additionalProperties: false
      type: object
      required:
      - label
      - name
      title: SimulatorUnitEntry
    ListSimulatorsFilters:
      properties: {}
      additionalProperties: false
      type: object
      title: ListSimulatorsFilters
    SimulatorStepOption:
      properties:
        label:
          type: string
          maxLength: 50
          minLength: 1
          title: Label
          description: Label that will be shown in the dropdown in the GUI of the routine builder
          examples:
          - Solve Flowsheet
          - Pause Solver
        value:
          type: string
          maxLength: 50
          minLength: 1
          title: Value
          description: Name of the dropdown item
          examples:
          - Solve
          - Pause
      additionalProperties: false
      type: object
      required:
      - label
      - value
      title: SimulatorStepOption
    SimulatorStepField:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
          description: Name of the field
        label:
          type: string
          maxLength: 50
          minLength: 1
          title: Label
          description: Label of the field. Used to render the field label in the GUI.
        info:
          type: string
          maxLength: 200
          title: Info
          description: Info of the field. Used to render a tooltip for the field in the GUI.
        options:
          title: Options
          description: Options to show in the GUI dropdown of the routine builder
          items:
            $ref: '#/components/schemas/SimulatorStepOption'
          type: array
          maxItems: 100
          minItems: 1
      additionalProperties: false
      type: object
      required:
      - name
      - label
      - info
      title: SimulatorStepField
    ListSimulatorsQuery:
      properties:
        filter:
          $ref: '#/components/schemas/ListSimulatorsFilters'
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          default: 1000
      type: object
      title: ListSimulatorsQuery
    ErrorBase:
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      type: object
      required:
      - error
      title: ErrorBase
    SimulatorStep:
      properties:
        stepType:
          type: string
          maxLength: 50
          minLength: 1
          title: StepType
          description: Step type
        fields:
          items:
            $ref: '#/components/schemas/SimulatorStepField'
          type: array
          maxItems: 100
          minItems: 1
          title: Fields
          description: Fields of the step
      additionalProperties: false
      type: object
      required:
      - stepType
      - fields
      title: SimulatorStep
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

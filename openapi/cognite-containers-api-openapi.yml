    ContainerInspectResultItem:
      type: object
      required:
      - externalId
      - space
      - inspectionResults
      properties:
        externalId:
          description: External ids for the requested items
          allOf:
          - $ref: '#/components/schemas/DMSExternalId'
        space:
          $ref: '#/components/schemas/SpaceSpecification'
        inspectionResults:
          type: object
          properties:
            involvedViewCount:
              description: The total number of views mapping this container (including views you don't have access to)
              type: integer
            involvedViews:
              type: array
              description: The views you have access to which map this container.
              items:
                $ref: '#/components/schemas/ViewReference'
    RecordContainerPropertyTypeDefinition:
      type: object
      required:
      - type
      properties:
        type:
          description: "The type of data you can store in this property. Most properties can also hold a list of values, for example, a list of integers or a list of timestamps. The supported storage types are:\n\n\n* text,\n * boolean,\n * 32-bit, and 64-bit float,\n * 32-bit, and 64-bit integer,\n * timestamp,\n * date,\n * JSON fragment,\n * direct relation to an existing node,\n * enum.\n\n\nThe JSON fragments have to be valid JSON objects. If JSON arrays are to be stored, these must be wrapped in a JSON object. JSON values (such as string, number, boolean) should use their respective primitive form instead. The maximum allowed size for a JSON object is 40960 bytes. For lists of json values, the size of the entire list must be within this limit. The maximum allowed length of a key is 128, while the maximum allowed size of a value is 10240 bytes and you can have up to 256 key-value pairs. The  byte sizes are computed by representing the data as a UTF-8 encoded JSON string.\nDirect relations use a space external-id and the external-id for an existing node. Only the target space existence is validated for records.\nTimestamps must be a string in the format 'YYYY-MM-DDTHH:MM:SS[.millis][Z|time zone]' with optional milliseconds having precision of 1-3 decimal digits and optional timezone with format Â±HH:MM, Â±HHMM, Â±HH or Z, where Z represents UTC, Year must be between 0001 and 9999.\nDates must be a date string in the format 'YYYY-MM-DD'. Year must be between 1 and 9999. "
          oneOf:
          - $ref: '#/components/schemas/RecordTextProperty'
          - $ref: '#/components/schemas/PrimitiveProperty'
          - $ref: '#/components/schemas/RecordDirectNodeRelation'
          - $ref: '#/components/schemas/EnumProperty'
    ContainerCreateCollection:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: List of containers to create/update
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContainerCreateDefinition'
    RecordDirectNodeRelation:
      type: object
      description: Direct node relation. Only the target space existence is validated for records. Target nodes are not auto-created.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - direct
        list:
          description: 'Specifies that the data type is a list of values. The ordering of values is preserved.

            '
          type: boolean
          default: false
        maxListSize:
          type: integer
          description: Specifies the maximum number of values in the list
  parameters:
    IncludeGlobal:
      name: includeGlobal
      in: query
      description: If the global items of the entity should be returned. Defaults to false which excludes global items.
      schema:
        type: boolean
        default: false
    FilterUsedFor:
      name: usedFor
      in: query
      description: Only include containers that have been marked as used for the specified purposes. Defaults to [node, edge, all]
      schema:
        type: array
        uniqueItems: true
        example:
        - node
        - edge
        - all
        - record
        items:
          $ref: '#/components/schemas/UsedFor'
    Space:
      in: query
      name: space
      description: The space to query.
      schema:
        type: string
        pattern: (?!^(space|cdf|dms|pg3|shared|system|node|edge)$)(^[a-zA-Z][a-zA-Z0-9_-]{0,41}[a-zA-Z0-9]?$)
        minLength: 1
        maxLength: 43
        example: timeseries
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
    ReducedLimit:
      name: limit
      description: Limit the number of results returned. The largest result-set returned by the server will be 1000 items, even if you specify a higher limit.
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 1000
  responses:
    ContainerCollectionResponseWithCursor:
      description: List of containers
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                description: List of containers
                items:
                  $ref: '#/components/schemas/ContainerDefinition'
              nextCursor:
                $ref: '#/components/schemas/NextCursorV3'
    ContainerCollectionResponse:
      description: List of containers
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                description: List of containers
                items:
                  $ref: '#/components/schemas/ContainerDefinition'
    ListOfContainerSubObjectIdentifierResponse:
      description: List of External id(s) for the affected items
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                  - space
                  - containerExternalId
                  - identifier
                  properties:
                    space:
                      $ref: '#/components/schemas/SpaceSpecification'
                    containerExternalId:
                      description: External id of the container
                      allOf:
                      - $ref: '#/components/schemas/DMSExternalId'
                    identifier:
                      type: string
    ContainerInspectResponse:
      description: Containers along with the results of the inspection operations
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                description: List of container inspection results
                items:
                  $ref: '#/components/schemas/ContainerInspectResultItem'
    ListOfSpaceExternalIdsResponse:
      description: List of External id(s) for the affected items
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: object
                  required:
                  - space
                  - externalId
                  properties:
                    externalId:
                      description: List of external id(s) for the requested items
                      allOf:
                      - $ref: '#/components/schemas/DMSExternalId'
                    space:
                      $ref: '#/components/schemas/SpaceSpecification'
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

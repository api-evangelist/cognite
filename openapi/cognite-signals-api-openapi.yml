      type: object
      title: WorkflowsSubscriptionFilter
      allOf:
      - $ref: '#/components/schemas/SubscriptionFilterUpdate'
      required:
      - topic
      properties:
        topic:
          type: string
          enum:
          - cognite_workflows
          description: Topic name.

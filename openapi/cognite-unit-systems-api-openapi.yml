openapi: 3.2.0
info:
  title: Cognite Unit Systems API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Unit Systems
  description: 'Unit system is a collection of default units for different quantities.

    This API provides a list of supported unit systems and their associated quantities and respective unit.'
paths:
  /units/systems:
    get:
      tags:
      - Unit Systems
      summary: List all unit systems
      description: List all unit systems.
      operationId: listUnitSystems
      responses:
        '200':
          description: Response with a list of unit systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList_UnitSystem_'
      x-code-samples:
      - lang: JavaScript
        label: JavaScript SDK
        source: const units = await client.units.listUnitSystems();
      - lang: Python
        label: Python SDK
        source: 'res = client.units.systems.list()

          '
components:
  schemas:
    ViewList_UnitSystem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnitSystem'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: ViewList[UnitSystem]
    UnitSystemQuantity:
      properties:
        name:
          type: string
          title: Name
          description: Name of the quantity
          example: Temperature
        unitExternalId:
          type: string
          title: UnitExternalId
          description: Default unit for the quantity
          example: temperature:deg_c
      additionalProperties: false
      type: object
      required:
      - name
      - unitExternalId
      title: UnitSystemQuantity
    UnitSystem:
      properties:
        name:
          type: string
          title: Name
          description: Name of the unit system
          example: SI
        quantities:
          items:
            $ref: '#/components/schemas/UnitSystemQuantity'
          type: array
          title: Quantities
          description: List of quantities and their default units
          example:
          - name: Temperature
            unitExternalId: temperature:deg_c
      additionalProperties: false
      type: object
      required:
      - name
      - quantities
      title: UnitSystem
      description: 'Unit System: A set of default units designated per quantity.


        An example being:


        - SI: Temperature in Kelvin, Pressure in Pa


        - SI (Engineering): Temperature in degrees Celsius, Pressure in bar


        - Imperial: Temperature in degrees Fahrenheit, Pressure in psi'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

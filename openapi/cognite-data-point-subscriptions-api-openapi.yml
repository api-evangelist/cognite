            property:
              $ref: '#/components/schemas/TimeSeriesFilterProperty'
            value:
              $ref: '#/components/schemas/TimeSeriesStringValue'
    SubscriptionLeafFilter:
      description: 'Leaf filter.

        '
      title: Leaf filter
      type: object
      oneOf:
      - $ref: '#/components/schemas/TimeSeriesEqualsFilter'
      - $ref: '#/components/schemas/TimeSeriesInFilter'
      - $ref: '#/components/schemas/TimeSeriesRangeFilter'
      - $ref: '#/components/schemas/TimeSeriesPrefixFilter'
      - $ref: '#/components/schemas/TimeSeriesExistsFilter'
      - $ref: '#/components/schemas/TimeSeriesContainsAnyFilter'
      - $ref: '#/components/schemas/TimeSeriesContainsAllFilter'
    SubscriptionsListDataRequest:
      type: object
      required:
      - partitions
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        partitions:
          type: array
          description: Pairs of (partition, cursor) to fetch from.
          items:
            $ref: '#/components/schemas/SubscriptionsDataPartitionRequestDTO'
        limit:
          type: integer
          description: Approximate number of results to return across all partitions. We will batch together groups of updates, where each group come from the same ingestion request. Thus, if a single group is large, it may exceed limit, otherwise we will return up to limit results. To check whether you have reached the end, do not rely on the count. Instead, check the `hasNext` field.
          minimum: 1
          maximum: 100000
          default: 100
        initializeCursors:
          type: string
          description: 'If `partitions.cursor` is not set, the default behaviour is to start from the beginning of the stream.

            `initializeCursors` can be used to override this behaviour.


            The format is "N[timeunit]-ago", where timeunit is w,d,h,m (week, day, hour, minute).

            For instance, "2d-ago" will give a stream of changes ingested up to 2 days ago.

            You can also use "now" to jump straight to the end of the stream.


            Note that initializeCursors is not exact; a deviation of some seconds can occur.'
        pollTimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 5
          default: 5
          description: 'The maximum time to wait for data to arrive, in seconds. As soon as data is available,

            the request will return immediately with the data. If the timeout is reached while

            waiting for data, the request will return an empty data response.'
        includeStatus:
          type: boolean
          description: 'Show the [status code](<https://docs.cognite.com/dev/concepts/reference/status_codes>) for each data point in the response.

            _Good_ (code = 0) status codes are always omitted.'
          default: false
        ignoreBadDataPoints:
          type: boolean
          description: 'Treat data points with a _Bad_ status code as if they do not exist.

            Set to false to include all data points.'
          default: true
        treatUncertainAsBad:
          type: boolean
          description: 'Treat data points with _Uncertain_ status codes as _Bad_.

            Set to false to include uncertain data points.'
          default: true
    TimeSeriesStringValue:
      title: String
      description: 'A value that you wish to find in the provided property.

        '
      type: string
      maxLength: 256
    SubscriptionsUpdateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required:
            - externalId
            - update
            title: Select by externalId
            properties:
              externalId:
                $ref: '#/components/schemas/CogniteExternalId'
              update:
                type: object
                properties:
                  timeSeriesIds:
                    description: Update subscription definition (not applicable for filter subscriptions).
                    type: object
                    oneOf:
                    - properties:
                        add:
                          type: array
                          description: List of external ids of time series to add to the subscription. Repeat this operation to add more time series, up to the limit of 10,000.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteExternalId'
                        remove:
                          type: array
                          description: List of external ids of time series to remove from the subscription. Repeat this operation to remove more time series.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteExternalId'
                      title: Add or remove time series
                    - properties:
                        set:
                          type: array
                          description: Replace the subscription's current list of time series with this list of external ids. To have more than 100 time series, use the `add` operation in subsequent update calls.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteExternalId'
                      title: Replace the entire list of time series
                  instanceIds:
                    description: Update subscription definition (not applicable for filter subscriptions).
                    type: object
                    oneOf:
                    - properties:
                        add:
                          type: array
                          description: List of instance ids of time series to add to the subscription. Repeat this operation to add more time series, up to the limit of 10,000.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteInstanceId'
                        remove:
                          type: array
                          description: List of instance ids of time series to remove from the subscription. Repeat this operation to remove more time series.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteInstanceId'
                      title: Add or remove time series
                    - properties:
                        set:
                          type: array
                          description: Replace the subscription's current list of time series with this list of instance ids. To have more than 100 time series, use the `add` operation in subsequent update calls.
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/CogniteInstanceId'
                      title: Replace the entire list of time series
                  name:
                    $ref: '#/components/schemas/NullableSinglePatchString'
                  description:
                    $ref: '#/components/schemas/NullableSinglePatchString'
                  dataSetId:
                    $ref: '#/components/schemas/NullableSinglePatchLong'
                  filter:
                    type: object
                    description: 'New filter definition of the subscription. This can only be used to

                      update a filter subscription. It is not possible to delete a filter,

                      you will have to delete the subscription.

                      This update is eventually consistent, there may be a period of time where

                      you get a mix of data, both from the old and the new filter.'
                    properties:
                      set:
                        $ref: '#/components/schemas/SubscriptionFilterLanguage'
    SubscriptionsDataUpsertsDTO:

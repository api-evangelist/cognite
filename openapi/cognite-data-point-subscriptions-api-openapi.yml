    SubscriptionsListDataResponse:
      type: object
      description: Subscription data along with cursors.
      required:
      - updates
      - partitions
      - hasNext
      properties:
        updates:
          type: array
          description: List of updates from the subscription, sorted by point in time they were applied to the time series. Every update contains a time series along with a set of changes to that time series.
          items:
            $ref: '#/components/schemas/SubscriptionsDataUpdateResponseDTO'
        subscriptionChanges:
          type: object
          description: 'If present, this object represents changes to the subscription definition. The

            subscription will now start/stop listening to changes from the time series

            listed here.


            These changes can be triggered by explicit changes through the _Update subscriptions_

            endpoint, or they can be caused by changes in time series, in that they start/stop

            matching the filter for the subscription.


            Time series are added to these lists when the change takes effect, which may be

            later than the actual trigger.


            The object is partitioned - it will only be present in the response for the relevant

            partition, from which the time series was added/removed.'
          properties:
            added:
              type: array
              description: Time series added to the subscription (for this partition).
              items:
                $ref: '#/components/schemas/GetTimeSeriesForSubscription'
            removed:
              type: array
              description: Time series removed from the subscription (for this partition).
              items:
                $ref: '#/components/schemas/GetTimeSeriesForSubscription'
        partitions:
          type: array
          description: List of partition/cursor pairs to use for the next request.
          items:
            type: object
            required:
            - index
            - nextCursor
            properties:
              index:
                type: integer
                description: Partition index.
              nextCursor:
                type: string
                description: 'Cursor to use in subsequent query, to fetch the next batch of updates.

                  The cursor will always be present, even if there are no more updates at the time.'
        hasNext:
          type: boolean
          description: 'Whether there is more data available at the time of the query.

            In rare cases, we may return true, even if there is no data available. If that is

            the case, just continue to query with the updated cursors,

            and it will eventually return false.'

openapi: 3.2.0
info:
  title: Cognite Schema Mappings API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Schema Mappings
  description: A **mapping** uses field and value mapping(s) to perform an in-flight transformation from source CDF entities to SAP S/4HANA entities. Mappings are written in the Cognite transformation language. For more details see the documentation.
paths:
  /writeback/sap/mappings:
    get:
      tags:
      - Schema Mappings
      operationId: list_schema_mappings
      x-capability:
      - sapWritebackAcl:READ
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        List all mappings in a given CDF project. If more instances exist than what the limit specifies, a pagination cursor is returned in the response body.'
      parameters:
      - $ref: '#/components/parameters/Writeback100Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsWithCursor_SchemaMapping_'
          description: List of mappings and an optional cursor.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: List Mappings
    post:
      tags:
      - Schema Mappings
      operationId: create_schema_mappings
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Create a maximum of 100 mappings.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Items_CreateSchemaMapping_'
        required: true
        description: Mappings to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_SchemaMapping_'
          description: List of created mappings
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Create Mappings
  /writeback/sap/mappings/byids:
    post:
      operationId: retrieve_schema_mappings
      x-capability:
      - sapWritebackAcl:READ
      tags:
      - Schema Mappings
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        Retrieve a list of up to 100 mappings by their external ID, optionally ignoring unknown IDs.'
      parameters:
      - in: header
        name: cdf-version
        required: false
        schema:
          title: Cdf-Version
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIds_ExternalId_'
        required: true
        description: List of external IDs of mappings to retrieve.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_Mapping_'
          description: List of retrieved mappings.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Retrieve Mappings
  /writeback/sap/mappings/delete:
    post:
      operationId: delete_schema_mappings
      x-capability:
      - sapWritebackAcl:WRITE
      tags:
      - Schema Mappings
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Delete a list of mappings by their external ID.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIds_ExternalId_'
        required: true
        description: List of external IDs of mappings to delete.
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
          description: Empty response
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Delete Mappings
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    CreateSchemaMapping:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        expression:
          type: string
          description: Custom transform expression written in the Cognite mapping language.
          maxLength: 2000
          example: "\n{\n \"SAPFieldA\": substring(input.CDFFieldA,0,40), \n \"SAPFieldB\": input.CDFFieldB, \n}\n"
      required:
      - externalId
      - expression
      title: Create SchemaMapping
      type: object
    SchemaMapping:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        expression:
          type: string
          description: Custom transform expression written in the Cognite mapping language.
          maxLength: 2000
          example: "\n{\n \"SAPFieldA\": substring(input.CDFFieldA,0,40), \n \"SAPFieldB\": input.CDFFieldB, \n}\n"
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
      required:
      - externalId
      - expression
      - lastUpdatedTime
      - createdTime
      title: SchemaMapping
      type: object
    XmlConfig:
      additionalProperties: false
      type: object
      title: XML
      description: 'Transform the input from an XML file to a JSON object.

        '
      properties:
        type:
          type: string
          enum:
          - xml
          description: Input type
          title: Type
      required:
      - type
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    Items_SchemaMapping_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SchemaMapping'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
      required:
      - items
      title: InstanceList
      type: object
    CustomMapping:
      type: object
      properties:
        expression:
          type: string
          description: Custom transform expression written in the Cognite transformation language.
          maxLength: 2000
      required:
      - expression
    InputConfig:
      type: object
      description: Optionally set input mapping input type. This defaults to json if left out. Any input type is converted to JSON before being passed to the mapping expression.
      discriminator:
        mapping:
          protobuf: '#/components/schemas/ProtobufConfig'
          csv: '#/components/schemas/CsvConfig'
          xml: '#/components/schemas/XmlConfig'
          json: '#/components/schemas/JsonConfig'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ProtobufConfig'
      - $ref: '#/components/schemas/CsvConfig'
      - $ref: '#/components/schemas/XmlConfig'
      - $ref: '#/components/schemas/JsonConfig'
    WritebackItemsWithIgnoreUnknownIds_ExternalId_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WritebackExternalIdWrapper'
          title: Items
          type: array
          maxItems: 100
          minItems: 1
        ignoreUnknownIds:
          type: boolean
          title: IgnoreUnknownIds
          description: Ignore IDs and external IDs that are not found
      required:
      - items
      title: ItemsWithIgnoreUnknownIds_ExternalId
      type: object
    ProtobufConfig:
      additionalProperties: false
      description: List of protobuf files used to define input to the mapping. This will be compiled to a collection of definitions which will be used to convert the input to JSON.
      title: ProtoBuf
      properties:
        type:
          type: string
          enum:
          - protobuf
          description: Input type
          title: Type
        messageName:
          type: string
          description: Name of root message in the protobuf files.
          maxLength: 128
          title: Message Name
        files:
          type: array
          maxItems: 20
          minItems: 1
          items:
            $ref: '#/components/schemas/ProtoFile'
      required:
      - messageName
      - files
      - type
    WritebackValidationErrorContent:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 422
        message:
          type: string
          description: Error message.
          example: 'Extra inputs are not permitted: type'
    Items_Mapping_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Mapping'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
      required:
      - items
      title: MappingList
      type: object
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    Mapping:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        mapping:
          $ref: '#/components/schemas/CustomMapping'
        input:
          $ref: '#/components/schemas/InputConfig'
        published:
          title: Published
          type: boolean
          description: Whether this mapping is published and should be available to be used in jobs.
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
      required:
      - externalId
      - mapping
      - published
      - lastUpdatedTime
      - createdTime
      - input
      title: Mapping
      type: object
    ProtoFile:
      additionalProperties: false
      description: Description of a protobuf file used for loading input to the mapping.
      properties:
        fileName:
          type: string
          title: File Name
          format: '[a-zA-Z0-9_-]+\.proto'
          maxLength: 128
          description: Name of protobuf file. Must contain only letters, numbers, underscores, and hyphens, and must end with '.proto'.
      required:
      - fileName
    Items_CreateSchemaMapping_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/CreateSchemaMapping'
          title: Items
          type: array
          minLength: 1
          maxLength: 100
      required:
      - items
      title: CreateSchemaMapping list
      type: object
    ItemsWithCursor_SchemaMapping_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SchemaMapping'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
        nextCursor:
          type: string
          title: Next cursor
          description: Cursor for pagination
      required:
      - items
      title: MappingList
      type: object
    WritebackExternalIdWrapper:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
      required:
      - externalId
      title: WritebackExternalIdWrapper
      type: object
    JsonConfig:
      additionalProperties: false
      type: object
      description: Treat the input as UTF-8 encoded JSON.
      title: JSON
      properties:
        type:
          type: string
          enum:
          - json
          description: Input type
          title: Type
      required:
      - type
    CsvConfig:
      additionalProperties: false
      type: object
      title: CSV
      description: 'Transform the input from a CSV (Comma Separated Values) file to a list of JSON objects. The input to the mapping will be a list on the form `[{\"header1\": \"value1\", ...}, ...]`.

        '
      properties:
        type:
          type: string
          enum:
          - csv
          description: Input type
          title: Type
        delimiter:
          type: string
          description: A single ASCII character used as the separator in the CSV file. Defaults to `,`
          maxLength: 1
          minLength: 1
          title: Delimiter
        customKeys:
          type: array
          minItems: 1
          maxItems: 20
          description: List of headers. If this is not set, the headers will be retrieved from the CSV file.
          items:
            type: string
            description: CSV file header value.
            title: CSV_Header
      required:
      - type
  parameters:
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
    Writeback100Limit:
      name: limit
      description: Limits the number of results to be returned. The maximum results returned by the server is 100 even if you specify a higher limit.
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 100
  responses:
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
    WritebackValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/WritebackValidationErrorContent'
    400ErrorResponse:
      description: The response for a bad request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
          example:
            error:
              code: 400
              message: '`null` values aren''t allowed.'
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

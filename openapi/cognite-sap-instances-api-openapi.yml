openapi: 3.2.0
info:
  title: Cognite SAP Instances API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: SAP Instances
  description: 'An SAP **instance** represents a configuration to an external SAP S/4HANA destination system. The **instance** resource

    contains all the information this API service needs to connect to an SAP S/4HANA destination.


    Supported SAP S/4HANA versions:

    * SAP S/4HANA OnPremise 2021 FPS01, and later

    * SAP S/4HANA Cloud'
paths:
  /writeback/sap/instances:
    get:
      tags:
      - SAP Instances
      operationId: list_instances
      x-capability:
      - sapWritebackAcl:READ
      parameters:
      - $ref: '#/components/parameters/Writeback100Limit'
      - $ref: '#/components/parameters/Cursor'
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        List all SAP instances in a given CDF project. If more instances exist than what the limit specifies, a pagination cursor is returned in the response body.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsWithCursor_Instance_'
          description: List of SAP instances, and an optional cursor.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
          description: Validation Error
      summary: List SAP Instances
    post:
      tags:
      - SAP Instances
      operationId: create_instances
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Create up to 100 SAP instances.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Items_CreateInstance_'
        required: true
        description: Instance to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_Instance_'
          description: List of created instances
        '400':
          $ref: '#/components/responses/400ErrorResponse'
          description: Response for a failed request
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Create SAP Instances
  /writeback/sap/instances/byids:
    post:
      tags:
      - SAP Instances
      operationId: retrieve_instances
      x-capability:
      - sapWritebackAcl:READ
      description: '> **Required capabilities:** `sapWritebackAcl:READ`


        Retrieve a list of up to 100 SAP instances by their external ID, optionally ignoring unknown IDs.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIds_ExternalId_'
        required: true
        description: List of external IDs of SAP instances to retrieve.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_Instance_'
          description: List of retrieved instances.
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Retrieve SAP Instances
  /writeback/sap/instances/delete:
    post:
      tags:
      - SAP Instances
      operationId: delete_instances
      x-capability:
      - sapWritebackAcl:WRITE
      description: '> **Required capabilities:** `sapWritebackAcl:WRITE`


        Delete a list of SAP instance configurations by their external ID. This operation will fail if any destination in the request is associated with an SAP endpoint configuration, unless the `force` query parameter is set to `true`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritebackItemsWithIgnoreUnknownIdsAndForce_ExternalId_'
        required: true
        description: List of SAP instance configuration external IDs to delete.
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
          description: Empty response
        '400':
          $ref: '#/components/responses/400ErrorResponse'
        '422':
          $ref: '#/components/responses/WritebackValidationError'
      summary: Delete SAP Instances
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    Instance:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
        gatewayUrl:
          title: gatewayUrl
          type: string
          description: SAP NetWeaver Gateway URL
        client:
          title: client
          type: integer
          description: SAP client number
        username:
          title: username
          type: string
          description: SAP username to use when connecting to the SAP NetWeaver Gateway URL
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
      required:
      - externalId
      - gatewayUrl
      - client
      - lastUpdatedTime
      - createdTime
      title: Instance
      type: object
    WritebackItemsWithIgnoreUnknownIds_ExternalId_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WritebackExternalIdWrapper'
          title: Items
          type: array
          maxItems: 100
          minItems: 1
        ignoreUnknownIds:
          type: boolean
          title: IgnoreUnknownIds
          description: Ignore IDs and external IDs that are not found
      required:
      - items
      title: ItemsWithIgnoreUnknownIds_ExternalId
      type: object
    CreateInstance:
      additionalProperties: false
      properties:
        externalId:
          title: External ID
          $ref: '#/components/schemas/CogniteExternalId'
        gatewayUrl:
          title: gatewayUrl
          type: string
          description: SAP NetWeaver Gateway URL
        client:
          title: client
          type: integer
          description: SAP client number
        username:
          title: username
          type: string
          description: SAP username to use when connecting to the SAP NetWeaver Gateway URL
        password:
          title: password
          type: string
          description: SAP password to use when connecting to the SAP NetWeaver Gateway URL
      required:
      - externalId
      - gatewayUrl
      - client
      - username
      - password
      title: CreateInstance
      type: object
    WritebackItemsWithIgnoreUnknownIdsAndForce_ExternalId_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WritebackExternalIdWrapper'
          title: Items
          type: array
          maxItems: 100
          minItems: 1
        ignoreUnknownIds:
          type: boolean
          title: IgnoreUnknownIds
          description: Ignore IDs and external IDs that are not found.
        force:
          type: boolean
          title: Force
          description: Delete any jobs associated with each item.
      required:
      - items
      title: ItemsWithIgnoreUnknownIdsAndForce_ExternalId
      type: object
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    WritebackValidationErrorContent:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 422
        message:
          type: string
          description: Error message.
          example: 'Extra inputs are not permitted: type'
    ItemsWithCursor_Instance_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Instance'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
        nextCursor:
          type: string
          title: Next cursor
          description: Cursor for pagination
      required:
      - items
      title: InstanceListWithCursor
      type: object
    WritebackExternalIdWrapper:
      additionalProperties: false
      properties:
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
      required:
      - externalId
      title: WritebackExternalIdWrapper
      type: object
    Items_Instance_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Instance'
          title: Items
          type: array
          maxItems: 100
          minItems: 0
      required:
      - items
      title: InstanceList
      type: object
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    Items_CreateInstance_:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/CreateInstance'
          title: Items
          type: array
          minLength: 1
          maxLength: 100
      required:
      - items
      title: CreateInstancelist
      type: object
  responses:
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    WritebackValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/WritebackValidationErrorContent'
    400ErrorResponse:
      description: The response for a bad request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
          example:
            error:
              code: 400
              message: '`null` values aren''t allowed.'
    EmptyResponse:
      description: Empty response.
      content:
        application/json:
          schema:
            type: object
  parameters:
    Writeback100Limit:
      name: limit
      description: Limits the number of results to be returned. The maximum results returned by the server is 100 even if you specify a higher limit.
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

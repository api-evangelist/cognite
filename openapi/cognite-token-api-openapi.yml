openapi: 3.2.0
info:
  title: Cognite Token API
  description: '# Introduction

    This is the reference documentation for the Cognite API with

    an overview of all the available methods.'
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Token
  description: Access tokens issued by an IdP (Azure AD, Google, etc.) are used to access CDF resources.
paths:
  /token/inspect:
    get:
      servers:
      - url: https://{cluster}.cognitedata.com/api/v1
        description: The URL for the CDF cluster to connect to
        variables:
          cluster:
            description: The CDF cluster to connect to
            default: api
            enum:
            - api
            - az-tyo-gp-001
            - az-eastus-1
            - az-power-no-northeurope
            - westeurope-1
            - asia-northeast1-1
            - gc-dsm-gp-001
      x-capability:
      - projectsAcl:LIST
      - groupsAcl:LIST
      tags:
      - Token
      summary: Inspect
      description: '> **Required capabilities:** `projectsAcl:LIST` `groupsAcl:LIST`


        Inspect CDF access granted to an IdP issued token'
      operationId: inspectToken
      responses:
        '200':
          description: Ok response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInspectionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
components:

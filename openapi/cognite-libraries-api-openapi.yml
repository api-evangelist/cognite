openapi: 3.1.0
info:
  title: Cognite 3D Asset Mapping Libraries API
  description: "# Introduction\nThis is the reference documentation for the Cognite API with\nan overview of all the available methods.\n\n# Postman\nSelect the **Download** button to download our OpenAPI specification to get started.\n\nTo import your data into Postman, select **Import**, and the Import modal opens.\nYou can import items by dragging or dropping files or folders. You can choose how to import your API and manage the import settings in **View Import Settings**.\n\nIn the Import Settings, set the **Folder organization** to **Tags**, select\n**Enable optional parameters** to turn off the settings, and select **Always inherit authentication** to turn on the settings. Select **Import**.\n\nSet the Authorization to **Oauth2.0**. By default, the settings are for Open Industrial Data. Navigate to [Cognite Hub](https://hub.cognite.com/open-industrial-data-211) to understand how to get the credentials for use in Postman.\n\nFor more information, see [Getting Started with Postman](https://developer.cognite.com/dev/guides/postman/).\n\n# Pagination\nMost resource types can be paginated, indicated by the field `nextCursor` in the response.\nBy passing the value of `nextCursor` as the cursor you will get the next page of `limit` results.\nNote that all parameters except `cursor` has to stay the same.\n\n# Parallel retrieval\nAs general guidance, Parallel Retrieval is a technique that should be used when due to query complexity, retrieval of data in a single request is significantly slower than it would otherwise be for a simple request.  Parallel retrieval does not act as a speed multiplier on optimally running queries.  By parallelizing such requests, data retrieval performance can be tuned to meet the client application needs. \n\nCDF supports parallel retrieval through the `partition` parameter, which has the format `m/n` where `n` is the amount of partitions you would like to split the entire data set into.\nIf you want to download the entire data set by splitting it into 10 partitions, do the following in parallel with `m` running from 1 to 10:\n  - Make a request to `/events` with `partition=m/10`.\n  - Paginate through the response by following the cursor as explained above. Note that the `partition` parameter needs to be passed to all subqueries.\n\nProcessing of parallel retrieval requests is subject to concurrency quota availability. The request returns the `429` response upon exceeding concurrency limits. See the Request throttling chapter below.\n\nTo prevent unexpected problems and to maximize read throughput, you should at most use 10 partitions. \nSome CDF resources will automatically enforce a maximum of 10 partitions.\nFor more specific and detailed information, please read the ```partition``` attribute documentation for the CDF resource you're using.  \n\n# Requests throttling\nCognite Data Fusion (CDF) returns the HTTP `429` (too many requests) response status code when project capacity exceeds the limit.\n\nThe throttling can happen:\n  - If a user or a project sends too many (more than allocated) concurrent requests.\n  - If a user or a project sends a too high (more than allocated) rate of requests in a given amount of time.\n\nCognite recommends using a retry strategy based on truncated exponential backoff to handle sessions with HTTP response codes 429.\n\nCognite recommends using a reasonable number (up to 10) of  `Parallel retrieval` partitions.\n\nFollowing these strategies lets you slow down the request frequency to maximize productivity without having to re-submit/retry failing requests.\n\nSee more [here](https://docs.cognite.com/dev/concepts/resource_throttling).\n\n# API versions\n## Version headers\nThis API uses calendar versioning, and version names follow the `YYYYMMDD` format.\nYou can find the versions currently available by using the version selector at the top of this page.\n\nTo use a specific API version, you can pass the `cdf-version: $version` header along with your requests to the API.\n\n## Beta versions\nThe beta versions provide a preview of what the stable version will look like in the future.\nBeta versions contain functionality that is reasonably mature, and highly likely to become a part of the stable API.\n\nBeta versions are indicated by a `-beta` suffix after the version name. For example, the beta version header for the\n2023-01-01 version is then `cdf-version: 20230101-beta`.\n\n## Alpha versions\nAlpha versions contain functionality that is new and experimental, and not guaranteed to ever become a part of the stable API.\nThis functionality presents no guarantee of service, so its use is subject to caution.\n\nAlpha versions are indicated by an `-alpha` suffix after the version name. For example, the alpha version header for\nthe 2023-01-01 version is then `cdf-version: 20230101-alpha`."
  version: v1
  contact:
    name: Cognite Support
    url: https://support.cognite.com
    email: support@cognite.com
servers:
- url: https://{cluster}.cognitedata.com/api/v1/projects/{project}
  description: The URL for the CDF cluster to connect to
  variables:
    cluster:
      enum:
      - api
      - az-tyo-gp-001
      - az-eastus-1
      - az-power-no-northeurope
      - westeurope-1
      - asia-northeast1-1
      - gc-dsm-gp-001
      default: api
      description: The CDF cluster to connect to
    project:
      default: publicdata
      description: The CDF project name.
security:
- oidc-token:
  - https://{cluster}.cognitedata.com/.default
- oauth2-client-credentials:
  - https://{cluster}.cognitedata.com/.default
- oauth2-open-industrial-data:
  - https://api.cognitedata.com/.default
- oauth2-auth-code:
  - https://{cluster}.cognitedata.com/.default
tags:
- name: Libraries
paths:
  /diagram-parsing/libraries:
    get:
      tags:
      - Libraries
      summary: List libraries
      description: '


        > **Required capabilities:** `diagramParsingAcl:READ`


        List all libraries defined in the current project.'
      operationId: listLibraries
      parameters:
      - $ref: '#/components/parameters/Cursor'
      x-capability:
      - diagramParsingAcl:READ
      responses:
        '200':
          $ref: '#/components/responses/LibrariesListWithCursorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
      - Libraries
      summary: Create libraries
      description: '


        > **Required capabilities:** `diagramParsingAcl:WRITE`


        Create libraries.'
      operationId: createLibraries
      requestBody:
        description: Libraries to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibrariesRequest'
        required: true
      x-capability:
      - diagramParsingAcl:WRITE
      responses:
        '200':
          $ref: '#/components/responses/LibrariesListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /diagram-parsing/libraries/{libraryId}:
    get:
      tags:
      - Libraries
      summary: Get a library with symbols
      description: '


        > **Required capabilities:** `diagramParsingAcl:READ`


        Returns a single library with all its symbols and geometries.'
      operationId: getExtendedLibrary
      parameters:
      - $ref: '#/components/parameters/libraryIdPath'
      x-capability:
      - diagramParsingAcl:READ
      responses:
        '200':
          $ref: '#/components/responses/ExtendedLibraryResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /diagram-parsing/libraries/{libraryId}/copy:
    post:
      tags:
      - Libraries
      summary: Copy library
      description: '


        > **Required capabilities:** `diagramParsingAcl:WRITE`


        Creates a new library by copying an existing library, including all its symbols and geometries.'
      operationId: copyLibrary
      parameters:
      - $ref: '#/components/parameters/libraryIdPath'
      requestBody:
        description: Name of the new library
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyLibraryInput'
        required: true
      x-capability:
      - diagramParsingAcl:WRITE
      responses:
        '200':
          $ref: '#/components/responses/CopyLibraryResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /diagram-parsing/libraries/byids:
    post:
      tags:
      - Libraries
      summary: Retrieve libraries
      description: '


        > **Required capabilities:** `diagramParsingAcl:READ`


        Retrieve up to 100 libraries by specifying their IDs.'
      operationId: multiGetLibraries
      requestBody:
        description: List of IDs for the libraries to return.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalIdsRequest'
        required: true
      x-capability:
      - diagramParsingAcl:READ
      responses:
        '200':
          $ref: '#/components/responses/LibrariesListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /diagram-parsing/libraries/delete:
    post:
      tags:
      - Libraries
      summary: Delete libraries
      description: '


        > **Required capabilities:** `diagramParsingAcl:WRITE`


        Delete up to 100 libraries by specifying their IDs.'
      operationId: deleteLibraries
      requestBody:
        description: List of libraries IDs to delete.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalIdsRequest'
        required: true
      x-capability:
      - diagramParsingAcl:WRITE
      responses:
        '200':
          $ref: '#/components/responses/ExternalIdsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /diagram-parsing/libraries/update:
    post:
      tags:
      - Libraries
      summary: Update libraries
      description: '


        > **Required capabilities:** `diagramParsingAcl:WRITE`


        Update the properties of a set of libraries.'
      operationId: updateLibraries
      requestBody:
        description: List of libraries to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibrariesRequest'
        required: true
      x-capability:
      - diagramParsingAcl:WRITE
      responses:
        '200':
          $ref: '#/components/responses/LibrariesListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    LibraryUpdateDraft:
      type: object
      properties:
        name:
          description: The name of the library
          type: string
    CogniteExternalId:
      description: The external ID provided by the client. Must be unique for the resource type.
      type: string
      maxLength: 255
      example: my.known.id
    ExtendedLibraryDto:
      description: Library with all of its symbols and geometries joined
      type: object
      required:
      - createdTime
      - externalId
      - lastUpdatedTime
      - name
      - scope
      - symbols
      properties:
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        externalId:
          description: The external ID of the library
          $ref: '#/components/schemas/CogniteExternalId'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
        name:
          description: The name of the library
          type: string
        scope:
          description: Global or project scope where the library is available
          $ref: '#/components/schemas/LibraryScope'
        symbols:
          description: List of symbols of this library
          type: array
          items:
            $ref: '#/components/schemas/ExtendedSymbolDto'
    GeometryDto:
      type: object
      required:
      - createdTime
      - externalId
      - lastUpdatedTime
      - paths
      - symbolId
      properties:
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        externalId:
          description: The external ID of the geometry
          $ref: '#/components/schemas/CogniteExternalId'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
        paths:
          type: array
          description: List of paths of this geometry
          items:
            $ref: '#/components/schemas/Path'
        symbolId:
          description: The external ID of a symbol the geometry belongs to
          $ref: '#/components/schemas/CogniteExternalId'
    DmsId:
      description: A DMS Identifier using the space and externalId
      type: object
      required:
      - space
      - externalId
      properties:
        space:
          type: string
        externalId:
          $ref: '#/components/schemas/CogniteExternalId'
    Path:
      description: SVG path in a custom format
      type: object
      required:
      - id
      - d
      properties:
        id:
          type: string
        d:
          description: The d attribute of an SVG path
          type: string
        styleId:
          description: The id of the style used for this path
          type: string
    Error:
      type: object
      required:
      - code
      - message
      description: Cognite API error.
      properties:
        code:
          type: integer
          description: HTTP status code.
          format: int32
          example: 401
        message:
          type: string
          description: Error message.
          example: Could not authenticate.
        missing:
          type: array
          description: List of lookup objects that do not match any results.
          items:
            type: object
            additionalProperties: true
        duplicated:
          type: array
          description: List of objects that are not unique.
          items:
            type: object
            additionalProperties: true
    UpdateLibrariesRequest:
      type: object
      required:
      - items
      description: List of libraries to update
      minItems: 1
      maxItems: 100
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            $ref: '#/components/schemas/LibraryUpdateItem'
    LibraryDto:
      type: object
      required:
      - createdTime
      - externalId
      - lastUpdatedTime
      - name
      - scope
      properties:
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        externalId:
          description: The external ID of the library
          $ref: '#/components/schemas/CogniteExternalId'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
        name:
          description: The name of the library
          type: string
        scope:
          description: Global or project scope where the library is available
          $ref: '#/components/schemas/LibraryScope'
    LibraryScope:
      description: Global or project scope where library is available
      type: string
      enum:
      - Global
      - Project
    LibraryUpdateItem:
      type: object
      required:
      - externalId
      - update
      properties:
        externalId:
          description: The external ID of the library
          $ref: '#/components/schemas/CogniteExternalId'
        update:
          description: The properties to be updated
          $ref: '#/components/schemas/LibraryUpdateDraft'
    EpochTimestamp:
      description: The number of milliseconds since 00:00:00 Thursday, 1 January 1970, Coordinated Universal Time (UTC), minus leap seconds.
      type: integer
      minimum: 0
      format: int64
      example: 1730204346000
    NextCursorV3:
      description: The cursor value used to return (paginate to) the next page of results, when more data is available.
      type: string
    LibraryCreateDraft:
      type: object
      required:
      - externalId
      - name
      properties:
        externalId:
          description: The external ID of the library
          $ref: '#/components/schemas/CogniteExternalId'
        name:
          description: The name of the library
          type: string
    ExtendedSymbolDto:
      description: Symbol with all of its geometries joined
      type: object
      required:
      - assetTypeId
      - externalId
      - geometries
      - lastUpdatedTime
      - libraryId
      properties:
        assetTypeId:
          $ref: '#/components/schemas/DmsId'
        createdTime:
          $ref: '#/components/schemas/EpochTimestamp'
        externalId:
          description: The external ID of the symbol
          $ref: '#/components/schemas/CogniteExternalId'
        geometries:
          description: List of geometries of this symbol
          type: array
          items:
            $ref: '#/components/schemas/GeometryDto'
        lastUpdatedTime:
          $ref: '#/components/schemas/EpochTimestamp'
        libraryId:
          description: The external ID of a library the symbol belongs to
          $ref: '#/components/schemas/CogniteExternalId'
    CreateLibrariesRequest:
      type: object
      required:
      - items
      description: List of libraries to create
      minItems: 1
      maxItems: 100
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            $ref: '#/components/schemas/LibraryCreateDraft'
    ExternalIdsRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - externalId
            properties:
              externalId:
                $ref: '#/components/schemas/CogniteExternalId'
    CopyLibraryInput:
      type: object
      required:
      - name
      properties:
        name:
          description: The name of the copied library
          type: string
  responses:
    LibrariesListResponse:
      description: List of libraries
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryDto'
    ExtendedLibraryResponse:
      description: A single library with its symbols and geometries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtendedLibraryDto'
    ExternalIdsResponse:
      description: List of external IDs returned in a response
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  $ref: '#/components/schemas/CogniteExternalId'
    CopyLibraryResponse:
      description: The copied library with its symbols and geometries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtendedLibraryDto'
    ErrorResponse:
      description: The response for a failed request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
    LibrariesListWithCursorResponse:
      description: List of libraries with next cursor
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryDto'
              nextCursor:
                $ref: '#/components/schemas/NextCursorV3'
  parameters:
    libraryIdPath:
      name: libraryId
      description: External ID of a library
      required: true
      in: path
      schema:
        $ref: '#/components/schemas/CogniteExternalId'
    Cursor:
      name: cursor
      description: 'Cursor for paging through results. In general, if a response contains a `nextCursor`

        property, it means that there may be more results, and you should pass that value as the

        `cursor` parameter in the next request.


        Note that the cursor may or may not be encrypted, but either way, it is not intended to be

        decoded. Its internal structure is not a part of the public API, and may change without

        notice. You should treat it as an opaque string and not attempt to craft your own cursors.

        '
      in: query
      schema:
        type: string
        example: 4zj0Vy2fo0NtNMb229mI9r1V3YG5NBL752kQz1cKtwo
  securitySchemes:
    oidc-token:
      type: http
      scheme: bearer
      bearerFormat: OpenID Connect or OAuth2 token
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
    oauth2-client-credentials:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-auth-code:
      type: oauth2
      description: Access token issued by the CDF project's configured identity provider. Access token must be an OpenID Connect token, and the project must be configured to accept OpenID Connect tokens. Use a header key of 'Authorization' with a value of 'Bearer $accesstoken'. The token can be obtained through any flow supported by the identity provider.
      flows:
        authorizationCode:
          authorizationUrl: https://your-idps.authorization.url/
          tokenUrl: https://your-idps.token.url/
          scopes:
            default: https://{cluster}.cognitedata.com/.default
    oauth2-open-industrial-data:
      type: oauth2
      description: Auth flow for Open Industrial Data. Get your client secret from https://hub.cognite.com/open-industrial-data-211.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/48d5043c-cf70-4c49-881c-c638f5796997/oauth2/v2.0/token
          scopes:
            default: https://api.cognitedata.com/.default
    org-oidc-token:
      type: openIdConnect
      openIdConnectUrl: https://auth.cognite.com/.well-known/openid-configuration
      description: 'Access token issued by the Cognite authorization server, and valid for the target organization. The token must

        be an OpenID Connect token, and it can be obtained by performing an OIDC login flow toward `auth.cognite.com`.

        This is a single URL for all CDF organizations.'

          - type: boolean
          - type: object
          - type: 'null'
          description: 'Default value that will be used if a value for this property is not explicitly specified.

            '
        description:
          type: string
          description: 'Description of the content and suggested use for this property.

            '
          maxLength: 1024
        name:
          type: string
          description: 'Readable property name.

            '
          maxLength: 255
        type:
          oneOf:
          - $ref: '#/components/schemas/RecordTextPropertyType'
          - $ref: '#/components/schemas/RecordDirectRelationPropertyType'
          - $ref: '#/components/schemas/RecordPrimitivePropertyType'
          - $ref: '#/components/schemas/RecordEnumPropertyType'
    RecordEnumValue:
      type: object
      description: 'Metadata for a single enum value.

        '
      properties:
        name:
          type: string
          description: 'Human-readable name for the enum value.

            '
          maxLength: 255
        description:
          type: string
          description: 'Description of the enum value.

            '
          maxLength: 1024
    EqualsFilterIla:
      type: object
      title: equals
      required:
      - equals
      properties:
        equals:
          type: object
          description: 'Matches records that contain the exact value in the provided property.

            Only apply this filter to properties containing a single value.

            '
          required:
          - property

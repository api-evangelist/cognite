          type: string
          description: 'Unit reference.

            '
    LastUpdatedTimeRangeValue:
      oneOf:
      - type: string
        minLength: 1
        maxLength: 100
      - type: integer
      title: lastUpdatedTimeRangeBound
      description: 'Timestamp value you wish to find in the ```record``` last updated time using a range clause.

        '
    SumAggregateResultIla:
      type: object
      title: sumResult
      required:
      - sum
      properties:
        sum:
          type: number
          description: 'The sum from the values of the specified in the request property.

            '
          example: 777
    RecordContainerTypeInformation:
      type: object
      description: Containers belonging to a space
      additionalProperties:
        x-additionalPropertiesName: property-identifier
        allOf:
        - $ref: '#/components/schemas/RecordPropertyTypeDefinition'
    FilterRecordsRequest:
      allOf:
      - type: object
        description: 'Defines a filter request. This will let you fetch records with some necessary properties filtered by different criteria.

          '
        properties:
          lastUpdatedTime:
            allOf:
            - $ref: '#/components/schemas/LastUpdatedTimeFilter'
          filter:

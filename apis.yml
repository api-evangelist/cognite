- aid: cognite:cognite-events-api
  name: Cognite Events API
  description: "Events objects store complex information about multiple assets over a time period.\nTypical\
    \ types of events that would be stored in this service might include Alarms, Process Data, and Logs.\\\
    \nFor the storage of low volume, manually generated, schedulable activities (such as maintenance schedules,\n\
    work orders or other â\x80\x98appointmentâ\x80\x99 type activities, the Data Modeling service is now\
    \ recommended.\n\n#### Important Note:\nEvents and Time Series are somewhat closely related in that\
    \ both are high volume types of data,\ncapable of recording data in microsecond resolutions.  However,\
    \ Events is not recommended as a Time Series store,\nsuch as where the data flow is from a single\
    \ instance of sensors (i.e. temperature, pressure, voltage),\nsimulators or state machines (on, off,\
    \ disconnected, etc).\\\nTime Series offers very low latency read and write performance, as well as\
    \ specialised filters and aggregations that\nare tailored to the analysis of time series data.\n\n\
    An eventâ\x80\x99s time period is defined by a start time and end time, both millisecond timestamps\
    \ since the UNIX epoch.\nThe timestamps can be in the future. In addition, events can have a text\
    \ description as well as arbitrary metadata and properties.\\\nWhen storing event information in metadata,\
    \ it should be considered that all data is stored as string format.\n\n#### Note:\nIn Events API,\
    \ timestamps are treated as strings when added to\nmetadata fields and arenâ\x80\x99t converted to\
    \ the userâ\x80\x99s local time zone.\n\n**Caveats:**\\\nDue to the eventually consistent nature of\
    \ Asset IDs stored in Events,\nit should be noted that Asset ID references obtained from the Events\
    \ API may\noccasionally be invalid (such as if an Asset ID is deleted,\nbut the reference to that\
    \ ID remains in the Event record for a time).\n\nAsset references obtained from an event - through\
    \ asset ids - may be\ninvalid, simply by the non-transactional nature of HTTP.\nThey are maintained\
    \ in an eventual consistent manner.\n\n## Rate and concurrency limits\n\nBoth the rate of requests\
    \ (denoted as request per second, or â\x80\x98**rps**â\x80\x99) and the number of concurrent (parallel)\
    \ requests are governed by limits,\nfor all CDF API endpoints.  If a request exceeds one of the limits,\n\
    it will be throttled with a `429: Too Many Requests` response. More on limit types\nand how to avoid\
    \ being throttled is described\n[here](https://docs.cognite.com/dev/concepts/resource_throttling).\n\
    \nLimits are defined at both the overall API service level, and on the API endpoints belonging to\
    \ the service.\\\nSome types of requests consume more resources (compute, storage IO) than others,\
    \ and where a service handles\nmultiple concurrent requests with varying resource consumption.\nFor\
    \ example, â\x80\x98CRUDâ\x80\x99 type requests (**C**reate, **R**etrieve, **R**equest ByIDs, **U**pdate\
    \ and **D**elete) are far less resource\nintensive than â\x80\x98Analyticalâ\x80\x99 type requests\
    \ (List, Search and Filter) and in addition, the most resource\nintensive Analytical endpoint of all,\
    \ Aggregates, receives its own request budget within the overall Analytical request budget.\\\nThe\
    \ version 1.0 limits for the overall API service and its constituent endpoints are illustrated in\
    \ the diagram below.\\\nThese limits are subject to change, pending review of changing consumption\
    \ patterns and resource availability over time:\n\n<img src=\"https://apps-cdn.cogniteapp.com/@cognite/docs-portal-images/1.0.0/images/api-docs/EventsLimitsNov23.png\"\
    \ alt=\" \" width=\"80%\"/>\n\n### Translating RPS into data speed\nA single request may retrieve\
    \ up to 1000 items.  In the context of Events, 1 item = 1 event record\\\nTherefore, the maximum theoretical\
    \ data speed at the top API service level is 200,000 items per second for all consumers,\nand 150,000\
    \ for a single identity or client in a project.\n\n### Use of Partitions / Parallel Retrieval\nAs\
    \ a general guidance, Parallel Retrieval is a technique that should be used where due to query complexity,\
    \ retrieval of data in a\nsingle request session turns out to be slow.  By parallelizing such requests,\
    \ data retrieval performance can be tuned to meet the\nclient application needs.  Parallel retrieval\
    \ may also be used where retrieval of large sets of data is required, up to the\ncapacity limits defined\
    \ for a given API service.  For example (using the Events API request budget):\n\n* A single request\
    \ may retrieve up to 1000 items\n* Up to 23 requests per second may be issued for an analytical query\
    \ (per identity), such as when using /list or /filter API endpoints\n* This provides a theoretical\
    \ maximum of 23,000 items read per second per identity\n* The query complexity may result in it taking\
    \ longer than 1s to read or write 1000 items in a single request\n* Therefore, it is appropriate to\
    \ specify the query to retrieve a lower number of items per request, and retrieve more items in parallel,\

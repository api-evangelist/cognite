- aid: cognite:cognite-time-series-api
  name: Cognite Time series API
  description: "A time series consists of a sequence of data points connected to a\nsingle asset. For\
    \ example, a water pump asset can have a temperature time\nseries that records a data point in units\
    \ of Â°C every second.\n\nA single asset can have several time series. The water pump could have additional\
    \ time series\nmeasuring pressure within the pump, rpm, flow volume, power consumption, and more.Time\n\
    series store data points as either numbers or strings. This is controlled by the\nis_string flag on\
    \ the time series object. Numerical data points can be aggregated\nbefore they are returned from a\
    \ query (e.g., to find the average temperature for\na day). String data points, on the other hand,\
    \ can't be aggregated by CDF but\ncan store arbitrary information like states (e.g., â\x80\x9Copenâ\x80\
    \x9D/â\x80\x9Dclosedâ\x80\x9D) or more complex\ninformation (JSON).\n\nCognite stores discrete data\
    \ points, but the underlying\nprocess measured by the data points can vary continuously. When interpolating\n\
    between data points, we can either assume that each value stays the same until\nthe next measurement\
    \ or linearly changes between the two measurements.\nThe `isStep` flag controls this on the time series\
    \ object. For example,\nif we estimate the average over a time containing two data points, the average\n\
    will either be close to the first (`isStep`) or close to the mean of the two (not\n`isStep`).\n\n\
    A data point stores a single piece of information, a number or a\nstring, associated with a specific\
    \ time. Data points are identified by their timestamps,\nmeasured in milliseconds since the unix epoch\
    \ -- 00:00:00.000, January 1st, 1970.\nThe time series service accepts timestamps in the range from\
    \ 00:00:00.000, January 1st, 1900\nthrough 23:59:59.999, December 31st, 2099 (in other words, every\
    \ millisecond in the two\ncenturies from 1900 to but not including 2100). Negative timestamps are\n\
    used to define dates before 1970. Milliseconds is the finest time resolution supported by CDF, i.e.,\n\
    fractional milliseconds are not supported. Leap seconds are not counted.\n\nNumerical data points\
    \ can be aggregated before they are retrieved from CDF. This allows for faster queries by reducing\n\
    the amount of data transferred. You can aggregate data points by specifying one\nor more aggregates\
    \ (e.g., average, minimum, maximum) as well as the time granularity\nover which the aggregates should\
    \ be applied (e.g., â\x80\x9C1hâ\x80\x9D for one hour).\n\nAggregates are aligned to the start time\
    \ modulo the granularity unit. For example, if you\nask for daily average temperatures since Monday\
    \ afternoon last week, the first\naggregated data point will contain averages for Monday, the second\
    \ for Tuesday,\netc. Determining aggregate alignment without considering data point timestamps\nallows\
    \ CDF to pre-calculate aggregates (e.g., to quickly return daily average temperatures\nfor a year).\
    \ Consequently, aggregating over 60 minutes can return a different\nresult than aggregating over 1\
    \ hour because the two queries will be aligned differently.\nAsset references obtained from a time\
    \ series - through its asset ID - may be invalid simply\nby the non-transactional nature of HTTP.\
    \ They are maintained in an eventually consistent\nmanner."
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Time Series
  tags_raw:
  - Time series

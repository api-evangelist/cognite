- aid: cognite:cognite-document-preview-api
  name: Cognite Document preview API
  description: >-
    The document preview service is a utility API that can render most document types as an image or PDF.

    This can be very helpful if you want to display a preview of a file in a frontend, or for other

    tasks that require one of these formats.


    For both rendered formats there is a concept of a page. The actual meaning of a page depends on

    the source document. E.g. an image will always have exactly one page, while a spreadsheet

    will typically have one page representing each individual sheet.


    The document preview service can only generate preview for document sizes that do not

    exceed 150 MiB. Trying to preview a larger document will give an error.


    ### File type support

    Previews can be created for the following types of files:

    - PDF files

    - Spreadsheets, documents and presentations from the Microsoft and Libre Office office suites

    - Images

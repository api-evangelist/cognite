- aid: cognite:cognite-data-sets-api
  name: Cognite Data sets API
  description: >-
    Data sets let you document and track data lineage, ensure data integrity, and allow 3rd parties to
    write their insights securely back to a Cognite Data Fusion (CDF) project.



    Data sets group and track data by its source. For example, a data set can contain all work orders
    originating from SAP. Typically, an organization will have one data set for each of its data ingestion
    pipelines in CDF.



    A data set consists of metadata about the data set, and the data objects that belong to the data set.
    Data objects, for example events, files, and time series, are added to a data set through the `dataSetId`
    field of the data object. Each data object can belong to only one data set.



    To learn more about data sets, see [getting started guide](https://docs.cognite.com/cdf/data_governance/concepts/datasets/)
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com

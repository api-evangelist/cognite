    url: openapi/cognite-annotations-api-openapi.yml
- aid: cognite:cognite-assets-api
  name: Cognite Assets API
  description: "The assets resource type stores digital representations of objects or\ngroups of objects\
    \ from the physical world. Assets are organized in hierarchies.\nFor example, a water pump asset can\
    \ be a part of a subsystem asset on an\noil platform asset.\n\n## Rate and concurrency limits\n\n\
    Both the rate of requests (denoted as request per second, or â\x80\x98**rps**â\x80\x99) and the number\
    \ of concurrent (parallel) requests are governed by limits,\nfor all CDF API endpoints.  If a request\
    \ exceeds one of the limits,\nit will be throttled with a `429: Too Many Requests` response. More\
    \ on limit types\nand how to avoid being throttled is described\n[here](https://docs.cognite.com/dev/concepts/resource_throttling).\n\
    \nLimits are defined at both the overall API service level, and on the API endpoints belonging to\
    \ the service.\\\nSome types of requests consume more resources (compute, storage IO) than others,\
    \ and where a service handles\nmultiple concurrent requests with varying resource consumption.\nFor\
    \ example, â\x80\x98CRUDâ\x80\x99 type requests (**C**reate, **R**etrieve, **R**equest ByIDs, **U**pdate\
    \ and **D**elete) are far less resource\nintensive than â\x80\x98Analyticalâ\x80\x99 type requests\
    \ (List, Search and Filter) and in addition, the most resource\nintensive Analytical endpoint of all,\
    \ Aggregates, receives its own request budget within the overall Analytical request budget.\\\nThe\
    \ version 1.0 limits for the overall API service and its constituent endpoints are illustrated in\
    \ the diagram below.\\\nThese limits are subject to change, pending review of changing consumption\
    \ patterns and resource availability over time:\n\n<img src=\"https://apps-cdn.cogniteapp.com/@cognite/docs-portal-images/1.0.0/images/api-docs/AssetsLimitsFeb2023.png\"\
    \ alt=\" \" width=\"80%\"/>\n\n### Translating RPS into data speed\nA single request may retrieve\
    \ up to 1000 items.  In the context of Assets, 1 item = 1 asset record\\\nTherefore, the maximum theoretical\
    \ data speed at the top API service level is 200,000 items per second for all consumers,\nand 150,000\
    \ for a single identity or client in a project.\n\n### Use of Partitions / Parallel Retrieval\nAs\
    \ a general guidance, Parallel Retrieval is a technique that should be used where due to query complexity,\
    \ retrieval of data in a\nsingle request session turns out to be slow.  By parallelizing such requests,\
    \ data retrieval performance can be tuned to meet the\nclient application needs.  Parallel retrieval\
    \ may also be used where retrieval of large sets of data is required, up to the\ncapacity limits defined\
    \ for a given API service.  For example (using the Assets API request budget):\n\n* A single request\
    \ may retrieve up to 1000 items\n* Up to 23 requests per second may be issued for an analytical query\
    \ (per identity), such as when using /list or /filter API endpoints\n* This provides a theoretical\
    \ maximum of 23,000 items read per second per identity\n* The query complexity may result in it taking\
    \ longer than 1s to read or write 1000 items in a single request\n* Therefore, it is appropriate to\
    \ specify the query to retrieve a lower number of items per request, and retrieve more items in parallel,\
    \ up to the theoretical maximum performance of 23,000 items per second.\n\n**Important Note:**\nParallel\
    \ retrieval should be only used in situations where, due to query complexity,\na single request flow\
    \ provides data retrieval speeds that are significantly less than the theoretical maximum.\\\nParallel\
    \ retrieval does not act as a speed multiplier on optimally running queries.  Regardless of the number\n\
    of concurrent requests issued, the overall requests per second limit still applies.\\\nSo for example,\
    \ a single request returning data at approximately 18,000 items per second will only\nbenefit from\
    \ adding a second parallel request, the capacity of which goes somewhat wasted\nas only an additional\
    \ 5,000 items per second will return before the request rate budget limit is reached."
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com

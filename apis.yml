- aid: cognite:cognite-sequences-api
  name: Cognite Sequences API
  description: >-
    A sequence stores a table with up to 400 columns indexed by row number. There can be at most 400 numeric
    columns and 200 string columns. Each of the columns has a pre-defined type: a string, integer, or
    floating point number.


    For example, a sequence can represent a curve, either with the dependent variable x as the row number
    and a single value column y, or can simply store (x,y) pairs in the rows directly. Other potential
    applications include data logs in which the index isn't time-based.

    To learn more about sequences, see the [concept guide](https://docs.cognite.com/dev/concepts/resource_types/sequences).
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Sequences
  properties:
  - type: OpenAPI
    url: openapi/cognite-sequences-api-openapi.yml
- aid: cognite:cognite-sessions-api
  name: Cognite Sessions API
  description: >-
    Sessions are used to maintain access to CDF resources for an extended period of time. The methods
    available to extend a sessions lifetime are client credentials and token exchange.

    Sessions depend on the project OIDC configuration and may become invalid in the following cases

    - Project OIDC configuration has been updated through the [update project](#operation/updateProject)
      endpoint. This action invalidates all of the project's sessions.

    - The session was invalidated through the identity provider.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Sessions
  properties:
  - type: OpenAPI
    url: openapi/cognite-sessions-api-openapi.yml
- aid: cognite:cognite-signals-api
  name: Cognite Signals API
  description: >-
    A signal is a notification that something has occurred in a CDF process. Users and systems may listen
    to signals by creating a sink and attaching subscriptions with a filter that matches the signals they
    are interested in.

    Subscriptions tie sinks to topics. Each topic represents some CDF resource like integrations or workflows.
    When a signal is emitted for a resource, all subscriptions for that resource's topic are evaluated.
    If the signal matches the subscription filter, it is pushed to the the sink.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Signals
  properties:
  - type: OpenAPI
    url: openapi/cognite-signals-api-openapi.yml
- aid: cognite:cognite-simulation-runs-api
  name: Cognite Simulation Runs API
  description: >-
    Every time a simulation routine executes, a simulation run object is created. This object ensures
    that each execution of a routine is documented and traceable. Each run has an associated simulation
    data resource, which stores the inputs and outputs of a simulation run, capturing the values set into
    and read from the simulator model to ensure the traceability and integrity of the simulation data.


    Simulation runs provide a historical record of the simulations performed, allowing users to analyze
    and compare different runs, track changes over time, and make informed decisions based on the simulation
    results.


    When simulation run load balancing is enabled and the routine is not assigned to any particular simulator
    integration, the run initiates with status `queued` and any active simulator integration can claim
    it automatically.

    Without load balancing, the run initiates with status `ready` and is tied to the simulator integration
    specified on the routine.


    #### Limitations:


    - A retention policy is in place for simulation runs, allowing up to 100000 entries.
      When this limit is reached, the oldest runs are deleted to make room for new ones.
    - The total size of all inputs for a simulation run can be a maximum of  50.00 KB.

    - The total size of simulation run data sent by the connector can be a maximum of  100.00 KB.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulation Runs
  properties:
  - type: OpenAPI
    url: openapi/cognite-simulation-runs-api-openapi.yml
- aid: cognite:cognite-simulator-integrations-api
  name: Cognite Simulator Integrations API
  description: >-
    The simulator integration resource represents a simulator connector in Cognite Data Fusion (CDF).
    It provides information about the configured connectors for a given simulator, including their status
    and additional details such as dataset, name, license status, connector version, simulator version,
    and more. This resource is essential for monitoring and managing the interactions between CDF and
    external simulators, ensuring proper data flow and integration.


    #### Limitations:


    - A project can have a maximum of 20 simulator integrations
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulator Integrations
  properties:
  - type: OpenAPI
    url: openapi/cognite-simulator-integrations-api-openapi.yml
- aid: cognite:cognite-simulator-logs-api
  name: Cognite Simulator Logs API
  description: >-
    Simulator logs track what happens during simulation runs, model parsing, and generic connector logic.
    They provide valuable information for monitoring, debugging, and auditing.


    Simulator logs capture important events, messages, and exceptions that occur during the execution
    of simulations, model parsing, and connector operations. They help users identify issues, diagnose
    problems, and gain insights into the behavior of the simulator integrations.


    #### Limitations:

    - A retention policy allows up to 10000 log entries per logId.
      When this limit is reached, the oldest logs are deleted to make room for new ones.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulator Logs
  properties:
  - type: OpenAPI
    url: openapi/cognite-simulator-logs-api-openapi.yml
- aid: cognite:cognite-simulator-models-api
  name: Cognite Simulator Models API
  description: >-
    The simulator model resource represents an asset modeled in a simulator. This asset could range from
    a pump or well to a complete processing facility or refinery.

    The simulator model is the root of its associated revisions, routines, runs, and results. The dataset
    assigned to a model is inherited by its children. Deleting a model also deletes all its children,
    thereby maintaining the integrity and hierarchy of the simulation data.


    Simulator model revisions track changes and updates to a simulator model over time. Each revision
    ensures that modifications to models are traceable and allows users to understand the evolution of
    a given model.


    #### Limitations:


    - A project can have a maximum of 1000 simulator models.

    - Each simulator model can have a maximum of 200 revisions.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulator Models
  properties:
  - type: OpenAPI
    url: openapi/cognite-simulator-models-api-openapi.yml
- aid: cognite:cognite-simulator-routines-api
  name: Cognite Simulator Routines API
  description: >-
    The simulator routine resource defines instructions on interacting with a simulator model. A simulator
    routine includes:

    - Inputs (values set into the simulator model)

    - Commands (actions to be performed by the simulator)

    - Outputs (values read from the simulator model)


    Simulator routines can have multiple revisions, enabling users to track changes and evolve the routine
    over time. Each model can have multiple routines, each performing different objectives such as calculating
    optimal operation setpoints, forecasting production, benchmarking asset performance, and more.


    #### Limitations:


    - A project can have a maximum of 10000 simulator routines.

    - Each simulator model can have a maximum of 10 simulator routines.

    - Each simulator routine can have a maximum of 10 revisions.

    - The total size of each routine revision can be a maximum of  50.00 KB.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulator Routines
  properties:
  - type: OpenAPI
    url: openapi/cognite-simulator-routines-api-openapi.yml
- aid: cognite:cognite-simulators-api
  name: Cognite Simulators API
  description: >-
    The simulator resource contains the definitions necessary for Cognite Data Fusion (CDF) to interact
    with a given simulator. It serves as a central contract that allows APIs, UIs, and integrations (connectors)
    to utilize the same definitions when dealing with a specific simulator.


    Each simulator is uniquely identified and can be associated with various file extension types, model
    types, step fields, and unit quantities. Simulators are essential for managing data flows between
    CDF and external simulation tools, ensuring consistency and reliability in data handling.


    #### Limitations:


    - A project can have a maximum of 100 simulators
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Simulators
  properties:

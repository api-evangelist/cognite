- aid: cognite:cognite-principals-api
  name: Cognite Principals API
  description: "**Principal** is an umbrella term for **user accounts** and **service accounts**. Both\
    \ entities can be uniquely identified, \nauthenticated, and authorized in CDF. Principals are unique\
    \ within an organization, and therefore also within a project in the \norganization. Principals can\
    \ access data and create and run processes (transformations, Functions) in a CDF project.\n\n* A **user\
    \ account** is associated with a **person** who wants to interact with CDF. Each user account has\
    \ a user \nprofile containing a unique user ID.\n* A **service account** is associated with an **application**\
    \ or **process** that wants to interact with CDF, such as \nan extractor or Cognite Functions, rather\
    \ than a person.\n\n## Authentication for this API\nRequests to the Principals API are directed to\
    \ `auth.cognite.com`, like for organizations.\n\nOnly OAuth tokens issued by `https://auth.cognite.com`\
    \ (such as the ones issued when logging into Fusion) are accepted\nby the Principals API.\n\nIt is\
    \ also possible to obtain a token by initiating a login flow against the authorization server directly.\
    \ See\nthe \"Authorizations\" sections for more information.\n\n## User Accounts\nThe Principals API\
    \ lets you query user accounts in an organization, and retrieve profiles."

  name: Cognite Vision API
  description: >-
    Vision API is deprecated. See [Deprecated and retired features](https://docs.cognite.com/cdf/deprecated)
    for details and timelines.


    The Vision contextualization endpoints enable extraction of information from imagery data based on
    their visual content. For example, you can detect external ID or name of assets, detect and read value
    of gauges or identify common industrial objects in images.


    This service has support for batch processing which enables processing of multiple image files via
    an asynchronous prediction request. A new contextualization job is triggered by sending a POST request
    to the service. The response of the POST request contains a job ID, which can then be used to make
    subsequent calls to check the status and retrieve the results of the job once it is completed.

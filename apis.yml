    Security categories can be used to restrict access to a resource.

    Applying a security category to a resource means that only principals (users or service accounts)
    that also have this security category can access the resource.

    To learn more about security categories please read [this page](https://developer.cognite.com/dev/guides/iam/authorization.html#security-categories).

    \n**Note:** Every `record` has a required top-level `externalId` property, which can be used\nin some\
    \ queries to retrieve or aggregate records (for filtering or sorting).\nFor mutable records, `externalId`\
    \ (together with `space`) uniquely identifies a record for write operations (create, upsert, delete).\n\

- aid: cognite:cognite-annotations-api
  name: Cognite Annotations API
  description: >-
    Annotations reflect contextual information in base CDF resource types, such as Files and Time series,
    that are not

    present on the object itself. The benefits of the annotations concept are threefold:


    - The annotations concept is a good fit for enriching the base resources themselves, so that the overall
    data
      quality is higher in a given project.
    - It is also a good fit for building reference datasets for data problems uniformly across customer
    projects.
      Product teams can then use those reference datasets to train machine learning models or validate
    the
      performance of their algorithms on actual customer data.
    - Given a uniform way of labelling similar concepts across projects, it becomes easy for apps to agree
    on a consistent
      visual representation of those concepts.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com

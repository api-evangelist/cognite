    \ concurrent (parallel)\nrequests are governed by limits for all CDF API endpoints. If a request exceeds\
    \ a limit,\nit will be throttled with a `429: Too Many Requests` response. See [Resource throttling](https://docs.cognite.com/dev/concepts/resource_throttling)\
    \ for limit types and how to avoid throttling.\n\nLimits apply to the API endpoints for this service.\n\
    Some request types consume more resources (compute, storage I/O) than others. For example, ingest\
    \ requests\nare less resource-intensive than analytical requests (Aggregate, Retrieve).\n\nLimits\
    \ for query endpoints (Sync, Retrieve, Aggregate) are hierarchical:\n- All query endpoints share a\
    \ common **Query request budget** (shown in the tables below)\n- The Retrieve endpoint has an **additional**\
    \ dedicated budget that is checked first\n- The Aggregate endpoint has an **additional** dedicated\
    \ budget that is checked first\n\nThe Sync endpoint only checks the Query request budget. The Retrieve\
    \ and Aggregate endpoints\nmust pass both their dedicated budget check AND the Query request budget\
    \ check.\n\nFor example, with mutable streams you can make up to 40 rps total across all query endpoints\n\
    (Query budget limit), but only up to 20 of those can be Retrieve requests (Retrieve budget limit)\n\
    and only up to 15 can be Aggregate requests (Aggregate budget limit).\nThat means you could send 20\
    \ Retrieve + 15 Aggregate + 5 Sync = 40 total RPS.\n\nQuery performance and rate limits vary between\
    \ mutable and immutable streams because of\ntheir different storage characteristics.\n\nMutable streams\
    \ provide consistent high-performance queries and higher rate limits\n(see \"mutable streams\" limits\

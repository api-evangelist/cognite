- aid: cognite:cognite-streams-api
  name: Cognite Streams API
  description: "Use the streams and records API to build high-volume extensions to industrial knowledge\
    \ graphs that are built with [Data Modeling](https://docs.cognite.com/cdf/dm).\nThe streams API lets\
    \ you manage the streams that are used for storing records.\nWith the API you can create, list, retrieve,\
    \ and delete streams, and view stream settings and statistics.\n\nA stream defines the data lifecycle,\n\
    and not schema, type or source. Multiple different sets of data which have\nnothing in common can\
    \ be put into the same stream, provided that settings of this stream\nfit lifecycle and usage patterns\
    \ (volume, rate, etc) of the data involved.\n\nStreams can be either mutable or immutable, which affects\
    \ how records can be modified,\nstorage capacity limits, and query performance characteristics.\n\n\
    Mutable streams allow records to be updated and deleted by the user. They provide\nconsistent low-latency\
    \ access and optimal query performance.\nHowever, the total number of records that can be stored is\
    \ limited. Mutable streams are\nwell-suited for use cases requiring frequent data access and updates.\n\
    \nImmutable streams do not allow records to be updated or deleted by the user, but support\ningestion\
    \ of very large amounts of data. Query performance may vary depending on the age\nof the data being\
    \ accessed, as the system optimizes storage over time.\n\nTo delete all data in a stream, the stream\
    \ itself should be deleted. To protect against irretrievable erroneous deletion,\nstreams are 'soft\
    \ deleted' allowing them to be recovered for up to 6 weeks after the time of deletion.\nThe template\
    \ used to create the stream determines the actual recovery time.\n\nA single project has a limited\
    \ number of soft deleted streams at any given time. To avoid hitting this limit, please\navoid using\
    \ any pattern of create and delete streams in a high frequency.\nPlease note that we expect streams\
    \ to be long lived. The exception are streams created\nwith one of the `test` templates. Deleting\
    \ a stream can take a long time.\nHow long depends on the stream settings and the volume of data stored.\n\
    While a stream is soft deleted, it is not possible to recreate a stream with the same identifier as\
    \ the deleted stream.\n\nOnce a stream is deleted, it does not count as one of the active streams,\
    \ and more streams can be\ncreated to serve as active streams. If a stream is accidentally deleted,\
    \ it is possible to recover\nthe data by contacting [Cognite Support](https://cognite.zendesk.com/hc/en-us/requests/new).\n\
    You must contact Cognite no less than 1 week prior to the expiration of the stream retention period\n\
    to ensure we can recover the data.\n\n## Available stream templates\n\n**Note: Stream Templates are\
    \ in Beta**\n\nThe current Stream Templates are in beta. This means:\n- New templates may be added\
    \ based on customer needs\n- Existing templates may be modified or removed if necessary\n- Such modifications\
    \ will **not affect existing streams** created from these templates\n\nChoose your template carefully\
    \ for production use, as templates cannot be changed after stream creation.\n\nThis section lists\
    \ all currently available templates that can be used for creating streams.\n\n### Immutable streams\n\
    \n#### ImmutableTestStream\n\nThis template should be used exclusively for experimentation. It is\
    \ configured for high throughput\nand total data volume, but has a short data retention period. Low\
    \ retention in a soft-deleted state\nmeans that such streams can be quickly discarded when no longer\
    \ needed or recreated to remove the experimental data.\n\n**Note:** This template should never be\
    \ used for production purposes. As this template\nallows significant load on the system, if we detect\
    \ improper usage\npatterns, we can change setting of streams created from this template as a last\
    \ resort.\n\n- Maximum total number of records - 50 M (50,000,000)\n- Maximum total data volume -\
    \ 50 GB\n- Data retention - 7 days\n- Maximum ingestion throughput (per 10 minutes) - 1.5 GB\n- Maximum\
    \ reading throughput (per 10 minutes) - 1.5 GB\n- Maximum records ingested (per 10 minutes) - 800,000\
    \ items\n- Maximum unique properties with data across all records - 1000\n- Maximum range filter interval\
    \ for the `lastUpdatedTime` property - 7 days\n- Stream soft-delete retention (before hard delete)\
    \ - 1 day\n- Maximum active streams per project - 3\n\n#### BasicArchive\n\nThis template is intended\
    \ for perpetual storage of data. However, overall data volume\nis limited, which needs to be taken\
    \ into account when planning usage.\n\n- Maximum total number of records - 50 M (50,000,000)\n- Maximum\
    \ total data volume - 50 GB\n- Data retention - Unlimited (data never gets deleted)\n- Maximum ingestion\
    \ throughput (per 10 minutes) - 170 MB\n- Maximum reading throughput (per 10 minutes) - 1.7 GB\n-\
    \ Maximum records ingested (per 10 minutes) - 170,000 items\n- Maximum unique properties with data\
    \ (across all records) - 1000\n- Maximum range filter interval for the `lastUpdatedTime` property\
    \ - 365 days\n- Stream soft-delete retention (before hard delete) - 6 weeks\n- Maximum active streams\
    \ per project - 2\n\n### Mutable streams\n\n#### BasicLiveData\n\nThis template is intended for production\
    \ usage and offers significant data volume\nand throughput.\n\n- Maximum total number of records -\
    \ 5 M (5,000,000)\n- Maximum total data volume - 15 GB\n- Maximum ingestion throughput (per 10 minutes)\
    \ - 170 MB\n- Maximum reading throughput (per 10 minutes) - 500 MB\n- Maximum records ingested (per\
    \ 10 minutes) - 170,000 items\n- Maximum records updated or deleted (per 10 minutes) - 85,000 items\n\
    - Maximum unique properties with data (across all records) - 1000\n- Stream soft-delete retention\
    \ (before hard delete) - 6 weeks\n- Maximum active streams per project - 1\n\n\n## Rate and concurrency\
    \ limits\n\nBoth the rate of requests (denoted as request per second (â\x80\x98**rps**â\x80\x99))\
    \ and the number of concurrent (parallel)\nrequests are governed by limits, for all CDF API endpoints.\
    \ If a request exceeds one of the limits,\nit will be throttled with a `429: Too Many Requests` response.\n\
    See [Resource throttling](https://docs.cognite.com/dev/concepts/resource_throttling) for limit types\
    \ and how to avoid throttling.\n\nAs streams are intended to be long-lived, users are not expected\
    \ to interact with these endpoints frequently.\n\nThe version limits for the streams endpoints are\
    \ illustrated in the tables below.\nThese limits are subject to change, pending review of changing\
    \ consumption patterns and resource availability over time:\n\n<table>\n  <thead>\n    <tr>\n    \
    \  <th colspan=\"3\" style=\"text-align: center; background-color: #e0e0e0; padding: 10px; font-weight:\
    \ bold;\">Create and Delete request budget</th>\n    </tr>\n    <tr>\n      <th></th>\n      <th style=\"\
    text-align: center;\">Overall</th>\n      <th style=\"text-align: center;\">Per ID</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Requests per second</strong></td>\n      <td style=\"\
    text-align: center;\">2</td>\n      <td style=\"text-align: center;\">1</td>\n    </tr>\n    <tr>\n\
    \      <td><strong>Concurrent requests</strong></td>\n      <td style=\"text-align: center;\">1</td>\n\
    \      <td style=\"text-align: center;\">1</td>\n    </tr>\n  </tbody>\n</table>\n\n<table>\n  <thead>\n\
    \    <tr>\n      <th colspan=\"3\" style=\"text-align: center; background-color: #e0e0e0; padding:\
    \ 10px; font-weight: bold;\">Retrieve and List request budget</th>\n    </tr>\n    <tr>\n      <th></th>\n\

- aid: cognite:cognite-data-point-subscriptions-api
  name: Cognite Data point subscriptions API
  description: "A data point subscription is a way to listen to changes to time series data points, in\
    \ ingestion order.\n\nA single subscription can listen to many time series, and a time series can\
    \ be part of many subscriptions.\n\nYou listen to subscriptions by calling the â\x80\x9Clist subscription\
    \ dataâ\x80\x9C endpoint. It will return\na list of data point upserts and deleted ranges, together\
    \ with a cursor to retrieve the next\nbatch of updates. Updates written since the creation of the\
    \ subscription, up to 7 days ago, can be\nretrieved through the subscription.\n\nSubscriptions can\
    \ be defined explicitly through a list of time series external ids and\ninstance ids, or implicitly\
    \ through a filter. The filter is a subset of the advanced filter\nquery in the regular â\x80\x9C\
    time series searchâ\x80\x9C endpoint.\n\nPartitions:\nSubscriptions can be further divided into a\
    \ number of partitions, for the purpose of\nfetching subscription data in parallel. Each partition\
    \ will return data in ingestion order,\nbut the order between partitions is not guaranteed.\n\nLimitations:\n\
    - Each subscription can have at most 10000 time series.\n- A time series can be part of at most 10\
    \ subscriptions.\n- A project can have at most 1000 subscriptions, of which 100 are filter subscriptions.\n\
    - Time series with security categories can not be shown in filter subscriptions.\n- Time series with\
    \ neither external id nor instance id cannot be added to non-filter subscriptions.\n- The number of\
    \ partitions cannot be changed after creation.\n\nAccess control:\nYou need READ access to subscriptions\
    \ ACL to read/list\nsubscriptions or list data, and you need WRITE access to create/update/delete\
    \ subscriptions.\nFurthermore, you need READ access to the time series you want to get updates from.\n\
    For filter subscriptions, you either need READ access to all time series, or the filter must\nbe restricted\
    \ according to your access rights (e.g. by filtering on specific data set IDs).\n\nSubscriptions can\
    \ have data sets that allow for more granular access\ncontrol. The data set on a subscription does\
    \ not influence the data\nstream, but allows you to restrict who can read/update the subscription.\n\
    \nName of ACL:\n  `timeSeriesSubscriptionsAcl`\n\nSupported actions:\n  - `READ`\n  - `WRITE`\n\n\
    Example capabilities:\n```\n[\n    {\"timeSeriesAcl\":{\"actions\":[\"READ\"], \"scope\":{\"all\"\
    :{}}}},\n    {\"timeSeriesSubscriptionsAcl\":{\"actions\":[\"WRITE\", \"READ\"], \"scope\":{\"all\"\
    :{}}}}\n]\n```"
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:
  - Data point subscriptions
  properties:
  - type: OpenAPI
    url: openapi/cognite-data-point-subscriptions-api-openapi.yml
- aid: cognite:cognite-data-products-api
  name: Cognite Data products API
  description: >-
    Data products are governed, ready-for-consumption data assets derived from data domains, following
    data mesh principles.

      **Key characteristics:**
      - **Clear ownership**: Defined data product owners with explicit access roles and accountability
      - **Rich metadata**: Comprehensive data modeling views, usage terms, access permissions, and descriptive
    documentation
      - **Self-service consumption**: Discoverable and well-documented for autonomous data consumer access
      - **Version management**: Immutable data modeling view versions with governed schemas and updatable
    metadata

      Data products act as a governance layer around data modeling, establishing trust and reliability
    for business decisions through clear ownership, comprehensive metadata, and standardized access patterns.

      **Space ownership**: A data product owns a schema space. The data modeling views that the data product
    governs live in that schema space. The schema space is exclusively owned by the data product.
  humanURL: https://api-docs.cognite.com/
  baseURL: https://api.cognitedata.com
  tags:

    \ are created in two steps; First the metadata is stored in a file\nobject, and then the file contents\
    \ are uploaded. This means that files can\nexist in a non-uploaded state. The upload state is reflected\
    \ in the 'uploaded'\nfield in responses.\n\nAsset references obtained from a file - through asset\
    \ ids - may be\ninvalid, simply by the non-transactional nature of HTTP.\nThey are maintained in an\
    \ eventual consistent manner.\n\n## Rate and concurrency limits\n\nBoth the rate of requests (denoted\
    \ as request per second, or â\x80\x98**rps**â\x80\x99) and the number of concurrent (parallel) requests\
    \ are governed by limits,\nfor all CDF API endpoints.  If a request exceeds one of the limits,\nit\
    \ will be throttled with a `429: Too Many Requests` response. More on limit types\nand how to avoid\
    \ being throttled is described\n[here](https://docs.cognite.com/dev/concepts/resource_throttling).\n\
    \nLimits are defined at both the overall API service level, and on the API endpoints belonging to\
    \ the service.\nSome types of requests consume more resources (compute, storage IO) than others, and\
    \ where a service handles\nmultiple concurrent requests with varying resource consumption.\nFor example,\
    \ â\x80\x98CRUDâ\x80\x99 type requests (**C**reate, **R**etrieve, **R**equest ByIDs, **U**pdate and\
    \ **D**elete and similar) are far less resource\nintensive than â\x80\x98Analyticalâ\x80\x99 type\
